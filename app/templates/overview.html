<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>YuJian AI Model Factory</title>
  <style>
    body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f7f7f8;color:#171717}
    main{max-width:1180px;margin:0 auto;padding:28px}
    .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
    h1{margin:0;font-size:28px}.muted{color:#6b7280}.link{color:#111827;text-decoration:none;font-weight:600}
    .cards{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.card{background:white;border:1px solid #e5e7eb;border-radius:14px;padding:16px}
    .num{font-size:28px;font-weight:700;margin-top:6px}.section{margin-top:22px;background:white;border:1px solid #e5e7eb;border-radius:14px;padding:18px}
    table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee;font-size:14px}th{color:#6b7280;font-weight:600}
    .bar{height:8px;background:#eee;border-radius:99px;overflow:hidden}.fill{height:100%;background:#111827}.pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#f0f1f3;font-size:12px}
    @media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
<main>
  <div class="top"><div><h1>YuJian AI Model Factory</h1><div class="muted">Review / Registry V1</div></div><a class="link" href="/review">进入 Review Queue →</a></div>
  <div id="cards" class="cards"></div>
  <div class="section"><h2>鱼种数据分布</h2><table><thead><tr><th>鱼种</th><th>数量</th><th>占比</th></tr></thead><tbody id="species"></tbody></table></div>
  <div class="section"><h2>数据批次</h2><table><thead><tr><th>Batch</th><th>来源</th><th>图片</th><th>Approved</th><th>Pending</th><th>Rejected</th><th>状态</th></tr></thead><tbody id="batches"></tbody></table></div>
</main>
<script>
async function load(){
  const o=await (await fetch('/api/overview')).json();
  const cards=[['Batches',o.batch_count],['Total',o.total_images],['Approved',o.review.approved],['Pending',o.review.pending],['Needs Review',o.review.needs_review],['Rejected',o.review.rejected]];
  document.getElementById('cards').innerHTML=cards.map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="num">${x[1]}</div></div>`).join('');
  const total=Math.max(o.total_images,1);
  document.getElementById('species').innerHTML=o.species.map(x=>`<tr><td>${x.species||'unknown'}</td><td>${x.count}</td><td><div class="bar"><div class="fill" style="width:${(x.count/total*100).toFixed(1)}%"></div></div></td></tr>`).join('');
  const b=await (await fetch('/api/batches')).json();
  document.getElementById('batches').innerHTML=b.map(x=>`<tr><td>${x.batch_id}</td><td>${x.source}</td><td>${x.image_count}</td><td>${x.review.approved||0}</td><td>${x.review.pending||0}</td><td>${x.review.rejected||0}</td><td><span class="pill">${x.status}</span></td></tr>`).join('');
}
load();
</script>
</body>
</html>
