name: P0 GPU Worker Project Check

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  VM: fish-completion-worker
  ZONE: us-central1-a
  CANDIDATE_PROJECTS: gemini-api-project-503706 gen-lang-client-0224022273

jobs:
  check-projects:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3.0.0
        with:
          project_id: gemini-api-project-503706
          workload_identity_provider: projects/571785698442/locations/global/workloadIdentityPools/github-actions/providers/yujian-main
          service_account: yujian-github-deployer@gemini-api-project-503706.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3.0.1
        with:
          project_id: gemini-api-project-503706
          version: '>= 416.0.0'
      - name: Compare VM project candidates
        shell: bash
        run: |
          set -u
          gcloud auth list --filter=status:ACTIVE --format='table(account,status)'
          for PROJECT_ID in ${CANDIDATE_PROJECTS}; do
            echo "=== PROJECT=${PROJECT_ID} ZONE=${ZONE} VM=${VM} ==="
            set +e
            gcloud compute instances describe "${VM}" --project="${PROJECT_ID}" --zone="${ZONE}" --format='yaml(name,status,networkInterfaces,tags.items)' 2>&1
            RC=$?
            set -e
            echo "DESCRIBE_RC=${RC}"
          done
