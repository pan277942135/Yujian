name: Temporary Qwen Narrow Runtime Diagnostics

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GPU_PROJECT: gen-lang-client-0224022273
  VM_NAME: fish-completion-worker
  ZONE: us-central1-a
  DEPLOY_PROJECT: gemini-api-project-503706
  WIF_PROVIDER: projects/571785698442/locations/global/workloadIdentityPools/github-actions/providers/yujian-main
  DEPLOY_SERVICE_ACCOUNT: yujian-github-deployer@gemini-api-project-503706.iam.gserviceaccount.com

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3.0.0
        with:
          project_id: ${{ env.DEPLOY_PROJECT }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3.0.1
        with:
          project_id: ${{ env.DEPLOY_PROJECT }}
          version: '>= 416.0.0'

      - name: Read-only VM and worker diagnostics
        shell: bash
        run: |
          set -u
          evidence="$RUNNER_TEMP/qwen-narrow-diagnostics"
          mkdir -p "$evidence"
          remote_script="$RUNNER_TEMP/qwen-narrow-diagnostics.sh"
          cat > "$remote_script" <<'REMOTE'
          #!/usr/bin/env bash
          set +e
          out="/tmp/qwen-narrow-diagnostics"
          mkdir -p "$out"
          date -u +%s > "$out/collected_at_epoch.txt"
          date -u > "$out/collected_at_utc.txt"
          sudo systemctl status fish-qwen-refine-worker --no-pager > "$out/systemd_status.txt" 2>&1
          sudo systemctl show fish-qwen-refine-worker -p MainPID -p ActiveEnterTimestamp -p ExecStart -p Environment > "$out/systemd_show.txt" 2>&1
          sudo systemctl cat fish-qwen-refine-worker > "$out/systemd_unit.txt" 2>&1
          curl -sS --max-time 20 http://127.0.0.1:8002/health > "$out/health.json" 2>&1
          nvidia-smi > "$out/nvidia-smi.txt" 2>&1
          nvidia-smi --query-gpu=name,index,memory.total,memory.used,memory.free,utilization.gpu,power.draw --format=csv > "$out/nvidia-query.csv" 2>&1
          nvidia-smi --query-compute-apps=pid,process_name,used_memory --format=csv > "$out/nvidia-apps.csv" 2>&1
          ps -ef --forest > "$out/ps-forest.txt" 2>&1
          ps -eo pid,ppid,etime,%cpu,%mem,rss,vsz,stat,cmd --sort=-%mem > "$out/ps-memory.txt" 2>&1
          sudo systemctl --type=service --all | grep -Ei 'fish|qwen|portrait|comfy' > "$out/fish-services.txt" 2>&1
          ss -ltnp > "$out/listening.txt" 2>&1
          free -h > "$out/free-h.txt" 2>&1
          swapon --show > "$out/swapon.txt" 2>&1
          sudo journalctl -u fish-qwen-refine-worker -n 500 --no-pager -o short-iso-precise > "$out/qwen-journal.txt" 2>&1
          sudo journalctl -n 300 --no-pager -o short-iso-precise | grep -Ei 'comfy|qwen|cuda|oom|swap|offload|low.?vram|execution|queue' > "$out/system-journal-qwen.txt" 2>&1
          find /opt/fish-qwen-refine-worker -maxdepth 2 -type f -printf '%p\t%s bytes\t%TY-%Tm-%Td %TH:%TM:%TS\n' | sort > "$out/worker-files.txt" 2>&1
          grep -Rni --exclude-dir=.git -E 'offload|cpu_offload|model_cpu_offload|sequential|lowvram|low_vram|novram|reserve-vram|unload|smart_memory|width|height|resize|scale|latent|1024|768|cfg|negative_prompt|true_cfg' /opt/fish-qwen-refine-worker > "$out/worker-grep.txt" 2>&1
          sed -n '1,520p' /opt/fish-qwen-refine-worker/worker.py > "$out/worker.py.txt" 2>&1
          cat /opt/fish-qwen-refine-worker/config.yaml > "$out/config.yaml.txt" 2>&1
          cat /opt/fish-qwen-refine-worker/qwen2511_api.json > "$out/qwen2511_api.json" 2>&1
          curl -fsS --max-time 30 http://127.0.0.1:8188/object_info/FluxKontextImageScale > "$out/object_info_flux_kontext.json" 2>&1
          curl -fsS --max-time 30 http://127.0.0.1:8188/object_info/ImageScale > "$out/object_info_image_scale.json" 2>&1
          find /opt/comfyui-qwen/custom_nodes -maxdepth 5 -type f -print 2>/dev/null | sort > "$out/comfy-custom-node-files.txt"
          grep -Rni --exclude="*.pyc" --exclude="*.json" -E "class.*FluxKontextImageScale|FluxKontextImageScale|class.*ImageScale" /opt/comfyui-qwen/custom_nodes /opt/comfyui-qwen/comfy 2>/dev/null > "$out/comfy-scale-code-grep.txt" || true
          find /opt /usr/local /home -name nodes_flux.py -type f 2>/dev/null | sort > "$out/nodes_flux_paths.txt"
          /opt/comfyui-qwen/.venv/bin/python - <<PY > "$out/nodes_flux_runtime.txt" 2>&1
          import comfy_extras.nodes_flux as nodes_flux
          print(nodes_flux.__file__)
          print(nodes_flux.FluxKontextImageScale.upscale.__code__.co_filename)
          print(nodes_flux.FluxKontextImageScale.upscale.__code__.co_firstlineno)
          PY
          source_path="$(head -n 1 "$out/nodes_flux_runtime.txt")"
          if [ -n "$source_path" ] && [ -f "$source_path" ]; then
            first_line="$(python3 - "$out/nodes_flux_runtime.txt" <<PY
            from pathlib import Path
            text=Path("$out/nodes_flux_runtime.txt").read_text().splitlines()
            print(next((line for line in text if line.isdigit()), "1"))
            PY
            )"
            start_line=$((first_line - 30))
            [ "$start_line" -lt 1 ] && start_line=1
            sed -n "${start_line},$((first_line + 80))p" "$source_path" > "$out/nodes_flux_FluxKontextImageScale.txt"
          fi
          true
          REMOTE
          chmod +x "$remote_script"
          gcloud compute scp "$remote_script" "${VM_NAME}:/tmp/" --project="$GPU_PROJECT" --zone="$ZONE" --quiet
          gcloud compute ssh "$VM_NAME" --project="$GPU_PROJECT" --zone="$ZONE" --quiet --command="bash /tmp/$(basename "$remote_script")" > "$evidence/ssh_output.txt" 2>&1
          gcloud compute scp "${VM_NAME}:/tmp/qwen-narrow-diagnostics/*" "$evidence/" --project="$GPU_PROJECT" --zone="$ZONE" --quiet > "$evidence/scp_output.txt" 2>&1 || true
          find "$evidence" -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Upload diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: qwen-narrow-runtime-diagnostics
          path: ${{ runner.temp }}/qwen-narrow-diagnostics
          if-no-files-found: warn
