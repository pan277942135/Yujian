    body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f6f7f8;color:#171717}header{background:#fff;border-bottom:1px solid #e5e7eb;padding:14px 24px;display:flex;gap:22px;align-items:center;position:sticky;top:0;z-index:3}header a{text-decoration:none;color:#111827;font-weight:650}main{max-width:1500px;margin:0 auto;padding:24px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-end}.muted{color:#6b7280}.section{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px;margin-top:18px}table{width:100%;border-collapse:collapse}th,td{padding:10px 8px;border-bottom:1px solid #eee;text-align:left;font-size:13px;vertical-align:top}th{color:#6b7280}input,select,button{font:inherit;border:1px solid #d1d5db;border-radius:8px;padding:8px;background:white}input{width:220px}button{cursor:pointer;font-weight:650}.soft{background:#f3f4f6}.prepare{background:#0f172a;color:#fff;border-color:#0f172a}.presenceBtn{background:#ecfeff;border-color:#a5f3fc}.dedupeBtn{background:#f5f3ff;border-color:#ddd6fe}.filterBtn{background:#fff1f2;border-color:#fecdd3}.pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#f3f4f6;font-size:12px}.pillBtn{border:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}.numBtn{border:0;padding:2px 4px;background:transparent;text-decoration:underline;text-underline-offset:2px}.ok{background:#ecfdf5}.warn{background:#fff7ed}.bad{background:#fff1f2}.info{background:#eef2ff}.actions{display:flex;gap:6px;flex-wrap:wrap}.audit,.presence,.dedupe{display:flex;gap:5px;flex-wrap:wrap;min-width:190px}.banner{display:none;margin-top:16px;padding:12px 14px;border-radius:10px;background:#eef2ff;white-space:pre-wrap}.spinner{opacity:.6;pointer-events:none}.reviewLink{font-weight:650;text-decoration:none;color:#111827}@media(max-width:1100px){.section{overflow:auto}input{width:170px}}

<script>
(function(){
  function decorateTables(){
    document.querySelectorAll('table[data-card-labels]').forEach(function(table){
      const labels=(table.dataset.cardLabels||'').split('|');
      table.querySelectorAll('tbody tr').forEach(function(row){
        Array.from(row.cells).forEach(function(cell,index){
          if(cell.colSpan>1){cell.removeAttribute('data-label');return}
          if(labels[index])cell.setAttribute('data-label',labels[index]);
        });
      });
    });
  }
  function initNav(){
    const header=document.querySelector('header.app-nav');
    if(!header)return;
    if(!header.dataset.mobileReady){
      const links=Array.from(header.children).filter(function(el){return el.tagName==='A'});
      const controls=Array.from(header.children).filter(function(el){return el.tagName!=='A'});
      const nav=document.createElement('nav');
      nav.className='nav-links';
      nav.id='yujian-primary-nav';
      nav.setAttribute('aria-label','主导航');
      links.forEach(function(link){nav.appendChild(link)});
      const toggle=document.createElement('button');
      toggle.type='button';
      toggle.className='nav-toggle';
      toggle.setAttribute('aria-expanded','false');
      toggle.setAttribute('aria-controls',nav.id);
      toggle.innerHTML='<span class="nav-icon" aria-hidden="true">☰</span><span>渔见 AI Console</span>';
      header.insertBefore(toggle,header.firstChild);
      header.insertBefore(nav,controls[0]||null);
      toggle.addEventListener('click',function(){
        const open=nav.classList.toggle('open');
        toggle.setAttribute('aria-expanded',String(open));
      });
      nav.addEventListener('click',function(event){
        if(event.target.closest('a')){
          nav.classList.remove('open');
          toggle.setAttribute('aria-expanded','false');
        }
      });
      document.addEventListener('click',function(event){
        if(!header.contains(event.target)){
          nav.classList.remove('open');
          toggle.setAttribute('aria-expanded','false');
        }
      });
      header.dataset.mobileReady='true';
    }
    decorateTables();
    if(!window.__yujianMobileObserver){
      const observer=new MutationObserver(decorateTables);
      observer.observe(document.body,{childList:true,subtree:true});
      window.__yujianMobileObserver=observer;
    }
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',initNav,{once:true});else initNav();
})();
</script>
<main>
  <div class="top"><div><h1>数据批次</h1><div class="muted">“准备审核”会自动完成检查、入库、登记、近重复检测和鱼体检测；完成后直接进入人工审核。</div></div><button onclick="loadAll()">刷新</button></div>
  <div id="banner" class="banner"></div>
  <div class="section"><h2>待处理上传数据</h2><div class="muted">上传文件夹只是临时落地区；正式批次 ID 才是长期追溯 ID。</div><table data-card-labels="上传文件夹|图片 / 清单|自动检查|正式批次 ID|来源|状态|操作"><thead><tr><th>上传文件夹</th><th>图片 / 清单</th><th>自动检查</th><th>正式批次 ID</th><th>来源</th><th>状态</th><th>操作</th></tr></thead><tbody id="incoming"></tbody></table></div>
  <div class="section"><h2>已登记批次</h2><div class="muted">检测只生成机器预筛结果，不自动删除数据；人工仍可在“数据检查”里纠正无鱼、多鱼、重复或审核状态。</div><table data-card-labels="批次|来源|图片|通过|待定|不通过|鱼体分流|近重复|操作"><thead><tr><th>批次</th><th>来源</th><th>图片</th><th>通过</th><th>待定</th><th>不通过</th><th>鱼体分流</th><th>近重复</th><th>操作</th></tr></thead><tbody id="registered"></tbody></table></div>
</main>
<script>
function esc(v){return (v??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function msg(text,isError=false){const b=document.getElementById('banner');b.style.display='block';b.style.background=isError?'#fff1f2':'#eef2ff';b.textContent=text}
function setBusy(on){document.body.classList.toggle('spinner',on)}
async function api(url,opts){const r=await fetch(url,opts);const text=await r.text();let data;try{data=JSON.parse(text)}catch{data=text}if(!r.ok)throw new Error(data.detail||text||r.statusText);return data}
function values(i,prefix){const batch=document.getElementById('batch-'+i).value.trim();const source=document.getElementById('source-'+i).value;if(!batch||!source)throw new Error('请先确认正式批次 ID 和来源');return {incoming_prefix:prefix,batch_id:batch,source}}
function sourceName(v){return ({pilot:'种子集',doubao:'豆包',app_feedback:'用户反馈',workbuddy:'WorkBuddy',other:'其他'})[v]||v||'-'}
function batchStatus(v){return ({REGISTERED:'已登记',INGESTED:'已入库'})[v]||v||'-'}
function openInspect(params={}){const p=new URLSearchParams(params);window.open('/inspect?'+p.toString(),'yujian-data-inspect')}
function presenceHtml(p,batchId){if(!p||!p.scanned)return '<span class="muted">未检测</span>';const b=JSON.stringify(batchId);return `<div class="presence"><button class="pill pillBtn ok" onclick='openInspect({batch_id:${b},presence:"single_fish"})'>单鱼 ${p.single_fish||0}</button><button class="pill pillBtn warn" onclick='openInspect({batch_id:${b},presence:"multi_fish"})'>多鱼 ${p.multi_fish||0}</button><button class="pill pillBtn bad" onclick='openInspect({batch_id:${b},presence:"no_fish"})'>无鱼 ${p.no_fish||0}</button><button class="pill pillBtn info" onclick='openInspect({batch_id:${b},presence:"uncertain"})'>不确定 ${p.uncertain||0}</button>${p.remaining?`<span class="pill">未检测 ${p.remaining}</span>`:''}${p.error?`<span class="pill bad">失败 ${p.error}</span>`:''}</div>`}
function dedupeHtml(d){if(!d||!d.scanned)return '<span class="muted">未检测</span>';return `<div class="dedupe"><span class="pill info">重复组 ${d.groups||0}</span><span class="pill warn">可过滤 ${d.duplicate_images||0}</span><span class="pill">完全 ${d.exact_duplicates||0}</span><span class="pill">近似 ${d.near_duplicates||0}</span>${d.remaining?`<span class="pill">未检测 ${d.remaining}</span>`:''}</div>`}
async function loadAll(){try{const [incoming,registered,presenceRows,dedupeRows]=await Promise.all([api('/api/incoming'),api('/api/batches'),api('/api/presence/batches'),api('/api/dedupe/batches')]);const presenceMap=Object.fromEntries(presenceRows.map(x=>[x.batch_id,x]));const dedupeMap=Object.fromEntries(dedupeRows.map(x=>[x.batch_id,x]));document.getElementById('incoming').innerHTML=incoming.map((x,i)=>{const a=x.audit||{},s=a.status_counts||{};return `<tr><td><b>${esc(x.folder)}</b><br><span class="muted">${esc(x.incoming_prefix)}</span></td><td>${x.image_count} / ${x.manifest_count}</td><td>${a.batch_id?`<div class="audit"><span class="pill ok">候选 ${s.CANDIDATE||0}</span><span class="pill warn">待定 ${s.NEEDS_REVIEW||0}</span><span class="pill bad">剔除 ${s.AUTO_REJECT||0}</span></div>`:'<span class="muted">未检查</span>'}</td><td><input id="batch-${i}" value="${esc(x.canonical_batch_id)}"></td><td><select id="source-${i}"><option value="">选择来源</option><option value="pilot" ${x.source==='pilot'?'selected':''}>种子集</option><option value="doubao" ${x.source==='doubao'?'selected':''}>豆包</option><option value="app_feedback" ${x.source==='app_feedback'?'selected':''}>用户反馈</option><option value="workbuddy" ${x.source==='workbuddy'?'selected':''}>WorkBuddy</option><option value="other" ${x.source==='other'?'selected':''}>其他</option></select></td><td>${x.promoted?'<span class="pill ok">已入库</span>':'<span class="pill">待入库</span>'}</td><td><div class="actions"><button class="prepare" onclick="prepare(${i},'${esc(x.incoming_prefix)}')">准备审核</button><button class="soft" onclick="act(${i},'audit','${esc(x.incoming_prefix)}')">仅检查</button><button onclick="act(${i},'promote','${esc(x.incoming_prefix)}')">仅入库</button><button onclick="sync(${i})">仅登记</button></div></td></tr>`}).join('')||'<tr><td colspan="7" class="muted">没有发现待处理上传数据</td></tr>';document.getElementById('registered').innerHTML=registered.map(x=>{const pending=(x.review.pending||0)+(x.review.needs_review||0)+(x.review.hard_case||0);const p=presenceMap[x.batch_id]||{};const d=dedupeMap[x.batch_id]||{};const b=JSON.stringify(x.batch_id);return `<tr><td><b>${esc(x.batch_id)}</b><br><span class="pill">${esc(batchStatus(x.status))}</span></td><td>${esc(sourceName(x.source))}</td><td><button class="numBtn" onclick='openInspect({batch_id:${b}})'>${x.image_count}</button></td><td><button class="numBtn" onclick='openInspect({batch_id:${b},review_status:"approved"})'>${x.review.approved||0}</button></td><td><button class="numBtn" onclick='openInspect({batch_id:${b},review_status:"pending"})'>${pending}</button></td><td><button class="numBtn" onclick='openInspect({batch_id:${b},review_status:"rejected"})'>${x.review.rejected||0}</button></td><td>${presenceHtml(p,x.batch_id)}</td><td>${dedupeHtml(d)}</td><td><div class="actions"><button class="dedupeBtn" onclick="scanDedupe('${esc(x.batch_id)}')">检测重复</button>${d.filterable_duplicate_images?`<button class="filterBtn" onclick="filterDuplicates('${esc(x.batch_id)}',${d.filterable_duplicate_images})">过滤重复项</button>`:''}<button class="presenceBtn" onclick="scanPresence('${esc(x.batch_id)}')">检测鱼体</button>${p.filterable_no_fish?`<button class="filterBtn" onclick="filterNoFish('${esc(x.batch_id)}',${p.filterable_no_fish})">过滤无鱼</button>`:''}<a class="reviewLink" href="/review/bulk?batch=${encodeURIComponent(x.batch_id)}">快速审核 →</a><a class="reviewLink" href="/review?batch=${encodeURIComponent(x.batch_id)}">单张审核</a></div></td></tr>`}).join('')||'<tr><td colspan="9" class="muted">还没有已登记批次</td></tr>'}catch(e){msg(e.message,true)}}
async function act(i,action,prefix){let payload;try{payload=values(i,prefix)}catch(e){msg(e.message,true);return}setBusy(true);msg(`${action==='audit'?'正在自动检查':'正在正式入库'} ${payload.batch_id} …`);try{const d=await api(`/api/batches/${action}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});msg(JSON.stringify(d,null,2));await loadAll()}catch(e){msg(e.message,true)}finally{setBusy(false)}}
async function sync(i){const batch=document.getElementById('batch-'+i).value.trim();if(!batch){msg('请先确认正式批次 ID',true);return}setBusy(true);msg(`正在登记 ${batch} …`);try{await api('/api/batches/sync',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({batch_id:batch})});msg(`已登记 ${batch}`);await loadAll()}catch(e){msg(e.message,true)}finally{setBusy(false)}}
async function prepare(i,prefix){let payload;try{payload=values(i,prefix)}catch(e){msg(e.message,true);return}setBusy(true);try{msg(`1/5 自动检查 ${payload.batch_id} …`);const audit=await api('/api/batches/audit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});msg(`2/5 正式入库 ${payload.batch_id} …`);const promote=await api('/api/batches/promote',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});msg(`3/5 登记数据 ${payload.batch_id} …`);await api('/api/batches/sync',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({batch_id:payload.batch_id})});let dedupeTotal=0,dedupe={};while(true){msg(`4/5 自动检测近重复：${payload.batch_id}\n已处理 ${dedupeTotal} 张…`);dedupe=await api('/api/dedupe/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({batch_id:payload.batch_id,limit:100,rescan:false})});dedupeTotal+=dedupe.processed||0;if(!dedupe.remaining||!dedupe.processed)break}let presenceTotal=0,presence={};while(true){msg(`5/5 自动检测鱼体：${payload.batch_id}\n已处理 ${presenceTotal} 张…`);presence=await api('/api/presence/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({batch_id:payload.batch_id,limit:40,rescan:false})});presenceTotal+=presence.processed||0;if(!presence.remaining||!presence.processed)break}msg(`准备审核完成：${payload.batch_id}\n候选 ${audit.status_counts?.CANDIDATE||0} / 待定 ${audit.status_counts?.NEEDS_REVIEW||0} / 剔除 ${audit.status_counts?.AUTO_REJECT||0}\n正式入库：${promote.already_exists?'已存在，直接复用':'完成'}\n近重复：${dedupe.duplicate_images||0} 张非代表图 / ${dedupe.groups||0} 组\n鱼体：单鱼 ${presence.single_fish||0} / 多鱼 ${presence.multi_fish||0} / 无鱼 ${presence.no_fish||0} / 不确定 ${presence.uncertain||0}\n\n下一步：直接进入“快速审核”。`);await loadAll()}catch(e){msg(`自动准备中断：${e.message}\n已完成的步骤会保留，可再次点击“准备审核”续跑。`,true)}finally{setBusy(false)}}
async function scanPresence(batchId){setBusy(true);let total=0;try{while(true){msg(`正在检测鱼体：${batchId}\n本次已处理 ${total} 张…`);const d=await api('/api/presence/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({batch_id:batchId,limit:40,rescan:false})});total+=d.processed||0;await loadAll();if(!d.remaining||!d.processed){msg(`鱼体检测完成：${batchId}\n单鱼 ${d.single_fish||0} / 多鱼 ${d.multi_fish||0} / 无鱼 ${d.no_fish||0} / 不确定 ${d.uncertain||0}`);break}}}catch(e){msg(e.message,true)}finally{setBusy(false)}}
async function scanDedupe(batchId){setBusy(true);let total=0;try{while(true){msg(`正在检测近重复：${batchId}\n本次已处理 ${total} 张…`);const d=await api('/api/dedupe/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({batch_id:batchId,limit:100,rescan:false})});total+=d.processed||0;await loadAll();if(!d.remaining||!d.processed){msg(`近重复检测完成：${batchId}\n重复组 ${d.groups||0} / 可过滤 ${d.duplicate_images||0} / 完全重复 ${d.exact_duplicates||0} / 近似重复 ${d.near_duplicates||0}`);break}}}catch(e){msg(e.message,true)}finally{setBusy(false)}}
async function filterNoFish(batchId,count){if(!confirm(`将约 ${count} 张“无鱼”图片批量标记为“不通过”？\n误判图片可以稍后从“无鱼”数字进入数据检查并调回来。`))return;setBusy(true);try{const d=await api('/api/presence/reject-no-fish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({batch_id:batchId})});msg(`已过滤 ${d.rejected||0} 张无鱼图片。`);await loadAll()}catch(e){msg(e.message,true)}finally{setBusy(false)}}
async function filterDuplicates(batchId,count){if(!confirm(`将约 ${count} 张近重复非代表图批量标记为“不通过”？\n每组会保留清晰度更高的代表图。`))return;setBusy(true);try{const d=await api('/api/dedupe/reject-duplicates',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({batch_id:batchId})});msg(`已过滤 ${d.rejected||0} 张重复图片。`);await loadAll()}catch(e){msg(e.message,true)}finally{setBusy(false)}}
loadAll();
</script>
