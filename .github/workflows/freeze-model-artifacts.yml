name: Verify and expand frozen model releases

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Select the uploaded model release to verify
        required: true
        type: choice
        options:
          - detector-model-v0.3
          - classifier-model-v0.2

permissions:
  contents: write

concurrency:
  group: yujian-model-release-verify
  cancel-in-progress: false

jobs:
  verify-and-expand:
    if: |
      (github.event_name == 'release' &&
        (github.event.release.tag_name == 'detector-model-v0.3' ||
         github.event.release.tag_name == 'classifier-model-v0.2')) ||
      (github.event_name == 'workflow_dispatch' &&
        (inputs.release_tag == 'detector-model-v0.3' ||
         inputs.release_tag == 'classifier-model-v0.2'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Select exact bundle and expected archive SHA
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" == "detector-model-v0.3" ]]; then
            echo "BUNDLE_NAME=DET_FISH_v0.3_bundle.zip" >> "$GITHUB_ENV"
            echo "EXPECTED_BUNDLE_SHA=3c5363986d0beb48bdd6a7a722429308945e2b3ec4d68584c1997f65c13c8c83" >> "$GITHUB_ENV"
          elif [[ "$RELEASE_TAG" == "classifier-model-v0.2" ]]; then
            echo "BUNDLE_NAME=MODEL_CROP_M1_v0.2_bundle.zip" >> "$GITHUB_ENV"
            echo "EXPECTED_BUNDLE_SHA=265362402b61cdbd2cec9d673ed6acbaa17e8eb9537185a513519f733e9df9ef" >> "$GITHUB_ENV"
          else
            echo "Unsupported release tag: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Download the single uploaded bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming
          gh release download "$RELEASE_TAG" --pattern "$BUNDLE_NAME" --dir incoming

      - name: Verify bundle SHA, internal checksums, model identity, and metadata redaction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib, sys, zipfile
          tag=__import__("os").environ["RELEASE_TAG"]
          bundle_name=__import__("os").environ["BUNDLE_NAME"]
          expected_bundle=__import__("os").environ["EXPECTED_BUNDLE_SHA"]
          bundle=pathlib.Path("incoming")/bundle_name
          if not bundle.is_file():
            raise SystemExit(f"MISSING_RELEASE_BUNDLE: {bundle}")
          actual_bundle=hashlib.sha256(bundle.read_bytes()).hexdigest()
          print("BUNDLE_SHA256",actual_bundle)
          if actual_bundle != expected_bundle:
            raise SystemExit(f"BUNDLE_SHA_MISMATCH expected={expected_bundle} actual={actual_bundle}")

          out=pathlib.Path("expanded")
          out.mkdir(exist_ok=True)
          with zipfile.ZipFile(bundle) as z:
            bad=z.testzip()
            if bad: raise SystemExit(f"ZIP_CRC_FAIL: {bad}")
            for info in z.infolist():
              p=pathlib.PurePosixPath(info.filename)
              if p.is_absolute() or ".." in p.parts:
                raise SystemExit(f"UNSAFE_ZIP_PATH: {info.filename}")
            z.extractall(out)

          sums=out/"SHA256SUMS"
          if not sums.is_file(): raise SystemExit("MISSING_SHA256SUMS")
          for line in sums.read_text(encoding="utf-8").splitlines():
            if not line.strip(): continue
            wanted,name=line.split(None,1)
            name=name.strip().lstrip("*")
            p=out/name
            if not p.is_file(): raise SystemExit(f"CHECKSUM_TARGET_MISSING: {name}")
            actual=hashlib.sha256(p.read_bytes()).hexdigest()
            if actual != wanted: raise SystemExit(f"CHECKSUM_MISMATCH: {name} expected={wanted} actual={actual}")
            print("INTERNAL_SHA_PASS",name,actual)

          if tag == "detector-model-v0.3":
            checks={
              "DET_FISH_v0.3.onnx":"98257b953b0e9f8aa673572fe4a9749a730ed8a2c014a42b7c492a0e3592c9a1",
              "DET_FISH_v0.3_best_ckpt.pth":"3e2b4d835de65bf408f565f5104c9993d3c558527690782e75a4415e3c67ca89"
            }
            metadata=out/"DET_FISH_v0.3.public.metadata.json"
          else:
            checks={
              "MODEL_CROP_M1_v0.2.tflite":"29c2f2fd1608178f023b8e35edf632c0dd685df4a7ae1c3562220a7352ccce18",
              "model_torchscript.pt":"61319bfee5848ca7d0894d1b22feebe2ac0804a516352a43c26c4ad175204ef1",
              "model_state_dict.pt":"c267569b188673d3228f5510de30c666a0ed673231afd29025bb8f2dea5c9f03"
            }
            metadata=out/"MODEL_CROP_M1_v0.2.public.metadata.json"

          for name,wanted in checks.items():
            p=out/name
            if not p.is_file(): raise SystemExit(f"MISSING_MODEL_ASSET: {name}")
            actual=hashlib.sha256(p.read_bytes()).hexdigest()
            if actual != wanted: raise SystemExit(f"MODEL_SHA_MISMATCH: {name} {actual}")
            print("MODEL_SHA_PASS",name,actual)

          if not metadata.is_file(): raise SystemExit("MISSING_PUBLIC_METADATA")
          stack=[json.loads(metadata.read_text(encoding="utf-8"))]
          forbidden_keys={"source_image_audit","source_image_sha256","review_record_id","source_uri","source_pt_uri","target_artifact_uri"}
          while stack:
            item=stack.pop()
            if isinstance(item,dict):
              for key,value in item.items():
                if key in forbidden_keys: raise SystemExit(f"FORBIDDEN_PUBLIC_METADATA_KEY: {key}")
                if isinstance(value,str) and value.startswith("gs://"):
                  raise SystemExit("INTERNAL_GCS_URI_IN_PUBLIC_METADATA")
                if isinstance(value,(dict,list)): stack.append(value)
            elif isinstance(item,list):
              stack.extend(item)
          for p in out.iterdir():
            if p.is_file() and p.suffix.lower() in (".json",".csv",".md"):
              if "gs://" in p.read_text(encoding="utf-8",errors="ignore"):
                raise SystemExit(f"INTERNAL_GCS_URI_IN_RELEASE_ASSET: {p.name}")
          print("BUNDLE_INTEGRITY_AND_REDACTION_PASS")
          PY

      - name: Expand verified files into the GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" == "detector-model-v0.3" ]]; then
            gh release upload "$RELEASE_TAG" \
              expanded/DET_FISH_v0.3.onnx \
              expanded/DET_FISH_v0.3_best_ckpt.pth \
              expanded/DET_FISH_v0.3.public.metadata.json \
              expanded/recognition_pipeline_v1.json \
              expanded/MODEL_MANIFEST.json \
              expanded/MODEL_LOCK.json \
              expanded/SHA256SUMS
          else
            gh release upload "$RELEASE_TAG" \
              expanded/MODEL_CROP_M1_v0.2.tflite \
              expanded/model_torchscript.pt \
              expanded/model_state_dict.pt \
              expanded/class_map.json \
              expanded/metrics.json \
              expanded/confusion_matrix.csv \
              expanded/MODEL_CROP_M1_v0.2.public.metadata.json \
              expanded/classifier_contract.json \
              expanded/MODEL_MANIFEST.json \
              expanded/MODEL_LOCK.json \
              expanded/SHA256SUMS
          fi

      - name: Re-download release assets and verify remote SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p remote
          gh release download "$RELEASE_TAG" --dir remote
          python - <<'PY'
          import hashlib, os, pathlib, sys
          root=pathlib.Path("remote")
          sums=root/"SHA256SUMS"
          if not sums.is_file(): raise SystemExit("REMOTE_SHA256SUMS_MISSING")
          for line in sums.read_text(encoding="utf-8").splitlines():
            if not line.strip(): continue
            wanted,name=line.split(None,1)
            name=name.strip().lstrip("*")
            p=root/name
            if not p.is_file(): raise SystemExit(f"REMOTE_ASSET_MISSING: {name}")
            actual=hashlib.sha256(p.read_bytes()).hexdigest()
            if actual != wanted: raise SystemExit(f"REMOTE_SHA_MISMATCH: {name} {actual}")
            print("REMOTE_SHA_PASS",name,actual)
          print("GITHUB_RELEASE_REMOTE_ASSET_IDENTITY_PASS")
          PY
          gh release view "$RELEASE_TAG" --json url,isDraft,isPrerelease,assets

      - name: Publish verified result
        if: success()
        shell: bash
        run: |
          {
            echo "## Verified model release"
            echo "- Tag: $RELEASE_TAG"
            echo "- Bundle: $BUNDLE_NAME"
            echo "- Bundle SHA-256: $EXPECTED_BUNDLE_SHA"
            echo "- Internal SHA256SUMS: PASS"
            echo "- Public metadata redaction: PASS"
            echo "- Individual GitHub asset re-download: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
