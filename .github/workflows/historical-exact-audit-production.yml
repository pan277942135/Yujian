name: Historical Exact Duplicate Production Audit

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: historical-exact-audit-production
  cancel-in-progress: false

env:
  PROJECT_ID: gemini-api-project-503706
  REGION: asia-east1
  SERVICE: yujian-model-factory-console
  JOB_NAME: yujian-historical-exact-audit-v1
  WIF_PROVIDER: projects/571785698442/locations/global/workloadIdentityPools/github-actions/providers/yujian-main
  DEPLOY_SERVICE_ACCOUNT: yujian-github-deployer@gemini-api-project-503706.iam.gserviceaccount.com
  AUDIT_SHA: 56b0f9469a5934a3207487d06a5be516005ab29c
  AR_REPOSITORY: yujian-training

jobs:
  production-audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: uat
    steps:
      - name: Enforce main-only execution
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"

      - name: Checkout exact audit implementation before WIF auth
        uses: actions/checkout@v4
        with:
          ref: 56b0f9469a5934a3207487d06a5be516005ab29c
          fetch-depth: 1
          clean: false

      - name: Verify exact audit SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "56b0f9469a5934a3207487d06a5be516005ab29c"
          test "$(git rev-parse HEAD)" = "$AUDIT_SHA"

      - name: Authenticate to Google Cloud with existing WIF
        uses: google-github-actions/auth@v3.0.0
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3.0.1
        with:
          project_id: ${{ env.PROJECT_ID }}
          version: '>= 416.0.0'

      - name: Resolve live Console production configuration
        id: runtime
        shell: bash
        env:
          PROJECT_ID: ${{ env.PROJECT_ID }}
          REGION: ${{ env.REGION }}
          SERVICE: ${{ env.SERVICE }}
        run: |
          set -euo pipefail
          SERVICE_JSON="$RUNNER_TEMP/yujian-console-service.json"
          gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format=json > "$SERVICE_JSON"
          python3 - "$SERVICE_JSON" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          def resolve_secret_reference(item):
              secret_ref = ((item.get("valueFrom") or {}).get("secretKeyRef") or {})
              if not secret_ref:
                  secret_ref = ((item.get("valueSource") or {}).get("secretKeyRef") or {})
              return str(secret_ref.get("name") or secret_ref.get("secret") or "").strip()

          def resolve_plain_values(items):
              names = {"GCS_BUCKET", "CLOUD_SQL_CONNECTION_NAME", "DB_USER", "DB_NAME"}
              return {
                  str(item.get("name")): str(item["value"])
                  for item in items
                  if item.get("name") in names and item.get("value")
              }

          parser_fixture = {
              "name": "DB_PASSWORD",
              "valueFrom": {"secretKeyRef": {"key": "latest", "name": "yujian-console-db-password"}},
          }
          assert resolve_secret_reference(parser_fixture) == "yujian-console-db-password"
          plain_fixture = [
              {"name": "GCS_BUCKET", "value": "fixture-bucket"},
              {"name": "CLOUD_SQL_CONNECTION_NAME", "value": "fixture:asia-east1:sql"},
              {"name": "DB_USER", "value": "fixture-user"},
              {"name": "DB_NAME", "value": "fixture-db"},
          ]
          assert set(resolve_plain_values(plain_fixture)) == {
              "GCS_BUCKET", "CLOUD_SQL_CONNECTION_NAME", "DB_USER", "DB_NAME"
          }
          print("Cloud Run secret/plain-env parser contract: PASS")

          with open(sys.argv[1], encoding="utf-8") as handle:
              payload = json.load(handle)
          template = ((payload.get("spec") or {}).get("template") or {})
          spec = template.get("spec") or {}
          containers = spec.get("containers") or []
          if not containers:
              raise SystemExit("live Console service has no container configuration")
          values = {}
          db_secret = ""
          db_password_item = None
          for item in containers[0].get("env") or []:
              name = str(item.get("name") or "")
              if name in {"GCS_BUCKET", "CLOUD_SQL_CONNECTION_NAME", "DB_USER", "DB_NAME"} and item.get("value"):
                  values[name] = str(item["value"])
              if name == "DB_PASSWORD":
                  db_password_item = item
                  db_secret = resolve_secret_reference(item)
          annotations = (template.get("metadata") or {}).get("annotations") or {}
          values["CLOUD_SQL_CONNECTION_NAME"] = values.get("CLOUD_SQL_CONNECTION_NAME") or str(
              annotations.get("run.googleapis.com/cloudsql-instances") or ""
          ).split(",")[0]
          runtime_sa = str(spec.get("serviceAccountName") or "")
          missing = [name for name in ("GCS_BUCKET", "CLOUD_SQL_CONNECTION_NAME", "DB_USER", "DB_NAME") if not values.get(name)]
          if missing:
              raise SystemExit(f"missing live Console configuration: {','.join(missing)}")
          if not db_secret:
              sanitized_keys = sorted((db_password_item or {}).keys())
              raise SystemExit(
                  "DB_PASSWORD is not configured as a Secret Manager reference; "
                  f"sanitized env keys: {','.join(sanitized_keys)}"
              )
          if not runtime_sa:
              raise SystemExit("live Console runtime service account is missing")
          with open(sys.argv[2], "a", encoding="utf-8") as handle:
              for key, value in {**values, "DB_SECRET": db_secret, "RUNTIME_SA": runtime_sa}.items():
                  handle.write(f"{key}={value}\n")
          print("DB_PASSWORD binding type: Secret Manager")
          print(f"DB secret reference name: {db_secret}")
          print("Live Console DB/GCS/runtime configuration resolved without printing secret values.")
          PY

      - name: Full production capability preflight
        id: preflight
        env:
          PROJECT_ID: ${{ env.PROJECT_ID }}
          REGION: ${{ env.REGION }}
          AR_REPOSITORY: ${{ env.AR_REPOSITORY }}
          AUDIT_SHA: ${{ env.AUDIT_SHA }}
          BUCKET: ${{ steps.runtime.outputs.GCS_BUCKET }}
          CONNECTION_NAME: ${{ steps.runtime.outputs.CLOUD_SQL_CONNECTION_NAME }}
          DB_SECRET: ${{ steps.runtime.outputs.DB_SECRET }}
          RUNTIME_SA: ${{ steps.runtime.outputs.RUNTIME_SA }}
        shell: bash
        run: |
          set -uo pipefail
          PREFLIGHT_DIR="$RUNNER_TEMP/historical-exact-preflight"
          mkdir -p "$PREFLIGHT_DIR"
          FAIL=0
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPOSITORY}/historical-exact-audit:${AUDIT_SHA:0:8}"
          BUILD_IDS=(
            dcb263c1-f8a3-47ca-8aee-42051e7fdc60
            459ad772-cc7a-4206-9e13-4cd81e101fe7
          )

          for build_id in "${BUILD_IDS[@]}"; do
            if ! gcloud builds describe "$build_id" \
              --project "$PROJECT_ID" --format=json > "$PREFLIGHT_DIR/$build_id.json"; then
              echo "Cloud Build metadata unavailable: $build_id"
              echo '{}' > "$PREFLIGHT_DIR/$build_id.json"
              FAIL=1
            fi
          done

          for build_id in "${BUILD_IDS[@]}"; do
            status="$(gcloud builds describe "$build_id" --project "$PROJECT_ID" --format='value(status)' 2>/dev/null || true)"
            case "$status" in
              QUEUED|WORKING|PENDING)
                echo "Polling existing Cloud Build $build_id without streaming logs."
                for attempt in $(seq 1 40); do
                  sleep 15
                  status="$(gcloud builds describe "$build_id" --project "$PROJECT_ID" --format='value(status)' 2>/dev/null || true)"
                  case "$status" in
                    QUEUED|WORKING|PENDING) continue ;;
                    *) break ;;
                  esac
                done
                gcloud builds describe "$build_id" --project "$PROJECT_ID" --format=json > "$PREFLIGHT_DIR/$build_id.json" || FAIL=1
                ;;
            esac
          done

          if ! gcloud artifacts repositories describe "$AR_REPOSITORY" \
            --project "$PROJECT_ID" --location "$REGION" --format=json > "$PREFLIGHT_DIR/repository.json"; then
            echo "Artifact Registry repository unavailable: $AR_REPOSITORY"
            FAIL=1
          fi

          IMAGE_STATE=MISSING
          if gcloud artifacts docker images describe "$IMAGE_URI" \
            --project "$PROJECT_ID" --format=json > "$PREFLIGHT_DIR/image.json" 2>/dev/null; then
            IMAGE_STATE=EXISTS
          else
            echo '{}' > "$PREFLIGHT_DIR/image.json"
          fi

          SECRET_STATE=PASS
          if ! gcloud secrets describe "$DB_SECRET" --project "$PROJECT_ID" \
            --format='value(name)' > "$PREFLIGHT_DIR/secret.txt"; then
            SECRET_STATE=FAIL
            FAIL=1
          fi

          RUNTIME_STATE=PASS
          if [[ -z "$RUNTIME_SA" ]] || ! gcloud iam service-accounts describe "$RUNTIME_SA" \
            --project "$PROJECT_ID" --format='value(email)' > "$PREFLIGHT_DIR/runtime-sa.txt"; then
            RUNTIME_STATE=FAIL
            FAIL=1
          fi

          SQL_PROJECT="${CONNECTION_NAME%%:*}"
          SQL_INSTANCE="${CONNECTION_NAME##*:}"
          SQL_STATE=PASS
          if [[ -z "$CONNECTION_NAME" || -z "$SQL_PROJECT" || -z "$SQL_INSTANCE" ]] || \
             ! gcloud sql instances describe "$SQL_INSTANCE" --project "$SQL_PROJECT" \
             --format='value(name)' > "$PREFLIGHT_DIR/sql.txt"; then
            SQL_STATE=FAIL
            FAIL=1
          fi

          GCS_STATE=PASS
          if [[ -z "$BUCKET" ]] || ! gcloud storage buckets describe "gs://$BUCKET" \
            --project "$PROJECT_ID" --format=json > "$PREFLIGHT_DIR/bucket.json"; then
            GCS_STATE=FAIL
            FAIL=1
          fi

          CONTROL_STATE=PASS
          CONTROL_PERMISSIONS="$(gcloud projects test-iam-permissions "$PROJECT_ID" \
            --permissions=run.jobs.create,run.jobs.update,run.jobs.get,run.jobs.delete,iam.serviceAccounts.actAs \
            --format='value(permissions)' 2>/dev/null || true)"
          for permission in run.jobs.create run.jobs.update run.jobs.get run.jobs.delete iam.serviceAccounts.actAs; do
            if ! grep -Fq "$permission" <<< "$CONTROL_PERMISSIONS"; then
              CONTROL_STATE=FAIL
              FAIL=1
            fi
          done

          AR_STATE=PASS
          if [[ ! -s "$PREFLIGHT_DIR/repository.json" ]]; then
            AR_STATE=FAIL
            FAIL=1
          fi

          python3 - "$PREFLIGHT_DIR" "$IMAGE_URI" "$GITHUB_OUTPUT" <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          expected_image = sys.argv[2]
          output_path = pathlib.Path(sys.argv[3])
          builds = []
          for build_id in (
              "dcb263c1-f8a3-47ca-8aee-42051e7fdc60",
              "459ad772-cc7a-4206-9e13-4cd81e101fe7",
          ):
              payload = json.loads((root / f"{build_id}.json").read_text(encoding="utf-8"))
              results = payload.get("results") or {}
              builds.append({
                  "id": payload.get("id") or build_id,
                  "status": payload.get("status") or "UNAVAILABLE",
                  "createTime": payload.get("createTime"),
                  "finishTime": payload.get("finishTime"),
                  "images": results.get("images") or [],
              })
          image_exists = (root / "image.json").read_text(encoding="utf-8").strip() not in {"", "{}"}
          image_uri = expected_image
          if not image_exists:
              for build in builds:
                  if build["status"] == "SUCCESS":
                      candidates = [image for image in build["images"] if "historical-exact-audit" in image]
                      if candidates:
                          image_uri = candidates[0]
                          break
          build_required = not image_exists and image_uri == expected_image
          output_path.write_text(
              f"IMAGE_URI={image_uri}\nBUILD_REQUIRED={'true' if build_required else 'false'}\n",
              encoding="utf-8",
          )
          print("Cloud Build metadata:")
          for build in builds:
              print(json.dumps(build, sort_keys=True))
          print(f"Expected audit image: {'EXISTS' if image_exists else 'MISSING'}")
          print(f"BUILD_REQUIRED={'YES' if build_required else 'NO'}")
          PY

          echo "Preflight matrix:"
          echo "WIF                           PASS"
          echo "Console config                PASS"
          echo "DB secret exists              $SECRET_STATE"
          echo "Cloud SQL instance            $SQL_STATE"
          echo "GCS bucket                    $GCS_STATE"
          echo "Runtime SA                    $RUNTIME_STATE"
          for build_id in "${BUILD_IDS[@]}"; do
            echo "Existing build $build_id       $(gcloud builds describe "$build_id" --project "$PROJECT_ID" --format='value(status)' 2>/dev/null || echo UNAVAILABLE)"
          done
          echo "Expected audit image          $IMAGE_STATE"
          echo "Cloud Run Job control         $CONTROL_STATE"
          echo "Artifact Registry             $AR_STATE"
          if [[ "$FAIL" -ne 0 ]]; then
            echo "Production preflight FAILED; no build or audit execution will start."
            exit 1
          fi

      - name: Ensure isolated audit image
        id: image
        env:
          PROJECT_ID: ${{ env.PROJECT_ID }}
          REGION: ${{ env.REGION }}
          AR_REPOSITORY: ${{ env.AR_REPOSITORY }}
          AUDIT_SHA: ${{ env.AUDIT_SHA }}
          IMAGE_URI: ${{ steps.preflight.outputs.IMAGE_URI }}
          BUILD_REQUIRED: ${{ steps.preflight.outputs.BUILD_REQUIRED }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$BUILD_REQUIRED" == "true" ]]; then
            BUILD_ID="$(gcloud builds submit . \
              --project "$PROJECT_ID" --tag "$IMAGE_URI" --async --format='value(id)')"
            test -n "$BUILD_ID"
            while true; do
              STATUS="$(gcloud builds describe "$BUILD_ID" --project "$PROJECT_ID" --format='value(status)')"
              case "$STATUS" in
                SUCCESS) break ;;
                FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                  echo "Cloud Build $BUILD_ID ended with $STATUS"
                  exit 1
                  ;;
                *) sleep 15 ;;
              esac
            done
            gcloud artifacts docker images describe "$IMAGE_URI" \
              --project "$PROJECT_ID" --format='value(image_summary.digest)' >/dev/null
            echo "New build: YES"
            echo "Build ID: $BUILD_ID"
            echo "Build status: SUCCESS"
          else
            echo "Image reused: YES"
            echo "New build: NO"
          fi
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Verify DB secret exists before Cloud Run Job
        env:
          PROJECT_ID: ${{ env.PROJECT_ID }}
          DB_SECRET: ${{ steps.runtime.outputs.DB_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud secrets describe "$DB_SECRET" \
            --project "$PROJECT_ID" --format='value(name)' >/dev/null
          echo "Secret Manager reference exists: $DB_SECRET"

      - name: Deploy temporary Cloud Run Job
        env:
          PROJECT_ID: ${{ env.PROJECT_ID }}
          REGION: ${{ env.REGION }}
          JOB_NAME: ${{ env.JOB_NAME }}
          IMAGE_URI: ${{ steps.image.outputs.IMAGE_URI }}
          AUDIT_SHA: ${{ env.AUDIT_SHA }}
          BUCKET: ${{ steps.runtime.outputs.GCS_BUCKET }}
          CONNECTION_NAME: ${{ steps.runtime.outputs.CLOUD_SQL_CONNECTION_NAME }}
          DB_USER: ${{ steps.runtime.outputs.DB_USER }}
          DB_NAME: ${{ steps.runtime.outputs.DB_NAME }}
          DB_SECRET: ${{ steps.runtime.outputs.DB_SECRET }}
          RUNTIME_SA: ${{ steps.runtime.outputs.RUNTIME_SA }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          EVIDENCE_ROOT="gs://${BUCKET}/operator-audits/historical_exact_duplicate_cleanup_v1/${RUN_STAMP}-${AUDIT_SHA:0:8}"
          SECOND_PREFIX="${EVIDENCE_ROOT}/idempotency"
          echo "EVIDENCE_ROOT=$EVIDENCE_ROOT" >> "$GITHUB_ENV"
          echo "SECOND_PREFIX=$SECOND_PREFIX" >> "$GITHUB_ENV"
          gcloud run jobs deploy "$JOB_NAME" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE_URI" \
            --command python \
            --args=scripts/historical_exact_duplicate_audit.py,--bootstrap,--audit,--production,--output-dir,/tmp/historical_exact_duplicate_cleanup_v1,--json \
            --service-account "$RUNTIME_SA" \
            --set-cloudsql-instances "$CONNECTION_NAME" \
            --set-env-vars="GCS_BUCKET=${BUCKET},CLOUD_SQL_CONNECTION_NAME=${CONNECTION_NAME},DB_USER=${DB_USER},DB_NAME=${DB_NAME},APP_GIT_COMMIT=${AUDIT_SHA},AUDIT_GIT_SHA=${AUDIT_SHA},AUDIT_ENVIRONMENT=production,GCP_PROJECT_ID=${PROJECT_ID},GCP_REGION=${REGION},AUDIT_CLOUD_RUN_JOB=${JOB_NAME},AUDIT_GCS_OUTPUT_PREFIX=${EVIDENCE_ROOT}" \
            --set-secrets="DB_PASSWORD=${DB_SECRET}:latest" \
            --cpu=2 \
            --memory=8Gi \
            --tasks=1 \
            --parallelism=1 \
            --max-retries=0 \
            --task-timeout=3600s \
            --quiet

      - name: Execute production bootstrap and dry-run audit
        id: first
        continue-on-error: true
        env:
          PROJECT_ID: ${{ env.PROJECT_ID }}
          REGION: ${{ env.REGION }}
          JOB_NAME: ${{ env.JOB_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          set +e
          gcloud run jobs execute "$JOB_NAME" --project "$PROJECT_ID" --region "$REGION" --wait --quiet
          RUN_EXIT=$?
          set -e
          EXECUTION="$(gcloud run jobs executions list --job="$JOB_NAME" --project "$PROJECT_ID" --region "$REGION" --limit=1 --sort-by='~metadata.creationTimestamp' --format='value(metadata.name)')"
          test -n "$EXECUTION"
          echo "EXECUTION=$EXECUTION" >> "$GITHUB_OUTPUT"
          echo "RUN_EXIT=$RUN_EXIT" >> "$GITHUB_OUTPUT"
          test "$RUN_EXIT" -eq 0

      - name: Collect and verify first production evidence
        if: always()
        env:
          EXPECTED_SHA: ${{ env.AUDIT_SHA }}
          JOB_NAME: ${{ env.JOB_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          FIRST_DIR="$RUNNER_TEMP/historical-exact-audit/first"
          mkdir -p "$FIRST_DIR"
          gcloud storage cp -r "$EVIDENCE_ROOT/*" "$FIRST_DIR/"
          python3 - "$FIRST_DIR" "$EXPECTED_SHA" "$JOB_NAME" "${{ steps.first.outputs.EXECUTION }}" <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          expected_sha = sys.argv[2]
          expected_job = sys.argv[3]
          expected_execution = sys.argv[4]
          required = {"coverage.json", "cleanup_plan.json", "conflicts.json", "report.md", "execution_metadata.json"}
          assert required <= {item.name for item in root.iterdir()}, sorted(item.name for item in root.iterdir())
          metadata = json.loads((root / "execution_metadata.json").read_text(encoding="utf-8"))
          assert metadata.get("git_sha") == expected_sha, metadata
          assert metadata.get("production") is True, metadata
          assert metadata.get("cloud_run_job") == expected_job, metadata
          assert metadata.get("cloud_run_execution"), metadata
          if expected_execution:
              assert metadata["cloud_run_execution"].split("/")[-1] == expected_execution.split("/")[-1], metadata
          assert metadata.get("status") == "COMPLETE", metadata
          safety = metadata.get("safety") or {}
          assert safety.get("image_asset_count_changed") is False, safety
          assert safety.get("review_state_changed") is False, safety
          assert safety.get("accepted_pool_changed") is False, safety
          assert safety.get("frozen_dataset_changed") is False, safety
          assert safety.get("gcs_source_images_deleted") == 0, safety
          coverage = json.loads((root / "coverage.json").read_text(encoding="utf-8"))
          assert coverage.get("missing") == 0, coverage
          assert coverage.get("coverage_complete") is True, coverage
          assert float(coverage.get("coverage_percent")) == 100.0, coverage
          assert coverage.get("before_counts") == coverage.get("after_counts"), coverage
          print("FIRST_PRODUCTION_AUDIT_PASS")
          PY

      - name: Execute second bootstrap for idempotency proof
        id: second
        env:
          PROJECT_ID: ${{ env.PROJECT_ID }}
          REGION: ${{ env.REGION }}
          JOB_NAME: ${{ env.JOB_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          set +e
          gcloud run jobs execute "$JOB_NAME" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --update-env-vars="AUDIT_GCS_OUTPUT_PREFIX=${SECOND_PREFIX}" \
            --wait --quiet
          RUN_EXIT=$?
          set -e
          EXECUTION="$(gcloud run jobs executions list --job="$JOB_NAME" --project "$PROJECT_ID" --region "$REGION" --limit=1 --sort-by='~metadata.creationTimestamp' --format='value(metadata.name)')"
          test -n "$EXECUTION"
          echo "EXECUTION=$EXECUTION" >> "$GITHUB_OUTPUT"
          echo "RUN_EXIT=$RUN_EXIT" >> "$GITHUB_OUTPUT"
          test "$RUN_EXIT" -eq 0

      - name: Collect and verify idempotency evidence
        shell: bash
        env:
          EXPECTED_SHA: ${{ env.AUDIT_SHA }}
        run: |
          set -euo pipefail
          SECOND_DIR="$RUNNER_TEMP/historical-exact-audit/second"
          mkdir -p "$SECOND_DIR"
          gcloud storage cp -r "$SECOND_PREFIX/*" "$SECOND_DIR/"
          python3 - "$RUNNER_TEMP/historical-exact-audit/first" "$SECOND_DIR" "$EXPECTED_SHA" <<'PY'
          import json
          import pathlib
          import sys

          first = pathlib.Path(sys.argv[1])
          second = pathlib.Path(sys.argv[2])
          expected_sha = sys.argv[3]
          first_coverage = json.loads((first / "coverage.json").read_text(encoding="utf-8"))
          second_coverage = json.loads((second / "coverage.json").read_text(encoding="utf-8"))
          assert second_coverage.get("missing") == 0, second_coverage
          assert second_coverage.get("coverage_complete") is True, second_coverage
          assert float(second_coverage.get("coverage_percent")) == 100.0, second_coverage
          assert second_coverage.get("created_global_content_rows") == 0, second_coverage
          assert second_coverage.get("created_global_duplicate_member_rows") == 0, second_coverage
          assert first_coverage.get("before_counts") == first_coverage.get("after_counts"), first_coverage
          assert second_coverage.get("before_counts") == second_coverage.get("after_counts"), second_coverage
          first_plan = json.loads((first / "cleanup_plan.json").read_text(encoding="utf-8"))
          second_plan = json.loads((second / "cleanup_plan.json").read_text(encoding="utf-8"))
          first_canon = {row["sha256"]: row.get("proposed_canonical_id") for row in first_plan.get("groups", [])}
          second_canon = {row["sha256"]: row.get("proposed_canonical_id") for row in second_plan.get("groups", [])}
          assert first_canon == second_canon, "canonical proposal changed between bootstrap runs"
          second_metadata = json.loads((second / "execution_metadata.json").read_text(encoding="utf-8"))
          assert second_metadata.get("git_sha") == expected_sha, second_metadata
          assert second_metadata.get("status") == "COMPLETE", second_metadata
          print("IDEMPOTENCY_GATE_PASS")
          PY

      - name: Upload production evidence as GitHub Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-exact-duplicate-production-${{ github.run_id }}
          path: ${{ runner.temp }}/historical-exact-audit
          if-no-files-found: warn

      - name: Publish production audit summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Historical Global Exact Duplicate Cleanup V1 · Phase A"
            echo "- GitHub ref: `$GITHUB_REF`"
            echo "- Audit SHA: `$AUDIT_SHA`"
            echo "- Cloud Run Job: `$JOB_NAME`"
            echo "- Execution 1: `${{ steps.first.outputs.EXECUTION }}`"
            echo "- Execution 2: `${{ steps.second.outputs.EXECUTION }}`"
            echo "- GCS evidence root: `$EVIDENCE_ROOT`"
            echo "- Phase B executed: **NO**"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -f "$RUNNER_TEMP/historical-exact-audit/first/coverage.json" ]]; then
            python3 - "$RUNNER_TEMP/historical-exact-audit/first" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import pathlib
          import sys
          root = pathlib.Path(sys.argv[1])
          with open(root / "coverage.json", encoding="utf-8") as handle:
              coverage = json.load(handle)
          with open(root / "cleanup_plan.json", encoding="utf-8") as handle:
              plan = json.load(handle)
          with open(root / "execution_metadata.json", encoding="utf-8") as handle:
              metadata = json.load(handle)
          summary = plan.get("summary") or {}
          print(f"- coverage_percent: **{coverage.get('coverage_percent')}**")
          print(f"- missing: **{coverage.get('missing')}**")
          print(f"- coverage_complete: **{coverage.get('coverage_complete')}**")
          print(f"- exact_duplicate_groups: **{summary.get('exact_duplicate_groups')}**")
          print(f"- affected_images: **{summary.get('affected_images')}**")
          print(f"- redundant_images: **{summary.get('redundant_images')}**")
          truth = (metadata.get("audit_summary") or {}).get("truth_conflicts") or {}
          accepted = (metadata.get("audit_summary") or {}).get("accepted_pool_exposure") or {}
          frozen = (metadata.get("audit_summary") or {}).get("frozen_dataset_exposure") or {}
          print(f"- truth_conflict_groups: **{truth.get('conflict_groups')}**")
          print(f"- truth_conflict_images: **{truth.get('conflict_members')}**")
          print(f"- accepted_pool_source_duplicate_groups: **{accepted.get('accepted_pool_source_duplicate_groups')}**")
          print(f"- accepted_pool_redundant_members: **{accepted.get('accepted_pool_redundant_members')}**")
          print(f"- duplicate_groups_present_in_frozen_datasets: **{frozen.get('duplicate_groups_present_in_frozen_datasets')}**")
          print(f"- cross_split_exact_duplicate_groups: **{frozen.get('cross_split_exact_duplicate_groups')}**")
          PY
          fi

      - name: Delete temporary Cloud Run Job after successful evidence collection
        if: success()
        env:
          PROJECT_ID: ${{ env.PROJECT_ID }}
          REGION: ${{ env.REGION }}
          JOB_NAME: ${{ env.JOB_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud run jobs delete "$JOB_NAME" --project "$PROJECT_ID" --region "$REGION" --quiet
          echo "- Temporary Cloud Run Job: **deleted**" >> "$GITHUB_STEP_SUMMARY"
