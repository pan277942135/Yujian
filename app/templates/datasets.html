<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>数据集 · 渔见 AI</title>
  <style>
    body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f6f7f8;color:#171717}header{background:#fff;border-bottom:1px solid #e5e7eb;padding:14px 24px;display:flex;gap:22px;align-items:center;position:sticky;top:0;z-index:3}header a{text-decoration:none;color:#111827;font-weight:650}main{max-width:1180px;margin:0 auto;padding:24px}.muted{color:#6b7280}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.section{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px;margin-top:18px}input,button{font:inherit;border:1px solid #d1d5db;border-radius:8px;padding:9px;background:#fff}button{cursor:pointer;font-weight:650}.primary{background:#111827;color:#fff}.row{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;margin:10px 0}.species{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#f3f4f6;font-size:12px}.good{background:#ecfdf5}.warn{background:#fff7ed}.big{font-size:34px;font-weight:750}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #eee;font-size:13px}th{color:#6b7280}.banner{display:none;white-space:pre-wrap;padding:12px;border-radius:10px;background:#eef2ff;margin-top:12px}.spinner{opacity:.6;pointer-events:none}.rule{border-left:4px solid #111827;padding:10px 12px;background:#f9fafb;border-radius:0 8px 8px 0;margin-top:14px}@media(max-width:850px){.grid{grid-template-columns:1fr}.section{overflow:auto}}
  </style>
</head>
<body>
<header><a href="/">总览</a><a href="/batches">数据批次</a><a href="/review">人工审核</a><a href="/species">鱼种管理</a><a href="/feedback">用户反馈</a><a href="/datasets">数据集</a></header>
<main>
  <h1>数据集版本</h1><div class="muted">数据集不是临时挑一批图片复制出来，而是“累计可用数据总池”在某一时刻的不可变快照。</div>
  <div id="banner" class="banner"></div>
  <div class="grid">
    <div class="section"><h2>累计可用数据总池</h2><div id="summary"></div><div class="rule"><b>默认规则：使用全部已通过数据</b><br><span class="muted">所有历史批次中当前审核为“通过”且鱼种已经启用的样本都会进入下一版数据集；候选鱼种样本继续保留，等鱼种启用后自动进入后续版本。</span></div></div>
    <div class="section"><h2>冻结新版本</h2><div class="row"><label>数据集版本</label><input id="version" value="DS_M1_v0.1"></div><div class="row"><label>父版本</label><input id="parent" placeholder="留空则自动继承最新版本"></div><div class="row"><label>代码版本</label><input id="git" value="unknown"></div><div class="row"><label>随机种子</label><input id="seed" type="number" value="20260826"></div><div class="row"><label>训练集比例</label><input id="train" type="number" step="0.01" value="0.70"></div><div class="row"><label>验证集比例</label><input id="val" type="number" step="0.01" value="0.15"></div><button class="primary" onclick="freeze()">冻结累计数据集</button><div class="muted" style="margin-top:9px">系统会同时生成数据清单、版本说明和类别映射文件；旧版本永不覆盖。</div></div>
  </div>
  <div class="section"><h2>已冻结版本</h2><table><thead><tr><th>版本</th><th>父版本</th><th>鱼种数</th><th>训练集</th><th>验证集</th><th>测试集</th><th>选样规则</th><th>状态</th></tr></thead><tbody id="datasets"></tbody></table></div>
</main>
<script>
function esc(v){return (v??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]));}
function msg(t,err=false){const b=document.getElementById('banner');b.style.display='block';b.style.background=err?'#fff1f2':'#eef2ff';b.textContent=t}
async function api(url,opts){const r=await fetch(url,opts);const text=await r.text();let d;try{d=JSON.parse(text)}catch{d=text}if(!r.ok)throw new Error(d.detail||text);return d}
function modeName(v){return ({ALL_APPROVED:'全部已通过数据'})[v]||v||'-'}function datasetStatus(v){return ({FROZEN:'已冻结'})[v]||v||'-'}
async function load(){try{const [s,d]=await Promise.all([api('/api/datasets/summary'),api('/api/datasets')]);document.getElementById('summary').innerHTML=`<div class="big">${s.approved_master_pool}</div><div class="muted">累计可用图片</div><div class="species"><span class="pill good">本轮新增通过 ${s.new_approved_since_latest_dataset}</span><span class="pill">已启用鱼种 ${s.active_species}</span><span class="pill warn">候选鱼种 ${s.candidate_species}</span><span class="pill">最新版本 ${esc(s.latest_dataset||'暂无')}</span></div><div class="species" style="margin-top:14px">${(s.approved_species||[]).map(x=>`<span class="pill">${esc(x.species)} ${x.count}</span>`).join('')}</div>`;if(!document.getElementById('parent').value&&s.latest_dataset)document.getElementById('parent').placeholder=`自动继承：${s.latest_dataset}`;document.getElementById('datasets').innerHTML=d.map(x=>`<tr><td><b>${esc(x.dataset_version)}</b></td><td>${esc(x.parent_version||'-')}</td><td>${x.species_count}</td><td>${x.train_count}</td><td>${x.val_count}</td><td>${x.test_count}</td><td><span class="pill">${esc(modeName(x.selection_mode))}</span></td><td><span class="pill good">${esc(datasetStatus(x.status))}</span></td></tr>`).join('')||'<tr><td colspan="8" class="muted">还没有冻结任何数据集版本</td></tr>'}catch(e){msg(e.message,true)}}
async function freeze(){const payload={dataset_version:document.getElementById('version').value.trim(),parent_version:document.getElementById('parent').value.trim()||null,git_commit:document.getElementById('git').value.trim()||'unknown',seed:Number(document.getElementById('seed').value),train:Number(document.getElementById('train').value),val:Number(document.getElementById('val').value)};document.body.classList.add('spinner');msg('正在冻结累计可用数据快照 …');try{const d=await api('/api/datasets/freeze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});msg(`数据集已冻结：${d.dataset_version}\n图片数量：${d.image_count}\n鱼种数量：${d.species_count}\n训练 / 验证 / 测试：${d.split_counts?.train||0} / ${d.split_counts?.val||0} / ${d.split_counts?.test||0}`);await load()}catch(e){msg(e.message,true)}finally{document.body.classList.remove('spinner')}}
load();
</script>
</body>
</html>
