<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鱼体自动资产流水线 V0.2</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f6f4;color:#17211f;font-family:system-ui,sans-serif}main{max-width:1480px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #dbe7e1;border-radius:16px;padding:16px;margin:14px 0}h1,h2{margin:0 0 9px}.muted{color:#64736d;font-size:13px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}button,input{font:inherit;border:1px solid #cbd9d3;border-radius:9px;padding:10px}button{background:#123b2e;color:#fff;border:0;font-weight:700;cursor:pointer}button:disabled{opacity:.5}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.step{padding:10px;border:1px solid #dbe7e1;border-radius:10px;background:#f9fbfa}.step b{display:block}.running{border-color:#d79b25;background:#fff7df}.success{border-color:#47a77a;background:#edf9f2}.skipped{border-color:#8d9d98;background:#f0f3f2}.blocked{border-color:#d79b25;background:#fff7df}.failed{border-color:#c75b5b;background:#fff0f0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.preview{min-height:220px;display:grid;place-items:center;background:#f7faf8;border:1px dashed #cbd9d3;border-radius:12px;overflow:hidden}.preview img{max-width:100%;max-height:520px;object-fit:contain}.log{white-space:pre-wrap;background:#10241d;color:#e8f4ef;border-radius:12px;padding:14px;min-height:130px;font:12px/1.5 ui-monospace,monospace}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#e4f3eb;color:#08734d;font-weight:700}@media(max-width:900px){main{padding:12px}.grid,.steps{grid-template-columns:1fr}.toolbar{display:grid;grid-template-columns:1fr}.toolbar>*{width:100%;min-height:44px}}
</style></head>
<body><header>{% include "_mobile_ux.html" %}</header><main>
<h1>鱼体自动资产流水线 <span class="badge">V0.2</span></h1><p class="muted">默认一键生成；原有手动遮罩页不变，作为高级调试工具保留。</p>
<section class="card"><div class="toolbar"><input id="file" type="file" accept="image/jpeg,image/png,image/webp"><input id="label" placeholder="案例标签（可选）"><button id="run">一键生成鱼体资产</button></div><p id="status" class="muted">等待选择图片</p></section>
<section class="card"><h2>流水线进度</h2><div id="steps" class="steps"></div></section>
<section class="card"><h2>流水线 Trace（运行追踪）</h2><pre id="log" class="log"></pre></section>
<section class="card"><h2>结果资产</h2><div id="results" class="grid"></div></section>
<section class="card"><h2>自动判断</h2><pre id="analysis" class="log">尚未运行</pre></section>
<section class="card"><h2>Completion Worker（补全工作节点）</h2><pre id="worker" class="log">尚未检测</pre></section>
<section class="card"><details><summary><b>展开高级调试</b></summary><p>手动遮罩编辑器、SAM 叠加层和诊断信息保留在原实验页。</p><a href="/debug/fish-completion-lab">打开 Manual Mask Editor（高级调试）</a></details></section>
<script>
const names=["上传与检测","鱼体分割","完整度判断","自动补全区域","AI 补全","边缘优化","描边输出","最终资产"],$=id=>document.getElementById(id);
const labels={SUCCESS:"成功",SKIPPED:"已跳过",BLOCKED:"未通过安全门",FAILED:"失败",RUNNING:"进行中",WAITING:"等待中"};
function steps(states){$("steps").innerHTML=names.map(function(n,i){const s=states[i]||"WAITING";return "<div class=\"step "+s.toLowerCase()+"\"><b>"+(i+1)+". "+n+"</b><span>"+(labels[s]||s)+"</span></div>"}).join("")}
function log(msg,data){$("log").textContent+="["+new Date().toLocaleTimeString()+"] "+msg+(data?"\n"+JSON.stringify(data,null,2):"")+"\n"}
async function responseJson(r){const t=await r.text();try{return JSON.parse(t)}catch(_){return{status:"error",stage:"network",error:{error_code:"HTTP_NON_JSON",message:t||("HTTP "+r.status),detail:{raw:t}}}}}
function render(data){const a=data.assets||{},items={original_image:"A · 原图",sam_transparent:"B · SAM 分割",analysis_visible_mask:"C1 · 分析可见遮罩",structural_envelope:"C2 · 结构包络",completion_candidate_overlay:"C3 · 补全候选区",accepted_completion_overlay:"C4 · 接受补全区",completion_candidate:"C5 · 补全候选遮罩",auto_completion_mask:"C6 · 接受补全遮罩",edge_refined:"D · 边缘优化","fish_clean.png":"E · Clean 透明鱼体","fish_gold_outline.png":"F · Gold 描边","fish_black_outline.png":"G · Black 描边",completion_roi:"H · Completion ROI",generated_roi:"I · Worker 生成区域",final_asset:"J · 最终合成资产"};$("results").innerHTML=Object.entries(items).filter(function(x){return a[x[0]]}).map(function(x){return "<div><b>"+x[1]+"</b><div class=\"preview\"><img src=\""+a[x[0]]+"\" alt=\""+x[1]+"\"></div></div>"}).join("")}
function trace(d){log("Detector bbox normalized/pixel",{normalized:d.detector&&d.detector.bbox_normalized,pixel:d.detector&&d.detector.bbox_pixel});log("SAM mask",d.segmentation);log("Auto completion",d.auto_completion);log("Completion mask semantics",{candidate_pixels:d.trace&&d.trace.candidate_area_pixels,accepted_pixels:d.trace&&d.trace.accepted_area_pixels,boundary_overlap_ratio:d.trace&&d.trace.boundary_overlap_ratio,perimeter_coverage:d.trace&&d.trace.perimeter_coverage,debug_assets:["analysis_visible_mask","structural_envelope","completion_candidate_overlay","accepted_completion_overlay"]});log("Completion ROI",(d.worker&&d.worker.roi)||null);log("Worker",d.worker);log("Protected Compose",d.composition);log("Edge/Outline",{edge:d.assets&&d.assets.edge_refined?"PASS":"FAIL",outline:d.assets&&d.assets["fish_clean.png"]?"PASS":"FAIL"})}
async function run(){const f=$("file").files[0];if(!f){$("status").textContent="请先选择图片";return}$("run").disabled=true;$("log").textContent="";steps(["RUNNING"]);log("上传与检测开始",{file:f.name,size:f.size});const fd=new FormData();fd.append("file",f,f.name);fd.append("case_label",$("label").value);try{const r=await fetch("/api/debug/fish-completion-lab-v02/auto-run",{method:"POST",credentials:"include",body:fd}),b=await responseJson(r);log("API 返回",{status:r.status,body:b});if(!r.ok||b.status==="error")throw b;const d=b.data||{},w=d.worker||{},a=d.auto_completion||{},s=Array(8).fill("WAITING");s[0]="SUCCESS";s[1]="SUCCESS";s[2]="SUCCESS";s[3]=a.completion_required?(w.status==="NOT_ELIGIBLE"?"BLOCKED":"SUCCESS"):(a.severity==="NOT_ELIGIBLE"?"BLOCKED":"SKIPPED");s[4]=w.status==="WORKER_EXECUTED"?"SUCCESS":(["NOT_REQUIRED","NOT_ELIGIBLE"].includes(w.status)?(w.status==="NOT_REQUIRED"?"SKIPPED":"BLOCKED"):"FAILED");s[5]=d.assets&&d.assets.edge_refined?"SUCCESS":"FAILED";s[6]=d.assets&&d.assets["fish_gold_outline.png"]?"SUCCESS":"FAILED";s[7]=d.assets&&d.assets["fish_clean.png"]?"SUCCESS":"FAILED";steps(s);trace(d);render(d);$("analysis").textContent=JSON.stringify(a,null,2);$("worker").textContent=JSON.stringify(w,null,2);$("status").textContent=w.status==="WORKER_EXECUTED"?"自动资产流水线完成：Worker 已执行":w.status==="WORKER_UNAVAILABLE"?"自动补全失败：Worker 未配置":w.status==="NOT_ELIGIBLE"?"自动补全安全门未通过":w.status==="NOT_REQUIRED"?"无需补全，已输出基础资产":"自动流程已完成，请查看步骤状态"}catch(e){const x=e.error?e:{error:{error_code:"CLIENT_PIPELINE_FAILED",message:e.message||String(e)}};log("流水线失败",x);$("status").textContent=x.error&&x.error.message||"流水线失败";steps(["FAILED"])}finally{$("run").disabled=false}}
steps([]);$("run").addEventListener("click",run);
</script></main></body></html>
