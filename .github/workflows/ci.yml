name: ci

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      ORT_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile Python
        run: python -m compileall app evaluation scripts trainer tests
      - name: Run SWOS resource quality probe unit tests (offline)
        run: python -m pytest -q tests/test_swos_mask_quality_probe.py
      - name: Validate deployment shell syntax
        run: |
          bash -n scripts/deploy_console_gcp.sh
          bash -n scripts/deploy_training_gcp.sh
          bash -n scripts/bootstrap_github_wif.sh
          bash -n scripts/deploy_console_runtime.sh
          bash -n scripts/deploy_backend_integration.sh
      - name: Import Model Factory Console
        env:
          REGISTRY_DB_URL: 'sqlite:///:memory:'
        run: python -c "from app.entry import app; from app.db import init_db; init_db(); p=app.openapi()['paths']; print(app.title, app.version); assert '/health/deploy' in p; assert '/api/automation/dataset-readiness' in p; assert '/api/automation/feedback-status' in p; assert '/api/presence/scan' in p; assert '/api/dedupe/scan' in p; assert '/api/bulk-review/apply' in p; assert '/review/bulk' in p; assert '/inspect' in p; assert '/api/inspect/images' in p; assert '/api/inspect/presence/{batch_id}/{image_id}' in p; assert '/api/datasets/freeze' in p; assert '/api/dataset-freeze/preview' in p; assert '/api/dataset-freeze/{dataset_version}/finalize' in p; assert '/api/dataset-freeze/{dataset_version}/items' in p; assert '/api/dataset-freeze/{dataset_version}/audit' in p; assert '/training' in p; assert '/api/training/runs' in p; assert '/api/training/runs/{run_id}/metrics' in p; assert '/api/models' in p; assert '/inference' in p; assert '/api/inference/models' in p; assert '/api/inference/predict' in p; assert '/api/inference/batch' in p; assert '/api/feedback/ingest' in p; assert '/api/v1/inference/upload' in p; assert '/api/v1/inference/{image_id}/review' in p; assert '/api/v1/auth/register' in p; assert '/api/v1/auth/login' in p; assert '/api/v1/catches' in p; assert '/api/v1/catches/upload-image' in p; assert '/api/v1/catches/statistics' in p; assert '/intelligence' in p; assert '/api/intelligence' in p; assert '/api/intelligence/tasks/{task_id}/batch' in p; assert '/crop-qa' in p; assert '/api/crop-qa' in p; assert '/media/inference/{image_id}/{kind}' in p; assert '/crop-datasets' in p; assert '/crop-review' in p; assert '/fish-knowledge' in p; assert '/api/v1/fish/species' in p; assert '/api/v1/fish/species/{species_id}' in p; assert '/api/v1/fish/species/{species_id}/detail' in p; assert '/api/v1/fish/gallery/{image_id}/media' in p; assert '/api/v1/admin/fish/species' in p; assert '/api/v1/admin/fish/species/{species_id}/gallery/upload' in p; assert '/api/v1/admin/fish/species/{species_id}/videos' in p; assert '/api/v1/admin/fish/species/{species_id}/cover' in p; assert '/api/v1/admin/fish/species/{species_id}/cards' in p; assert '/api/v1/admin/fish/cards/{card_id}' in p; assert '/api/v1/admin/fish/species/{species_id}/completion' in p; assert '/api/admin/fish/assets/upload' in p"
      - name: Validate DET_FISH console routes
        env:
          REGISTRY_DB_URL: 'sqlite:///:memory:'
        run: python -c "from app.entry import app; p=app.openapi()['paths']; assert '/platform/model/det-fish-training' in p; assert '/platform/model/det-fish-test' in p; assert '/api/det-fish/training/status' in p; assert '/api/det-fish/training/start' in p; assert '/api/det-fish/models' in p; assert '/api/det-fish/test' in p; assert '/api/det-fish/negative-pool/summary' in p; assert '/api/det-fish/negative-pool' in p; assert '/api/det-fish/negative-pool/candidates' in p; assert '/api/det-fish/negative-pool/historical-v01-audit' in p; assert '/api/det-fish/negative-pool/add' in p; assert '/api/det-fish/negative-pool/remove' in p"
      - name: Run DET_FISH dataset gate and console contract tests
        run: python -m pytest -q tests/test_detector_dataset_gate.py tests/test_det_fish_console.py tests/test_det_fish_negative_pool.py tests/test_detector_dataset_v02_builder.py
      - name: Run unified top navigation smoke test
        env:
          REGISTRY_DB_URL: 'sqlite:///:memory:'
        run: python scripts/smoke_unified_nav.py
      - name: Validate Crop Dataset pipeline routes
        env:
          REGISTRY_DB_URL: 'sqlite:///:memory:'
        run: python -c "from app.entry import app; p=app.openapi()['paths']; assert '/api/crop-datasets/build' in p; assert '/api/crop-datasets/sources' in p; assert '/api/crop-datasets/{dataset_version}/freeze' in p; assert '/api/crop-datasets/{dataset_version}/validation' in p; assert '/api/crop-datasets/{dataset_version}/status' in p; assert '/api/crop-review/{batch_id}/items' in p; assert '/api/crop-review/{batch_id}/{image_id}' in p"
      - name: Run Console flywheel smoke test
        env:
          REGISTRY_DB_URL: 'sqlite:///:memory:'
        run: python scripts/smoke_console.py
      - name: Run P0 efficiency smoke test
        env:
          REGISTRY_DB_URL: 'sqlite:///:memory:'
        run: python scripts/smoke_efficiency.py
      - name: Run P0 automation smoke test
        env:
          REGISTRY_DB_URL: 'sqlite:///:memory:'
        run: python scripts/smoke_p0_automation.py
      - name: Run Dataset Freeze smoke test
        env:
          REGISTRY_DB_URL: 'sqlite:///:memory:'
        run: python scripts/smoke_dataset_freeze.py
      - name: Run P0 business-state consistency smoke test
        env:
          REGISTRY_DB_URL: 'sqlite:///:memory:'
        run: python scripts/smoke_business_state.py
      - name: Run quick-review batch truth species UI smoke test
        run: python scripts/smoke_bulk_species_ui.py
      - name: Run classifier training API smoke test
        env:
          REGISTRY_DB_URL: 'sqlite:///:memory:'
        run: python scripts/smoke_training.py
      - name: Run inference V1 single and batch smoke test
        env:
          REGISTRY_DB_URL: 'sqlite:///:memory:'
        run: python scripts/smoke_inference.py
      - name: Run production recognition pipeline tests
        env:
          REGISTRY_DB_URL: 'sqlite:///:memory:'
        run: python -m pytest -q tests
      - name: Run UAT deploy config smoke test
        env:
          REGISTRY_DB_URL: 'sqlite:///:memory:'
        run: python scripts/smoke_uat_deploy_config.py
      - name: Validate project config exists
        run: test -f config/project.yaml
      - name: Validate registry schema exists
        run: test -f schemas/registry.sql
      - name: Validate Dataset Freeze migration exists
        run: test -f schemas/0012_dataset_freeze_v01.sql
      - name: Validate Crop Dataset migration exists
        run: test -f schemas/0017_crop_dataset_v2.sql
      - name: Validate production pipeline migration exists
        run: test -f schemas/0013_production_pipeline_v2.sql
      - name: Validate training eligibility migration exists
        run: test -f schemas/0029_training_eligibility_v1.sql
      - name: Validate Fish Knowledge migration exists
        run: test -f schemas/0014_fish_knowledge_v1.sql
      - name: Validate Fish Knowledge V1.1 migrations exist
        run: test -f schemas/0015_fish_cards_v11.sql && test -f schemas/0016_fish_species_cover_v11.sql
      - name: Validate Fish Knowledge CRUD migration exists
        run: test -f schemas/0017_fish_knowledge_crud_v1.sql
      - name: Validate Fish Knowledge Asset V1.3 migration exists
        run: test -f schemas/0030_fish_knowledge_assets_v13.sql
      - name: Validate MVP user-catch migration exists
        run: test -f schemas/0020_user_catches_mvp_v1.sql
      - name: Validate Qwen B-side migration exists
        run: test -f schemas/0023_qwen_bside_visual_v1.sql
      - name: Validate Image Studio migration exists
        run: test -f schemas/0024_image_studio_v1.sql
      - name: Validate classifier trainer assets exist
        run: test -f Dockerfile.trainer && test -f requirements-training.txt && test -f infra/cloudbuild.trainer.yaml
      - name: Validate inference runtime image configuration
        run: grep -q 'torch==2.7.1' Dockerfile && grep -q 'torchvision==0.22.1' Dockerfile && grep -q -- '--memory=2Gi' scripts/deploy_console_gcp.sh

  det-fish-display-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install application and Chromium harness dependencies
        run: python -m pip install -r requirements.txt playwright
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Download and verify public catch photo fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/det-fish-display"
          curl -fL --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/det-fish-display/landscape.jpg" \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Fish_caught_with_a_rod_in_Gambia.jpg'
          curl -fL --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/det-fish-display/portrait.jpg" \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Portrait_of_man_on_boat_holding_a_caught_fish_%28AM_81857-1%29.jpg'
          echo '6117d964dd10ee8f3f38d82b78441c7e03a2402cbfd623e6d05d9d2d75685581  '"$RUNNER_TEMP/det-fish-display/landscape.jpg" | sha256sum -c -
          echo 'd806491e4711a58aa242c8ef3feb6fcc0e9b13c56c5db5e7808203134b3c1ffa  '"$RUNNER_TEMP/det-fish-display/portrait.jpg" | sha256sum -c -
      - name: Run desktop and narrow-screen DET_FISH display smoke
        env:
          ORT_DISABLE_TELEMETRY: '1'
          DET_FISH_LANDSCAPE_PHOTO: ${{ runner.temp }}/det-fish-display/landscape.jpg
          DET_FISH_PORTRAIT_PHOTO: ${{ runner.temp }}/det-fish-display/portrait.jpg
        run: python scripts/smoke_det_fish_display_chromium.py
      - name: Upload Chromium screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: det-fish-display-chromium-${{ github.run_id }}
          path: test-results/det-fish-display/*.png
          if-no-files-found: warn
