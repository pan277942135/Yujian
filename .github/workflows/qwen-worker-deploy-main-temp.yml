name: Temporary Qwen Worker Deploy (main)

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  GCP_AUTH_PROJECT: gemini-api-project-503706
  GCP_VM_PROJECT: gen-lang-client-0224022273
  GCP_ZONE: us-central1-a
  GCP_INSTANCE: fish-completion-worker
  GCP_USER: pan277942135
  WIF_PROVIDER: projects/571785698442/locations/global/workloadIdentityPools/github-actions/providers/yujian-main
  DEPLOY_SERVICE_ACCOUNT: yujian-github-deployer@gemini-api-project-503706.iam.gserviceaccount.com

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout worker source
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3.0.0
        with:
          project_id: ${{ env.GCP_AUTH_PROJECT }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3.0.1
        with:
          project_id: ${{ env.GCP_AUTH_PROJECT }}
          version: '>= 416.0.0'

      - name: Sync Worker to GPU VM
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="/tmp/qwen-worker-${GITHUB_SHA}.tar.gz"
          REMOTE_TMP="/tmp/qwen-worker-${GITHUB_SHA}"
          tar -czf "$ARCHIVE" -C workers fish-qwen-refine-worker
          gcloud compute scp "$ARCHIVE" \
            "${GCP_USER}@${GCP_INSTANCE}:${REMOTE_TMP}.tar.gz" \
            --project="${GCP_VM_PROJECT}" \
            --zone="${GCP_ZONE}" \
            --quiet

          gcloud compute ssh "${GCP_USER}@${GCP_INSTANCE}" \
            --project="${GCP_VM_PROJECT}" \
            --zone="${GCP_ZONE}" \
            --quiet \
            --command="
              set -euo pipefail
              sudo install -d '$REMOTE_TMP'
              sudo tar -xzf '$REMOTE_TMP.tar.gz' -C '$REMOTE_TMP'
              sudo install -d /opt/fish-qwen-refine-worker/output
              if [[ -f /opt/fish-qwen-refine-worker/worker.py ]]; then
                sudo cp /opt/fish-qwen-refine-worker/worker.py /opt/fish-qwen-refine-worker/worker.py.before-${GITHUB_SHA}
              fi
              sudo cp -a '$REMOTE_TMP/fish-qwen-refine-worker/.' /opt/fish-qwen-refine-worker/
              sudo chown -R '${GCP_USER}:${GCP_USER}' /opt/fish-qwen-refine-worker
              sudo /opt/fish-qwen-refine-worker/.venv/bin/pip install -r /opt/fish-qwen-refine-worker/requirements.txt
              sudo systemctl daemon-reload
              sudo systemctl restart fish-qwen-refine-worker
              sudo systemctl is-active --quiet fish-qwen-refine-worker
            "

      - name: Wait for model warmup and verify health
        shell: bash
        run: |
          set -euo pipefail
          HEALTH=""
          for attempt in $(seq 1 180); do
            HEALTH="$(gcloud compute ssh "${GCP_USER}@${GCP_INSTANCE}" \
              --project="${GCP_VM_PROJECT}" \
              --zone="${GCP_ZONE}" \
              --quiet \
              --command='curl -sS --max-time 20 http://127.0.0.1:8002/health' || true)"
            echo "health attempt=${attempt}: ${HEALTH}"
            STATE="$(printf '%s' "$HEALTH" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))' 2>/dev/null || true)"
            if [[ "$STATE" == "ready" ]]; then
              break
            fi
            if [[ "$STATE" == "error" ]]; then
              gcloud compute ssh "${GCP_USER}@${GCP_INSTANCE}" \
                --project="${GCP_VM_PROJECT}" \
                --zone="${GCP_ZONE}" \
                --quiet \
                --command='sudo journalctl -u fish-qwen-refine-worker -n 160 --no-pager'
              exit 1
            fi
            sleep 10
          done
          FINAL_STATE="$(printf '%s' "$HEALTH" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))' 2>/dev/null || true)"
          test "$FINAL_STATE" = "ready"
          printf '%s\n' "$HEALTH" | python3 -m json.tool

      - name: Verify GPU residency
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute ssh "${GCP_USER}@${GCP_INSTANCE}" \
            --project="${GCP_VM_PROJECT}" \
            --zone="${GCP_ZONE}" \
            --quiet \
            --command='
              set -euo pipefail
              systemctl is-active --quiet fish-qwen-refine-worker
              nvidia-smi --query-gpu=name,memory.used,memory.total --format=csv,noheader
              curl -fsS http://127.0.0.1:8002/health
            '

      - name: Run fixed-seed performance smoke
        shell: bash
        run: |
          set -euo pipefail
          TEST_IMAGE="$(gcloud compute ssh "${GCP_USER}@${GCP_INSTANCE}" \
            --project="${GCP_VM_PROJECT}" \
            --zone="${GCP_ZONE}" \
            --quiet \
            --command='find /opt/ComfyUI/input -maxdepth 1 -type f \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.webp" \) | sort | head -1' | tr -d '\r')"
          if [[ -z "$TEST_IMAGE" ]]; then
            echo "No fixed worker test image found; health and GPU checks already passed."
            exit 0
          fi
          echo "Using fixed test image: $TEST_IMAGE"
          gcloud compute ssh "${GCP_USER}@${GCP_INSTANCE}" \
            --project="${GCP_VM_PROJECT}" \
            --zone="${GCP_ZONE}" \
            --quiet \
            --command="curl -sS --max-time 1200 -X POST \
              -F image=@${TEST_IMAGE} \
              -F 'params={\"mode\":\"fish_preserve_refine_qwen_v1\",\"steps\":25,\"seed\":12345,\"source_run_id\":\"P0_FIXED_LATENCY_TEST\",\"prompt\":\"Restore and refine this fish.\",\"negative_prompt\":\"deformed, duplicate, artifact\"}' \
              http://127.0.0.1:8002/refine | tee /tmp/qwen-p0-performance.json"
          gcloud compute ssh "${GCP_USER}@${GCP_INSTANCE}" \
            --project="${GCP_VM_PROJECT}" \
            --zone="${GCP_ZONE}" \
            --quiet \
            --command='cat /tmp/qwen-p0-performance.json'
