{% extends "platform/base.html" %}

{% block head %}
<style>
  .task-shell{display:grid;gap:16px}
  .task-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .task-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .task-actions select,.task-actions button,.task-actions a{border:1px solid #cfe0d8;border-radius:9px;background:#fff;color:#285247;padding:9px 12px;font:inherit;text-decoration:none}
  .task-actions button{cursor:pointer;font-weight:700}
  .queue-strip{display:flex;gap:12px;flex-wrap:wrap}
  .queue-card{min-width:120px;border:1px solid #d9e6e1;border-radius:11px;background:#fbfefd;padding:10px 12px}
  .queue-card strong{display:block;font-size:18px;color:#285849}.queue-card span{font-size:11px;color:var(--muted)}
  .task-table-wrap{overflow:auto;border:1px solid #dde8e4;border-radius:12px;background:#fff}
  .task-table{width:100%;border-collapse:collapse;min-width:920px}
  .task-table th,.task-table td{padding:11px 12px;border-bottom:1px solid #edf2f0;text-align:left;vertical-align:middle}
  .task-table th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#71827c;background:#f8fbfa}
  .task-table td{font-size:13px;color:#2d4f45}
  .task-id{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .status-badge{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800}
  .status-queued{background:#f2f4f7;color:#59636e}
  .status-running{background:#fff4d8;color:#8a6514}
  .status-success{background:#e9f7ef;color:#28704c}
  .status-failed{background:#fdecec;color:#a13d3d}
  .row-actions{display:flex;gap:7px;align-items:center;white-space:nowrap}
  .row-actions a{border:1px solid #ccded6;border-radius:8px;padding:6px 9px;color:#245f50;text-decoration:none;font-size:12px;font-weight:700}
  .row-actions a.primary{background:#245f50;color:#fff;border-color:#245f50}
  .empty-state{padding:42px;text-align:center;color:var(--muted)}
  .task-note{font-size:12px;color:var(--muted)}
</style>
{% endblock %}

{% block content %}
<div class="task-shell">
  <section class="panel task-head">
    <div>
      <h1 style="margin:0 0 5px">任务处理列表</h1>
      <p class="task-note" style="margin:0">Image Studio 所有任务统一在这里查看状态、详情和下载结果。队列按 FIFO 单 L4 串行处理。</p>
    </div>
    <div class="task-actions">
      <select id="taskStatusFilter" aria-label="任务状态">
        <option value="ALL">全部状态</option>
        <option value="QUEUED">QUEUED</option>
        <option value="RUNNING">RUNNING</option>
        <option value="SUCCESS">SUCCESS</option>
        <option value="FAILED">FAILED</option>
      </select>
      <button id="taskRefresh" type="button">刷新</button>
      <a href="/platform/image-studio">返回图生图工作台</a>
    </div>
  </section>

  <section class="queue-strip" aria-label="队列概览">
    <div class="queue-card"><strong id="queueRunning">–</strong><span>当前生成</span></div>
    <div class="queue-card"><strong id="queueQueued">–</strong><span>排队等待</span></div>
    <div class="queue-card"><strong id="queueTotal">–</strong><span>活动任务</span></div>
    <div class="queue-card"><strong>1</strong><span>L4 并发</span></div>
  </section>

  <section class="task-table-wrap">
    <table class="task-table">
      <thead>
        <tr>
          <th>状态</th>
          <th>任务 ID</th>
          <th>模式</th>
          <th>排队</th>
          <th>Steps</th>
          <th>耗时</th>
          <th>创建时间</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="taskRows"></tbody>
    </table>
    <div id="taskEmpty" class="empty-state" hidden>暂无匹配任务</div>
  </section>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  let items = [];

  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function formatTime(value) {
    if (!value) return "—";
    const date = new Date(value);
    return Number.isNaN(date.getTime()) ? value : date.toLocaleString();
  }

  function formatElapsed(value) {
    if (value == null) return "—";
    const ms = Number(value);
    if (!Number.isFinite(ms)) return "—";
    return ms >= 1000 ? (ms / 1000).toFixed(1) + " s" : ms + " ms";
  }

  function statusClass(status) {
    return {
      QUEUED: "status-queued",
      RUNNING: "status-running",
      SUCCESS: "status-success",
      FAILED: "status-failed"
    }[status] || "status-queued";
  }

  function applyQueue(queue) {
    $("queueRunning").textContent = Number(queue?.running || 0);
    $("queueQueued").textContent = Number(queue?.queued || 0);
    $("queueTotal").textContent = Number(queue?.active || 0);
  }

  function render() {
    const filter = $("taskStatusFilter").value;
    const visible = filter === "ALL" ? items : items.filter((run) => run.status === filter);
    const body = $("taskRows");
    body.innerHTML = "";
    $("taskEmpty").hidden = visible.length > 0;

    visible.forEach((run) => {
      const row = document.createElement("tr");
      const detailUrl = "/platform/image-studio/tasks/" + encodeURIComponent(run.run_id);
      const downloadUrl = "/api/image-studio/v1/runs/" + encodeURIComponent(run.run_id) + "/download/output";
      const queueText = run.status === "QUEUED"
        ? (run.queue_position ? "第 " + run.queue_position + " 位" : "等待")
        : (run.status === "RUNNING" ? "生成中" : "—");
      const download = run.status === "SUCCESS" && run.output_image_url
        ? '<a class="primary" href="' + downloadUrl + '">下载结果</a>'
        : "";
      row.innerHTML =
        '<td><span class="status-badge ' + statusClass(run.status) + '">' + escapeHtml(run.status) + '</span></td>' +
        '<td><div class="task-id" title="' + escapeHtml(run.run_id) + '">' + escapeHtml(run.run_id) + '</div></td>' +
        '<td>' + escapeHtml(run.mode || "—") + '</td>' +
        '<td>' + escapeHtml(queueText) + '</td>' +
        '<td>' + escapeHtml(run.steps ?? "—") + '</td>' +
        '<td>' + escapeHtml(formatElapsed(run.elapsed_ms)) + '</td>' +
        '<td>' + escapeHtml(formatTime(run.created_at)) + '</td>' +
        '<td><div class="row-actions"><a href="' + detailUrl + '">查看详情</a>' + download + '</div></td>';
      body.appendChild(row);
    });
  }

  async function load() {
    try {
      const response = await fetch("/api/image-studio/v1/runs?ts=" + Date.now(), {cache:"no-store"});
      if (!response.ok) throw new Error("任务列表读取失败");
      const payload = await response.json();
      items = payload.items || [];
      applyQueue(payload.queue);
      render();
    } catch (error) {
      $("taskRows").innerHTML = "";
      $("taskEmpty").hidden = false;
      $("taskEmpty").textContent = "读取失败 · " + error.message;
    }
  }

  $("taskStatusFilter").addEventListener("change", render);
  $("taskRefresh").addEventListener("click", load);
  load();
  window.setInterval(load, 3000);
})();
</script>
{% endblock %}
