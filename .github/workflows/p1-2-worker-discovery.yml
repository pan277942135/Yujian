name: P1.2 Worker Auto Start Discovery

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT_ID: gemini-api-project-503706
      VM: fish-completion-worker
      ZONE: us-central1-a
    steps:
      - name: Authenticate to Google Cloud with GitHub OIDC/WIF
        uses: google-github-actions/auth@v3.0.0
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/571785698442/locations/global/workloadIdentityPools/github-actions/providers/yujian-main
          service_account: yujian-github-deployer@gemini-api-project-503706.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3.0.1
        with:
          project_id: ${{ env.PROJECT_ID }}
          version: ">= 416.0.0"

      - name: Discover Worker process and startup ownership
        shell: bash
        run: |
          set -u
          echo "ACTIVE_GCLOUD_ACCOUNT=$(gcloud auth list --filter=status:ACTIVE --format='value(account)' | head -1)"

          REMOTE_SCRIPT='
          set -u
          echo "=== LISTEN_8080_RAW ==="
          LISTEN_RAW="$(sudo ss -lntp | grep ":8080" || true)"
          printf "%s\n" "$LISTEN_RAW"

          echo "=== PROCESS_RAW ==="
          ps -eo user,pid,ppid,lstart,cmd | grep -Ei "uvicorn|gunicorn|powerpaint|completion" | grep -v grep || true

          echo "=== SYSTEMD_UNITS_RAW ==="
          sudo systemctl list-units --type=service --all | grep -Ei "fish|completion|powerpaint|uvicorn|gunicorn" || true

          echo "=== SYSTEMD_UNIT_FILES_RAW ==="
          sudo systemctl list-unit-files | grep -Ei "fish|completion|powerpaint|uvicorn|gunicorn" || true

          PID="$(printf "%s\n" "$LISTEN_RAW" | sed -n "s/.*pid=\([0-9][0-9]*\).*/\1/p" | head -1)"
          if [ -n "$PID" ]; then
            echo "=== PROCESS_DETAIL ==="
            echo "PID=$PID"
            echo "WORKER_USER=$(ps -o user= -p "$PID" | xargs)"
            echo "WORKER_EXE=$(sudo readlink -f "/proc/$PID/exe")"
            echo "WORKER_CWD=$(sudo readlink -f "/proc/$PID/cwd")"
            printf "WORKER_CMD="
            sudo tr "\0" " " < "/proc/$PID/cmdline"
            echo
            echo "RELEVANT_ENV="
            sudo tr "\0" "\n" < "/proc/$PID/environ" | grep -E "^(PATH|PYTHONPATH|VIRTUAL_ENV|CUDA_VISIBLE_DEVICES|POWERPAINT|MODEL|PORT|HOST)=" | sort || true
          else
            echo "PID=NOT_FOUND"
          fi
          '

          set +e
          SSH_OUTPUT="$(gcloud compute ssh "$VM"             --project="$PROJECT_ID"             --zone="$ZONE"             --quiet             --ssh-key-expire-after=5m             --command="$REMOTE_SCRIPT" 2>&1)"
          SSH_RC=$?
          set -e

          printf "%s\n" "$SSH_OUTPUT"
          echo "SSH_RC=$SSH_RC"

          if [ "$SSH_RC" -ne 0 ]; then
            echo "P1_2_DISCOVERY_STATUS=BLOCKED_SSH"
            exit "$SSH_RC"
          fi

          echo "P1_2_DISCOVERY_STATUS=PASS"
