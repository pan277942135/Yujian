name: p0-self-patch

on:
  push:
    branches:
      - 'fix/truth-species-statistics-20260828'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[p0-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/truth-species-statistics-20260828
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply P0 patch
        run: python scripts/_p0_apply.py
      - name: Compile
        run: python -m compileall app scripts trainer
      - name: Business state regression
        env:
          REGISTRY_DB_URL: 'sqlite:///:memory:'
        run: python scripts/smoke_business_state.py
      - name: Existing smoke tests
        env:
          REGISTRY_DB_URL: 'sqlite:///:memory:'
        run: |
          python scripts/smoke_console.py
          python scripts/smoke_efficiency.py
          python scripts/smoke_dataset_freeze.py
          python scripts/smoke_training.py
      - name: Commit patched tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: enforce P0 data-state consistency [p0-applied]"
          git push origin HEAD:fix/truth-species-statistics-20260828
