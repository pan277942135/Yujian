<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>快速审核 · 渔见 AI</title>
  <style>
    body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f6f7f8;color:#171717}header{background:#fff;border-bottom:1px solid #e5e7eb;padding:12px 22px;display:flex;gap:18px;align-items:center;position:sticky;top:0;z-index:5}header a{text-decoration:none;color:#111827;font-weight:650}main{max-width:1440px;margin:0 auto;padding:20px}.bar,.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:12px;margin:12px 0}.spacer{flex:1}select,button{font:inherit;border:1px solid #d1d5db;border-radius:8px;padding:8px;background:#fff}button{cursor:pointer;font-weight:650}.primary{background:#111827;color:#fff}.soft{background:#f3f4f6}.danger{background:#fff1f2}.pending{background:#fff7ed}.speciesTabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.speciesTabs button{font-size:13px}.speciesTabs .active{background:#111827;color:#fff}.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}.card{background:#fff;border:2px solid transparent;border-radius:12px;padding:8px;box-shadow:0 1px 1px rgba(0,0,0,.03)}.card[data-state="approved"]{border-color:#059669}.card[data-state="rejected"]{border-color:#e11d48}.card[data-state="pending"]{border-color:#d97706}.photo{width:100%;aspect-ratio:4/3;object-fit:contain;background:#111;border-radius:8px}.meta{font-size:12px;margin-top:7px;display:flex;flex-direction:column;gap:5px}.row{display:flex;gap:5px;align-items:center;flex-wrap:wrap}.pill{padding:3px 7px;border-radius:999px;background:#f3f4f6;font-size:11px}.good{background:#ecfdf5}.warn{background:#fff7ed}.bad{background:#fff1f2}.stateBtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-top:6px}.stateBtns button{padding:6px 4px;font-size:12px}.speciesSelect{width:100%;padding:6px;border:1px solid #d1d5db;border-radius:7px}.banner{display:none;padding:10px 12px;border-radius:9px;background:#eef2ff;margin:10px 0;white-space:pre-wrap}.empty{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:80px 20px;text-align:center;color:#6b7280}.footer{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:14px 0}.muted{color:#6b7280;font-size:13px}.bulkSpecies{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding-left:8px;border-left:1px solid #e5e7eb}.pickLabel{display:flex;gap:5px;align-items:center;font-size:12px;font-weight:650}.pickLabel input{width:16px;height:16px}@media(max-width:1200px){.grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}header{flex-wrap:wrap}}
  </style>
</head>
<body>
<header class="app-nav"><a href="/">总览</a><a href="/batches">数据批次</a><a href="/review/bulk">快速审核</a><a href="/review">单张审核</a><a href="/species">鱼种管理</a><a href="/datasets">数据集</a></header>
<style id="yujian-mobile-ux">
  html{overflow-x:hidden}
  body{min-width:0}
  main{min-width:0;width:100%;box-sizing:border-box}
  header.app-nav{box-sizing:border-box}
  header.app-nav{overflow:visible!important;white-space:normal!important;flex-wrap:wrap!important;align-items:center!important}
  header.app-nav .nav-toggle{display:none;border:0;background:transparent;color:#111827;font:inherit;font-weight:750;cursor:pointer;align-items:center;gap:8px;padding:0;min-height:44px}
  header.app-nav .nav-toggle:focus-visible{outline:2px solid #2563eb;outline-offset:2px}
  header.app-nav .nav-icon{font-size:22px;line-height:1}
  header.app-nav .nav-links{display:flex;align-items:center;gap:6px;flex:1 1 auto;min-width:0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin}
  header.app-nav .nav-links a{flex:0 0 auto}
  header.app-nav .filters{flex:0 0 auto}
  img{max-width:100%}
  input,select,textarea{max-width:100%}
  @media(max-width:768px){
    header.app-nav{padding:8px 16px!important;gap:0!important;overflow:visible!important}
    header.app-nav .nav-toggle{display:flex;order:0}
    header.app-nav .nav-links{display:none;order:2;flex-basis:100%;width:100%;flex-direction:column;align-items:stretch;gap:4px;padding:8px 0 4px;overflow:visible}
    header.app-nav .nav-links.open{display:flex}
    header.app-nav .nav-links a{width:100%;min-height:44px;padding:0 12px;justify-content:flex-start}
    header.app-nav .filters{order:3;width:100%;margin:8px 0 0!important;display:grid!important;grid-template-columns:1fr;gap:8px;align-items:stretch}
    header.app-nav .filters>*{width:100%!important;min-height:44px;box-sizing:border-box}
    main{max-width:100%!important;padding:12px 16px!important}
    h1{font-size:26px;line-height:1.2}
    h2{font-size:20px;line-height:1.3}
    .top{align-items:stretch!important;flex-direction:column}
    .section,.panel,.card{max-width:100%;box-sizing:border-box}
    .section{padding:14px!important}
    .actions{display:flex;flex-direction:column;align-items:stretch;gap:8px}
    .actions>*{width:100%;box-sizing:border-box}
    .actions>button,.actions>.button,.primary,.prepare,.top>button,main>button,.uploadBox button,.skip,.footer button{width:100%;min-height:44px;box-sizing:border-box}
    .footer{display:flex;flex-direction:column;align-items:stretch;gap:8px}
    .footer>*{width:100%;text-align:center;box-sizing:border-box}
    .summary{display:grid!important;grid-template-columns:1fr 1fr!important;gap:8px!important}
    .summary .pill{min-height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
    .cards{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important}
    .workflow{grid-template-columns:1fr!important}
    .grid{grid-template-columns:1fr!important}
    .metrics,.metricGrid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important}
    .metric{min-width:0;padding:10px!important}
    .row{grid-template-columns:1fr!important;gap:6px!important}
    main input:not([type="checkbox"]):not([type="radio"]),main select,main textarea{width:100%;min-height:44px;box-sizing:border-box}
    input[type="file"]{min-height:44px}
    .toolbar{display:grid!important;grid-template-columns:1fr!important;gap:8px!important;align-items:stretch}
    .toolbar>*{width:100%;min-height:44px;box-sizing:border-box}
    .toolbar .spacer{display:none}
    .filters{display:grid;grid-template-columns:1fr;gap:8px}
    .filters>*{width:100%;min-height:44px;box-sizing:border-box}
    .stateBtns{grid-template-columns:1fr!important;gap:8px!important}
    .stateBtns button{min-height:44px!important}
    .speciesTabs{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px!important}
    .speciesTabs button{min-height:44px}
    .bulkSpecies{display:flex;flex-direction:column;align-items:stretch;padding:8px 0 0;border-left:0;border-top:1px solid #e5e7eb}
    .bulkSpecies>*{width:100%;min-height:44px;box-sizing:border-box}
    .tabs{display:grid!important;grid-template-columns:1fr 1fr;gap:8px!important}
    .tabs .tab{min-height:44px}
    .photo{height:auto!important;max-height:58vh;min-height:220px}
    .previewBox{min-height:200px}
    .heroPrediction b{font-size:26px}
    .topRow{grid-template-columns:minmax(70px,1fr) minmax(0,2fr) 60px}
    .top3mini{white-space:normal;max-width:none;overflow:visible}
    .tableWrap{overflow:visible!important;border:0!important}
    table[data-card-labels]{display:block;width:100%;min-width:0!important;border-collapse:separate;border-spacing:0}
    table[data-card-labels] thead{display:none}
    table[data-card-labels] tbody,table[data-card-labels] tr,table[data-card-labels] td{display:block;width:100%;box-sizing:border-box}
    table[data-card-labels] tr{margin:0 0 12px;padding:6px 10px;border:1px solid #e5e7eb;border-radius:12px;background:#fff;box-shadow:0 1px 2px rgba(15,23,42,.04)}
    table[data-card-labels] tr:last-child{margin-bottom:0}
    table[data-card-labels] td{display:grid;grid-template-columns:minmax(80px,34%) minmax(0,1fr);gap:8px;align-items:start;border:0!important;padding:8px 0!important;min-width:0!important;font-size:13px;line-height:1.45;overflow-wrap:anywhere}
    table[data-card-labels] td::before{content:attr(data-label);color:#6b7280;font-size:12px;font-weight:650;line-height:1.4}
    table[data-card-labels] td[colspan]{display:block;text-align:center}
    table[data-card-labels] td[colspan]::before{display:none}
    table[data-card-labels] td>input,table[data-card-labels] td>select,table[data-card-labels] td>textarea{width:100%!important;min-height:44px;box-sizing:border-box}
    table[data-card-labels] td .actions{display:flex;flex-direction:column;align-items:stretch;gap:8px}
    table[data-card-labels] td .actions>*{width:100%;min-height:44px;box-sizing:border-box}
    table[data-card-labels] td .audit,table[data-card-labels] td .presence,table[data-card-labels] td .dedupe{display:flex;flex-direction:column;align-items:stretch;gap:6px;min-width:0}
    table[data-card-labels] td .pill{display:flex;align-items:center;min-height:32px;box-sizing:border-box}
    table[data-card-labels] td .numBtn{font-size:inherit;text-align:left;padding:0;min-height:32px}
    table[data-card-labels] td .reviewLink{display:block;padding:10px;border:1px solid #d1d5db;border-radius:8px;text-align:center}
    table[data-card-labels] td .uri{max-width:none}
    .matrixWrap,.diag{max-width:100%;overflow:auto!important}
  }
</style>
<script>
(function(){
  function decorateTables(){
    document.querySelectorAll('table[data-card-labels]').forEach(function(table){
      const labels=(table.dataset.cardLabels||'').split('|');
      table.querySelectorAll('tbody tr').forEach(function(row){
        Array.from(row.cells).forEach(function(cell,index){
          if(cell.colSpan>1){cell.removeAttribute('data-label');return}
          if(labels[index])cell.setAttribute('data-label',labels[index]);
        });
      });
    });
  }
  function initNav(){
    const header=document.querySelector('header.app-nav');
    if(!header)return;
    if(!header.dataset.mobileReady){
      const links=Array.from(header.children).filter(function(el){return el.tagName==='A'});
      const controls=Array.from(header.children).filter(function(el){return el.tagName!=='A'});
      const nav=document.createElement('nav');
      nav.className='nav-links';
      nav.id='yujian-primary-nav';
      nav.setAttribute('aria-label','主导航');
      links.forEach(function(link){nav.appendChild(link)});
      const toggle=document.createElement('button');
      toggle.type='button';
      toggle.className='nav-toggle';
      toggle.setAttribute('aria-expanded','false');
      toggle.setAttribute('aria-controls',nav.id);
      toggle.innerHTML='<span class="nav-icon" aria-hidden="true">☰</span><span>渔见 AI Console</span>';
      header.insertBefore(toggle,header.firstChild);
      header.insertBefore(nav,controls[0]||null);
      toggle.addEventListener('click',function(){
        const open=nav.classList.toggle('open');
        toggle.setAttribute('aria-expanded',String(open));
      });
      nav.addEventListener('click',function(event){
        if(event.target.closest('a')){
          nav.classList.remove('open');
          toggle.setAttribute('aria-expanded','false');
        }
      });
      document.addEventListener('click',function(event){
        if(!header.contains(event.target)){
          nav.classList.remove('open');
          toggle.setAttribute('aria-expanded','false');
        }
      });
      header.dataset.mobileReady='true';
    }
    decorateTables();
    if(!window.__yujianMobileObserver){
      const observer=new MutationObserver(decorateTables);
      observer.observe(document.body,{childList:true,subtree:true});
      window.__yujianMobileObserver=observer;
    }
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',initNav,{once:true});else initNav();
})();
</script>
<main>
  <div class="bar"><div><h1 style="margin:0">快速审核</h1><div class="muted">按审核分组连续看图：优先真实鱼种，未确认时仅用采集标注分组；采集标注不会自动成为 Ground Truth。</div></div></div>
  <div id="banner" class="banner"></div>
  <div class="toolbar">
    <select id="batch"><option value="">选择批次</option></select>
    <select id="presence"><option value="">全部鱼体结果</option><option value="single_fish">单鱼</option><option value="multi_fish">多鱼</option><option value="no_fish">无鱼</option><option value="uncertain">不确定</option><option value="not_scanned">未检测</option></select>
    <span id="counter" class="muted"></span>
    <div class="bulkSpecies">
      <label class="pickLabel"><input id="selectAll" type="checkbox" onchange="toggleSelectAll(this.checked)">全选本页</label>
      <select id="bulkSpecies"><option value="">批量设置真实鱼种</option></select>
      <button class="soft" onclick="applyBulkSpecies()">应用鱼种到选中</button>
      <span id="selectedCount" class="muted">已选 0 张</span>
    </div>
    <div class="spacer"></div>
    <button class="soft" onclick="markAll('approved')">本页全部通过</button>
    <button class="danger" onclick="markAll('rejected')">本页全部不通过</button>
    <button class="soft" onclick="markAll('pending')">本页全部待定</button>
    <button class="primary" onclick="submitPage()">提交本页</button>
  </div>
  <div id="speciesTabs" class="speciesTabs"></div>
  <div id="content"></div>
  <div class="footer"><button onclick="prevPage()">← 上一页</button><span id="pageInfo" class="muted"></span><button onclick="nextPage()">下一页 →</button></div>
</main>
<script>
let batches=[],catalog=[],speciesRows=[],currentSpecies='',items=[],offset=0,limit=24,total=0;
function esc(v){return (v??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function api(url,opts){const r=await fetch(url,opts);const t=await r.text();let d;try{d=JSON.parse(t)}catch{d=t}if(!r.ok)throw new Error(d.detail||t);return d}
function msg(text,err=false){const b=document.getElementById('banner');b.style.display='block';b.style.background=err?'#fff1f2':'#eef2ff';b.textContent=text}
function sourceName(v){return ({pilot:'种子集',doubao:'豆包',app_feedback:'用户反馈',workbuddy:'WorkBuddy',other:'其他'})[v]||v||'-'}
function presenceName(v){return ({single_fish:'单鱼',multi_fish:'多鱼',no_fish:'无鱼',uncertain:'不确定',error:'检测失败',not_scanned:'未检测'})[v]||'未检测'}
function presenceClass(v){if(v==='single_fish')return 'good';if(v==='multi_fish'||v==='uncertain')return 'warn';if(v==='no_fish')return 'bad';return ''}
function speciesOptions(selected){const current=catalog.find(x=>x.common_name_zh===selected);const historical=current?.status==='retired'?`<option value="${esc(selected)}" selected>${esc(selected)} · 已停用（历史保留）</option>`:'';return `<option value="" ${!selected?'selected':''}>未确认真实鱼种</option>`+historical+catalog.filter(x=>x.status!=='retired').map(x=>`<option value="${esc(x.common_name_zh)}" ${x.common_name_zh===selected?'selected':''}>${esc(x.common_name_zh)}</option>`).join('')}
async function init(){
  [batches,catalog]=await Promise.all([api('/api/batches'),api('/api/species')]);
  document.getElementById('batch').innerHTML+=[...batches].map(x=>`<option value="${esc(x.batch_id)}">${esc(x.batch_id)} · ${esc(sourceName(x.source))}</option>`).join('');
  document.getElementById('bulkSpecies').innerHTML='<option value="">批量设置真实鱼种</option>'+catalog.filter(x=>x.status!=='retired').map(x=>`<option value="${esc(x.common_name_zh)}">${esc(x.common_name_zh)}</option>`).join('');
  const u=new URLSearchParams(location.search);if(u.get('batch'))document.getElementById('batch').value=u.get('batch');
  document.getElementById('batch').addEventListener('change',()=>{offset=0;loadSpecies().catch(e=>msg(e.message,true))});
  document.getElementById('presence').addEventListener('change',()=>{offset=0;loadImages().catch(e=>msg(e.message,true))});
  if(document.getElementById('batch').value)await loadSpecies();
}
async function loadSpecies(){const batch=document.getElementById('batch').value;if(!batch){document.getElementById('content').innerHTML='<div class="empty">先选择一个批次。</div>';return}speciesRows=await api(`/api/bulk-review/species?batch_id=${encodeURIComponent(batch)}&status=pending`);if(!speciesRows.length){currentSpecies='';renderTabs();document.getElementById('content').innerHTML='<div class="empty">这个批次已经没有待审核图片。</div>';return}if(!speciesRows.some(x=>x.species===currentSpecies))currentSpecies=speciesRows[0].species;offset=0;renderTabs();await loadImages()}
function renderTabs(){document.getElementById('speciesTabs').innerHTML=speciesRows.map(x=>`<button class="${x.species===currentSpecies?'active':''}" onclick="chooseSpecies('${esc(x.species)}')">${esc(x.species)} · ${x.count}</button>`).join('')}
function chooseSpecies(name){currentSpecies=name;offset=0;renderTabs();loadImages().catch(e=>msg(e.message,true))}
async function loadImages(){const batch=document.getElementById('batch').value;if(!batch||!currentSpecies)return;const p=new URLSearchParams({batch_id:batch,species:currentSpecies,status:'pending',limit:String(limit),offset:String(offset)});const presence=document.getElementById('presence').value;if(presence)p.set('presence',presence);const d=await api('/api/bulk-review/images?'+p);items=d.items||[];total=d.total||0;document.getElementById('counter').textContent=`${currentSpecies} · 待处理 ${total}`;render();updatePageInfo()}
function render(){const c=document.getElementById('content');document.getElementById('selectAll').checked=false;if(!items.length){c.innerHTML='<div class="empty">当前筛选下没有图片。可以切换鱼体结果或下一个鱼种。</div>';updateSelectedCount();return}c.innerHTML=`<div class="grid">${items.map((x,i)=>{const initial=(x.review_status==='approved'?'approved':x.review_status==='rejected'?'rejected':'pending');const dup=x.duplicate?.is_duplicate?`<span class="pill warn">近重复${x.duplicate.kind==='exact'?'·完全':'·相似'}</span>`:'';return `<div class="card" id="card-${i}" data-state="${initial}"><img class="photo" loading="lazy" src="${x.media_url}"><div class="meta"><div class="row"><label class="pickLabel"><input class="itemPick" id="pick-${i}" type="checkbox" onchange="updateSelectedCount()">选择</label><b>${esc(x.image_id)}</b></div><div class="row"><span class="pill ${presenceClass(x.presence?.status)}">${presenceName(x.presence?.status)}${(x.presence?.fish_count||0)>0?' · '+x.presence.fish_count+'条':''}</span>${dup}</div><div class="muted">采集：${esc(x.claimed_species||'-')}</div><select class="speciesSelect" id="species-${i}">${speciesOptions(x.truth_species||'')}</select><div class="stateBtns"><button onclick="setState(${i},'approved')">通过</button><button onclick="setState(${i},'rejected')">不通过</button><button onclick="setState(${i},'pending')">待定</button></div></div></div>`}).join('')}</div>`;items.forEach((x,i)=>{x._state=x.review_status||'pending'});updateSelectedCount()}
function setState(i,state){items[i]._state=state;document.getElementById('card-'+i).dataset.state=state}
function markAll(state){items.forEach((_,i)=>setState(i,state))}
function selectedIndexes(){const result=[];items.forEach((_,i)=>{const el=document.getElementById('pick-'+i);if(el?.checked)result.push(i)});return result}
function updateSelectedCount(){const selected=selectedIndexes();document.getElementById('selectedCount').textContent=`已选 ${selected.length} 张`;const all=document.getElementById('selectAll');if(all)all.checked=items.length>0&&selected.length===items.length}
function toggleSelectAll(checked){items.forEach((_,i)=>{const el=document.getElementById('pick-'+i);if(el)el.checked=checked});updateSelectedCount()}
function applyBulkSpecies(){const species=document.getElementById('bulkSpecies').value;if(!species){msg('请先选择要批量设置的真实鱼种',true);return}const selected=selectedIndexes();if(!selected.length){msg('请先勾选要设置鱼种的图片',true);return}selected.forEach(i=>{document.getElementById('species-'+i).value=species});msg(`已将 ${selected.length} 张图片的真实鱼种设置为“${species}”。审核状态未改变，点击“提交本页”后保存。`)}
async function submitPage(){if(!items.length)return;for(let i=0;i<items.length;i++){if(items[i]._state==='approved'&&!document.getElementById('species-'+i).value){msg(`${items[i].image_id} 通过前必须确认真实鱼种`,true);return}}const batch=document.getElementById('batch').value;const payload={batch_id:batch,items:items.map((x,i)=>({image_id:x.image_id,review_status:x._state||'pending',truth_species:document.getElementById('species-'+i).value,notes:x.notes||''}))};try{const d=await api('/api/bulk-review/apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});msg(`已提交 ${d.updated} 张。正在继续当前鱼种…`);offset=0;await loadSpecies();if(speciesRows.length&&currentSpecies)await loadImages()}catch(e){msg(e.message,true)}}
function updatePageInfo(){const from=total?offset+1:0;const to=Math.min(total,offset+limit);document.getElementById('pageInfo').textContent=`${from}-${to} / ${total}`}
function nextPage(){if(offset+limit<total){offset+=limit;loadImages().catch(e=>msg(e.message,true));return}const idx=speciesRows.findIndex(x=>x.species===currentSpecies);if(idx>=0&&idx+1<speciesRows.length){currentSpecies=speciesRows[idx+1].species;offset=0;renderTabs();loadImages().catch(e=>msg(e.message,true))}}
function prevPage(){if(offset>=limit){offset-=limit;loadImages().catch(e=>msg(e.message,true))}}
init().catch(e=>msg(e.message,true));
</script>
</body>
</html>
