<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Batches · YuJian AI</title>
  <style>
    body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f6f7f8;color:#171717}
    header{background:#fff;border-bottom:1px solid #e5e7eb;padding:14px 24px;display:flex;gap:22px;align-items:center;position:sticky;top:0;z-index:3}header a{text-decoration:none;color:#111827;font-weight:650}
    main{max-width:1220px;margin:0 auto;padding:24px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-end}.muted{color:#6b7280}.section{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px;margin-top:18px}
    table{width:100%;border-collapse:collapse}th,td{padding:10px 8px;border-bottom:1px solid #eee;text-align:left;font-size:13px;vertical-align:top}th{color:#6b7280}
    input,select,button{font:inherit;border:1px solid #d1d5db;border-radius:8px;padding:8px;background:white}input{width:220px}button{cursor:pointer;font-weight:650}.primary{background:#111827;color:white}.danger{background:#fff1f2}.soft{background:#f3f4f6}
    .pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#f3f4f6;font-size:12px}.ok{background:#ecfdf5}.warn{background:#fff7ed}.bad{background:#fff1f2}
    .actions{display:flex;gap:6px;flex-wrap:wrap}.audit{display:flex;gap:5px;flex-wrap:wrap}.banner{display:none;margin-top:16px;padding:12px 14px;border-radius:10px;background:#eef2ff;white-space:pre-wrap}.spinner{opacity:.6;pointer-events:none}
    @media(max-width:900px){.section{overflow:auto}input{width:170px}}
  </style>
</head>
<body>
<header><a href="/">Overview</a><a href="/batches">Batches</a><a href="/review">Review</a><a href="/datasets">Dataset</a></header>
<main>
  <div class="top"><div><h1>数据批次</h1><div class="muted">Incoming → Audit → Promote → Registry，全程页面操作。</div></div><button onclick="loadAll()">刷新</button></div>
  <div id="banner" class="banner"></div>

  <div class="section">
    <h2>Incoming</h2>
    <div class="muted">Canonical Batch ID 可以与 incoming 文件夹名不同。豆包当前会自动读取已有 audit 映射。</div>
    <table><thead><tr><th>Incoming</th><th>图片 / Manifest</th><th>自动审计</th><th>正式 Batch</th><th>Source</th><th>状态</th><th>操作</th></tr></thead><tbody id="incoming"></tbody></table>
  </div>

  <div class="section">
    <h2>Registry</h2>
    <table><thead><tr><th>Batch</th><th>来源</th><th>图片</th><th>Approved</th><th>Pending</th><th>Needs Review</th><th>Rejected</th><th>状态</th></tr></thead><tbody id="registered"></tbody></table>
  </div>
</main>
<script>
function esc(v){return (v??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function msg(text,isError=false){const b=document.getElementById('banner');b.style.display='block';b.style.background=isError?'#fff1f2':'#eef2ff';b.textContent=text;}
function setBusy(on){document.body.classList.toggle('spinner',on)}
async function api(url,opts){const r=await fetch(url,opts);const text=await r.text();let data;try{data=JSON.parse(text)}catch{data=text}if(!r.ok)throw new Error(data.detail||text||r.statusText);return data}
async function loadAll(){
  try{
    const [incoming,registered]=await Promise.all([api('/api/incoming'),api('/api/batches')]);
    const body=document.getElementById('incoming');
    body.innerHTML=incoming.map((x,i)=>{
      const a=x.audit||{};const s=a.status_counts||{};
      return `<tr><td><b>${esc(x.folder)}</b><br><span class="muted">${esc(x.incoming_prefix)}</span></td>
      <td>${x.image_count} / ${x.manifest_count}</td>
      <td>${a.batch_id?`<div class="audit"><span class="pill ok">C ${s.CANDIDATE||0}</span><span class="pill warn">N ${s.NEEDS_REVIEW||0}</span><span class="pill bad">R ${s.AUTO_REJECT||0}</span></div>`:'<span class="muted">未运行</span>'}</td>
      <td><input id="batch-${i}" value="${esc(x.canonical_batch_id)}"></td>
      <td><select id="source-${i}"><option value="">选择</option><option value="pilot" ${x.source==='pilot'?'selected':''}>pilot</option><option value="doubao" ${x.source==='doubao'?'selected':''}>doubao</option><option value="workbuddy" ${x.source==='workbuddy'?'selected':''}>workbuddy</option><option value="other" ${x.source==='other'?'selected':''}>other</option></select></td>
      <td>${x.promoted?'<span class="pill ok">Promoted</span>':'<span class="pill">Incoming</span>'}</td>
      <td><div class="actions"><button class="soft" onclick="act(${i},'audit','${esc(x.incoming_prefix)}')">运行检查</button><button class="primary" onclick="act(${i},'promote','${esc(x.incoming_prefix)}')">正式入库</button><button onclick="sync(${i})">同步 Registry</button></div></td></tr>`
    }).join('')||'<tr><td colspan="7" class="muted">没有发现 incoming batch</td></tr>';

    document.getElementById('registered').innerHTML=registered.map(x=>`<tr><td><b>${esc(x.batch_id)}</b></td><td>${esc(x.source)}</td><td>${x.image_count}</td><td>${x.review.approved||0}</td><td>${x.review.pending||0}</td><td>${x.review.needs_review||0}</td><td>${x.review.rejected||0}</td><td><span class="pill">${esc(x.status)}</span></td></tr>`).join('')||'<tr><td colspan="8" class="muted">Registry 还是空的</td></tr>';
  }catch(e){msg(e.message,true)}
}
async function act(i,action,prefix){
  const batch=document.getElementById('batch-'+i).value.trim();const source=document.getElementById('source-'+i).value;
  if(!batch||!source){msg('请先确认正式 Batch ID 和 Source',true);return}
  setBusy(true);msg(`${action==='audit'?'正在审计':'正在 Promote'} ${batch} …`);
  try{const d=await api(`/api/batches/${action}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({incoming_prefix:prefix,batch_id:batch,source})});msg(JSON.stringify(d,null,2));await loadAll()}catch(e){msg(e.message,true)}finally{setBusy(false)}
}
async function sync(i){
  const batch=document.getElementById('batch-'+i).value.trim();if(!batch){msg('请先确认 Batch ID',true);return}
  setBusy(true);msg(`正在同步 ${batch} 到 Registry …`);
  try{const d=await api('/api/batches/sync',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({batch_id:batch})});msg(JSON.stringify(d,null,2));await loadAll()}catch(e){msg(e.message,true)}finally{setBusy(false)}
}
loadAll();
</script>
</body>
</html>
