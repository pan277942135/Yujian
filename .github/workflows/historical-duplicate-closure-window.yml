name: Historical Duplicate Cleanup Closure Window

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: historical-duplicate-closure-window
  cancel-in-progress: false

env:
  PROJECT_ID: gemini-api-project-503706
  GCS_BUCKET: yujian-model-factory-571785698442
  REGION: asia-east1
  SERVICE: yujian-model-factory-console
  WIF_PROVIDER: projects/571785698442/locations/global/workloadIdentityPools/github-actions/providers/yujian-main
  DEPLOY_SERVICE_ACCOUNT: yujian-github-deployer@gemini-api-project-503706.iam.gserviceaccount.com

jobs:
  post-fence-proof:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Enforce main-only execution
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"

      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Authenticate to Google Cloud with existing WIF
        uses: google-github-actions/auth@v3.0.0
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3.0.1
        with:
          project_id: ${{ env.PROJECT_ID }}
          version: '>= 416.0.0'

      - name: Verify post-fence quiescence
        id: quiescence
        env:
          EXPECTED_APP_GIT_COMMITS: "d71212814dad499b2a6ff336b2d4d932cd699342,${{ github.sha }}"
          OUTPUT_DIR: ${{ runner.temp }}/post-fence
          GCS_OUTPUT_ROOT: gs://${{ env.GCS_BUCKET }}/operator-audits/historical_exact_duplicate_cleanup_v1/post-fence-${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/post_fence_quiescence_probe.sh

      - name: Verify protected mutation paths return HTTP 423
        if: ${{ steps.quiescence.outcome == 'success' }}
        env:
          SERVICE_URL: ${{ steps.quiescence.outputs.service_url }}
          COOKIE_JAR: ${{ runner.temp }}/post-fence/console.cookies
        shell: bash
        run: |
          set -euo pipefail
          CONSOLE_KEY="$(gcloud secrets versions access latest --secret=yujian-console-access-key --project="$PROJECT_ID")"
          test -n "$CONSOLE_KEY"
          echo "::add-mask::$CONSOLE_KEY"
          LOGIN_STATUS="$(curl --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 30 -sS -o /dev/null -w '%{http_code}' -c "$COOKIE_JAR" -X POST "$SERVICE_URL/login" --data-urlencode "access_key=$CONSOLE_KEY")"
          unset CONSOLE_KEY
          test "$LOGIN_STATUS" = "303"

          probe() {
            local label="$1"
            local method="$2"
            local path="$3"
            local payload="$4"
            local body="$RUNNER_TEMP/post-fence/${label}.json"
            local status
            status="$(curl --retry 2 --retry-all-errors --retry-delay 1 --connect-timeout 10 --max-time 30 -sS               -o "$body" -w '%{http_code}' -b "$COOKIE_JAR" -H 'Content-Type: application/json'               -X "$method" --data "$payload" "$SERVICE_URL$path")"
            python3 - "$body" "$status" "$label" <<'PY'
          import json
          import sys
          body = json.loads(open(sys.argv[1], encoding="utf-8").read())
          status = int(sys.argv[2])
          label = sys.argv[3]
          assert status == 423, (label, status, body)
          assert body == {
              "code": "HISTORICAL_DUPLICATE_CLOSURE_IN_PROGRESS",
              "message": "Historical duplicate cleanup maintenance window is active.",
          }, (label, body)
          print(f"{label}=PASS")
          PY
          }

          probe review  POST  /api/bulk-review/apply             '{"batch_id":"BATCH_FENCE_PROBE","items":[{"image_id":"IMAGE_FENCE_PROBE","review_status":"pending"}]}'
          probe truth   PATCH /api/review/BATCH_FENCE_PROBE/IMAGE_FENCE_PROBE             '{"review_status":"pending"}'
          probe ingest  POST  /api/batches/upload-finalize             '{"batch_id":"BATCH_FENCE_PROBE","source":"fence-probe"}'

          curl --retry 2 --retry-all-errors --retry-delay 1 --connect-timeout 10 --max-time 30 -fsS             "$SERVICE_URL/health" > "$RUNNER_TEMP/post-fence/health.json"
          python3 - "$RUNNER_TEMP/post-fence/health.json" <<'PY'
          import json
          import sys
          payload = json.loads(open(sys.argv[1], encoding="utf-8").read())
          assert payload.get("status") == "ok", payload
          print("READ_ONLY_HEALTH=PASS")
          PY

      - name: Upload post-fence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-duplicate-post-fence-quiescence-${{ github.run_id }}
          path: ${{ runner.temp }}/post-fence
          if-no-files-found: warn

      - name: Publish post-fence summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "Historical Duplicate Cleanup - Post-Fence Quiescence"
            echo "Fence: ACTIVE"
            echo "Pre-fence versus post-fence comparison: NOT USED"
            echo "Required samples: T0, T+60, T+120"
            echo "Business apply: NO"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -f "$RUNNER_TEMP/post-fence/t0.json" ]]; then
            python3 - "$RUNNER_TEMP/post-fence" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import pathlib
          import sys
          root = pathlib.Path(sys.argv[1])
          for name in ("t0", "t60", "t120"):
              payload = json.loads((root / (name + ".json")).read_text(encoding="utf-8"))
              print("- " + name + ": count=" + str(payload.get("image_asset_count")) + ", updated_at=" + str(payload.get("latest_updated_at")) + ", fingerprint=" + str(payload.get("truth_fingerprint")))
          PY
          fi
