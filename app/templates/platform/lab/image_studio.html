{% extends "platform/base.html" %}

{% block head %}
<style>
  .studio-page{max-width:860px;margin:0 auto;display:grid;gap:18px;padding:8px 0 28px}
  .studio-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
  .studio-head h1{margin:0;font-size:24px;color:#234c40}
  .studio-sub{margin:5px 0 0;color:var(--muted);font-size:13px;line-height:1.55}
  .studio-task-link{white-space:nowrap;border:1px solid #d6e4de;border-radius:10px;padding:8px 11px;color:#28584a;text-decoration:none;font-size:12px;font-weight:750;background:#fff}
  .studio-composer{border:1px solid #d6e3de;border-radius:18px;background:#fff;box-shadow:0 10px 28px rgba(39,79,66,.07);overflow:hidden}
  .studio-attachments{display:flex;gap:10px;overflow-x:auto;padding:14px 14px 4px}
  .studio-attachments:empty{display:none}
  .studio-thumb{position:relative;flex:0 0 112px}
  .studio-thumb img{display:block;width:112px;height:112px;object-fit:cover;border-radius:12px;background:#eef3f1;border:1px solid #d7e3de}
  .studio-thumb .studio-index{position:absolute;left:7px;top:7px;border-radius:999px;background:rgba(22,48,40,.78);color:#fff;font-size:10px;font-weight:800;padding:3px 6px}
  .studio-thumb button{position:absolute;right:6px;top:6px;border:0;border-radius:999px;width:24px;height:24px;background:rgba(255,255,255,.92);color:#5e6c67;cursor:pointer;font-size:16px;line-height:22px;padding:0}
  .studio-input{width:100%;box-sizing:border-box;border:0;outline:0;resize:none;min-height:132px;padding:16px 18px 8px;font:inherit;font-size:15px;line-height:1.6;color:#233f37;background:transparent}
  .studio-input::placeholder{color:#8b9b95}
  .studio-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px 12px}
  .studio-tools{display:flex;align-items:center;gap:8px}
  .studio-attach,.studio-generate{display:inline-flex;align-items:center;justify-content:center;border-radius:11px;font:inherit;font-weight:800;cursor:pointer}
  .studio-attach{width:38px;height:38px;border:1px solid #d5e2dc;background:#f8fbfa;color:#28584a;font-size:22px}
  .studio-generate{border:0;background:#245f50;color:#fff;padding:10px 17px;min-width:82px}
  .studio-generate:disabled{opacity:.42;cursor:not-allowed}
  .studio-hint{font-size:11px;color:var(--muted)}
  .studio-state{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-radius:12px;background:#f7faf9;padding:10px 12px;color:#557069;font-size:12px}
  .studio-state strong{color:#31584c}
  .studio-status{white-space:pre-wrap}
  .studio-queue{white-space:nowrap}
  .studio-hidden{display:none!important}
  @media(max-width:640px){
    .studio-page{padding-top:0}
    .studio-head{align-items:center}
    .studio-head h1{font-size:21px}
    .studio-sub{font-size:12px}
    .studio-thumb,.studio-thumb img{width:92px;height:92px;flex-basis:92px}
    .studio-input{min-height:118px}
  }
</style>
{% endblock %}

{% block content %}
<div class="studio-page">
  <header class="studio-head">
    <div>
      <h1>图生图工作台</h1>
      <p class="studio-sub">上传图片，直接告诉 Qwen 你想怎么改。图片顺序就是“图1、图2、图3”。</p>
    </div>
    <a class="studio-task-link" href="/platform/image-studio/tasks">任务处理列表</a>
  </header>

  <section class="studio-composer">
    <div id="studioAttachments" class="studio-attachments"></div>
    <textarea
      id="studioPrompt"
      class="studio-input"
      placeholder="例如：把图2的人物替换到图1里，保持图1的姿势、衣服和背景不变。"
      maxlength="4000"
    ></textarea>

    <div class="studio-toolbar">
      <div class="studio-tools">
        <button id="studioAttach" class="studio-attach" type="button" title="添加图片">＋</button>
        <span id="studioHint" class="studio-hint">最多 3 张图片</span>
      </div>
      <button id="studioGenerate" class="studio-generate" type="button" disabled>生成</button>
    </div>
  </section>

  <input id="studioFiles" class="studio-hidden" type="file" accept="image/jpeg,image/png,image/webp" multiple>

  <div class="studio-state">
    <div id="studioStatus" class="studio-status"><strong>模型</strong> · 正在检查</div>
    <div id="studioQueue" class="studio-queue">队列 · —</div>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const fileInput = $("studioFiles");
  const attachments = $("studioAttachments");
  const promptInput = $("studioPrompt");
  const generateButton = $("studioGenerate");
  const status = $("studioStatus");
  const queueStatus = $("studioQueue");
  const hint = $("studioHint");

  let files = [];
  let objectUrls = [];
  let gpuReady = false;
  let gpuState = "CHECKING";
  let submitting = false;
  let currentRunId = null;
  let pollTimer = null;

  function clearObjectUrls() {
    objectUrls.forEach((url) => URL.revokeObjectURL(url));
    objectUrls = [];
  }

  function renderFiles() {
    clearObjectUrls();
    attachments.innerHTML = "";
    files.forEach((file, index) => {
      const url = URL.createObjectURL(file);
      objectUrls.push(url);
      const card = document.createElement("div");
      card.className = "studio-thumb";
      card.innerHTML =
        '<img alt="图' + (index + 1) + '">' +
        '<span class="studio-index">图' + (index + 1) + '</span>' +
        '<button type="button" aria-label="删除图' + (index + 1) + '">×</button>';
      card.querySelector("img").src = url;
      card.querySelector("button").addEventListener("click", () => {
        files.splice(index, 1);
        renderFiles();
        syncGenerateState();
      });
      attachments.appendChild(card);
    });
    hint.textContent = files.length
      ? files.length + "/3 · 第1张为主图，后续为参考图"
      : "最多 3 张图片";
  }

  function syncGenerateState() {
    generateButton.disabled = submitting || !gpuReady || files.length === 0 || !promptInput.value.trim();
  }

  function setQueue(queue) {
    if (!queue) return;
    const running = Number(queue.running || 0);
    const queued = Number(queue.queued || 0);
    queueStatus.textContent = (running || queued)
      ? "队列 · 生成中 " + running + " · 等待 " + queued
      : "队列 · 空闲";
  }

  async function refreshGpu() {
    try {
      const response = await fetch("/api/qwen-lab/gpu/status?studio_ts=" + Date.now(), {cache:"no-store"});
      const payload = await response.json();
      if (!response.ok) throw new Error(payload?.detail?.message || "状态读取失败");
      gpuState = String(payload.display_status || "ERROR").toUpperCase();
      gpuReady = (gpuState === "READY" || gpuState === "BUSY") && payload.model_loaded === true;
      if (gpuReady) {
        status.innerHTML = "<strong>模型</strong> · " + (gpuState === "BUSY" ? "运行中，可继续提交" : "已就绪");
      } else if (gpuState === "STOPPED") {
        status.innerHTML = "<strong>模型</strong> · GPU 未启动，点击生成会自动启动";
      } else if (gpuState === "STARTING" || gpuState === "LOADING") {
        status.innerHTML = "<strong>模型</strong> · 正在启动 / 加载";
      } else {
        status.innerHTML = "<strong>模型</strong> · 暂不可用";
      }
      syncGenerateState();
      return payload;
    } catch (error) {
      gpuReady = false;
      gpuState = "ERROR";
      status.innerHTML = "<strong>模型</strong> · " + error.message;
      syncGenerateState();
      return null;
    }
  }

  async function refreshQueue() {
    try {
      const response = await fetch("/api/image-studio/v1/queue?ts=" + Date.now(), {cache:"no-store"});
      if (!response.ok) return;
      setQueue(await response.json());
    } catch (_) {}
  }

  async function ensureGpuReady() {
    await refreshGpu();
    if (gpuReady) return true;
    if (gpuState !== "STOPPED") return false;

    status.innerHTML = "<strong>模型</strong> · 正在启动 GPU";
    try {
      const response = await fetch("/api/qwen-lab/gpu/start", {method:"POST"});
      if (!response.ok) return false;
    } catch (_) {
      return false;
    }

    for (let attempt = 0; attempt < 180; attempt += 1) {
      await new Promise((resolve) => window.setTimeout(resolve, 5000));
      await refreshGpu();
      if (gpuReady) return true;
      if (gpuState === "ERROR") return false;
    }
    return false;
  }

  async function submit() {
    if (!files.length || !promptInput.value.trim() || submitting) return;

    submitting = true;
    syncGenerateState();
    status.innerHTML = "<strong>任务</strong> · 准备提交";

    const ready = await ensureGpuReady();
    if (!ready) {
      status.innerHTML = "<strong>任务</strong> · Qwen 尚未就绪";
      submitting = false;
      syncGenerateState();
      return;
    }

    const form = new FormData();
    form.append("base_image", files[0]);
    files.slice(1).forEach((file) => form.append("references", file));
    form.append("prompt", promptInput.value.trim());
    form.append("mode", "NATURAL_EDIT");
    form.append("preservation", "NORMAL");
    form.append("reference_roles", "[]");
    form.append("steps", "25");
    form.append("resolution_mode", "target_long_edge");
    form.append("output_long_edge", "1024");
    form.append("clean_output", "true");

    status.innerHTML = "<strong>任务</strong> · 正在加入队列";
    try {
      const response = await fetch("/api/image-studio/v1/edit", {method:"POST", body:form});
      const payload = await response.json();
      if (!response.ok) {
        const detail = payload?.detail || payload || {};
        throw new Error(detail?.message || detail || "提交失败");
      }
      currentRunId = payload.run_id;
      setQueue(payload.queue);
      status.innerHTML = "<strong>" + payload.status + "</strong> · " +
        payload.run_id + (payload.queue_position ? " · 排队第 " + payload.queue_position + " 位" : "");
    } catch (error) {
      status.innerHTML = "<strong>FAILED</strong> · " + error.message;
    } finally {
      submitting = false;
      syncGenerateState();
    }
  }

  async function refreshCurrentRun() {
    if (!currentRunId) return;
    try {
      const response = await fetch(
        "/api/image-studio/v1/runs/" + encodeURIComponent(currentRunId) + "?ts=" + Date.now(),
        {cache:"no-store"}
      );
      if (!response.ok) return;
      const run = await response.json();
      setQueue(run.queue);
      if (run.status === "QUEUED") {
        status.innerHTML = "<strong>QUEUED</strong> · " + run.run_id +
          (run.queue_position ? " · 排队第 " + run.queue_position + " 位" : "");
      } else if (run.status === "RUNNING") {
        status.innerHTML = "<strong>RUNNING</strong> · Qwen 正在生成";
      } else if (run.status === "SUCCESS") {
        status.innerHTML = '<strong>SUCCESS</strong> · 已完成 · <a href="/platform/image-studio/tasks/' +
          encodeURIComponent(run.run_id) + '">查看结果</a>';
        currentRunId = null;
      } else if (run.status === "FAILED") {
        status.innerHTML = '<strong>FAILED</strong> · <a href="/platform/image-studio/tasks/' +
          encodeURIComponent(run.run_id) + '">查看原因</a>';
        currentRunId = null;
      }
    } catch (_) {}
  }

  $("studioAttach").addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", () => {
    const incoming = Array.from(fileInput.files || []);
    const room = Math.max(0, 3 - files.length);
    files.push(...incoming.slice(0, room));
    fileInput.value = "";
    renderFiles();
    syncGenerateState();
  });
  promptInput.addEventListener("input", syncGenerateState);
  generateButton.addEventListener("click", submit);

  refreshGpu();
  refreshQueue();
  pollTimer = window.setInterval(() => {
    refreshGpu();
    refreshQueue();
    refreshCurrentRun();
  }, 3000);

  window.addEventListener("beforeunload", () => {
    clearObjectUrls();
    if (pollTimer) window.clearInterval(pollTimer);
  });
})();
</script>
{% endblock %}
