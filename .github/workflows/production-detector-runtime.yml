name: Production Detector Runtime

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Detector Golden Cases
    types:
      - completed

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: gemini-api-project-503706
  WIF_PROVIDER: projects/571785698442/locations/global/workloadIdentityPools/github-actions/providers/yujian-main
  DEPLOY_SERVICE_ACCOUNT: yujian-github-deployer@gemini-api-project-503706.iam.gserviceaccount.com
  GCS_BUCKET: yujian-model-factory-571785698442
  DETECTOR_MODEL_VERSION: DET_FISH_v0.1

jobs:
  smoke-production-detector:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: google-github-actions/auth@v3.0.0
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
      - name: Install production detector runtime
        run: python -m pip install -r requirements.txt
      - name: Run GCS-backed YOLOX → quality-gate → crop parity smoke
        run: python scripts/smoke_production_detector_runtime.py
