name: Detector Bootstrap - DET_DS_v0.3

on:
  workflow_dispatch:
    inputs:
      start_gpu_training:
        description: "Explicitly deploy the reviewed v0.3 trainer and start one GPU execution"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: yujian-detector-v03-training
  cancel-in-progress: false

env:
  PROJECT_ID: gemini-api-project-503706
  WIF_PROVIDER: projects/571785698442/locations/global/workloadIdentityPools/github-actions/providers/yujian-main
  DEPLOY_SERVICE_ACCOUNT: yujian-github-deployer@gemini-api-project-503706.iam.gserviceaccount.com
  BUCKET: yujian-model-factory-571785698442
  DATASET_VERSION: DET_DS_v0.3
  MODEL_VERSION: DET_FISH_v0.3
  DATASET_REGION: asia-east1
  GPU_REGION: asia-southeast1

jobs:
  preflight-only:
    if: ${{ inputs.start_gpu_training != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact selected ref
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3.0.0
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3.0.1
        with:
          project_id: ${{ env.PROJECT_ID }}
          version: ">= 416.0.0"

      - name: Verify frozen v0.3 report, manifest, archive and split contract
        env:
          DETECTOR_DATASET_VERSION: ${{ env.DATASET_VERSION }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/det-ds-v03-preflight
          gcloud storage cp "gs://${BUCKET}/detector-datasets/${DATASET_VERSION}/bootstrap_report.json" /tmp/det-ds-v03-preflight/bootstrap_report.json
          gcloud storage cp "gs://${BUCKET}/detector-datasets/${DATASET_VERSION}/bootstrap_manifest.json" /tmp/det-ds-v03-preflight/bootstrap_manifest.json
          ARCHIVE_SHA="$(gcloud storage cat "gs://${BUCKET}/detector-datasets/${DATASET_VERSION}/${DATASET_VERSION}.tar.gz" | sha256sum | awk '{print $1}')"
          PYTHONPATH="$GITHUB_WORKSPACE" python - /tmp/det-ds-v03-preflight/bootstrap_report.json /tmp/det-ds-v03-preflight/bootstrap_manifest.json "$ARCHIVE_SHA" <<'PY'
          import json, sys
          from trainer.detector_dataset_gate import validate_v02_dataset
          report=json.load(open(sys.argv[1], encoding="utf-8"))
          manifest=open(sys.argv[2], "rb").read()
          result=validate_v02_dataset(report, manifest, sys.argv[3])
          if report.get("dataset_version") != "DET_DS_v0.3" or report.get("status") != "FROZEN_READY_FOR_TRAINING":
              raise SystemExit("BLOCKED: unexpected dataset version or freeze status")
          if not result.get("ready") or not result.get("counts_verified"):
              print(json.dumps(result, ensure_ascii=False, indent=2))
              raise SystemExit("BLOCKED: strict DET_DS_v0.3 gate failed")
          print("DET_DS_V03_PREFLIGHT_PASS")
          print(json.dumps({"counts":result["counts"],"negative_split_counts":result["negative_split_counts"],"manifest_sha256":report["manifest_sha256"],"archive_sha256":sys.argv[3]},ensure_ascii=False,indent=2))
          PY

  deploy-and-start:
    if: ${{ inputs.start_gpu_training == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact selected ref
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3.0.0
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3.0.1
        with:
          project_id: ${{ env.PROJECT_ID }}
          version: ">= 416.0.0"

      - name: Deploy exact v0.3 console and immutable trainer, then start GPU
        env:
          CONFIRM_START_GPU: "YES"
          PROJECT_ID: ${{ env.PROJECT_ID }}
          BUCKET: ${{ env.BUCKET }}
          DETECTOR_GPU_REGION: ${{ env.GPU_REGION }}
        run: bash scripts/deploy_and_start_det_fish_v03_training.sh
