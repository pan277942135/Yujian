name: Fish Completion Lab Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - feature/fish-completion-lab-v0.1

permissions:
  contents: read
  id-token: write

concurrency:
  group: yujian-fish-completion-lab
  cancel-in-progress: false

env:
  PROJECT_ID: gemini-api-project-503706
  REGION: asia-east1
  SERVICE: yujian-fish-completion-lab
  RUNTIME_SERVICE_ACCOUNT: yujian-model-factory@gemini-api-project-503706.iam.gserviceaccount.com
  WIF_PROVIDER: projects/571785698442/locations/global/workloadIdentityPools/github-actions/providers/yujian-main
  DEPLOY_SERVICE_ACCOUNT: yujian-github-deployer@gemini-api-project-503706.iam.gserviceaccount.com
  GCS_BUCKET: yujian-model-factory-571785698442
  SEGMENTATION_MODEL_TYPE: vit_b
  SEGMENTATION_CHECKPOINT_URI: gs://yujian-model-factory-571785698442/models/segmentation/sam_vit_b_01ec64.pth
  SEGMENTATION_DEMO_AUTH_DISABLED: "true"
  FISH_COMPLETION_ENABLED: "false"
  FISH_COMPLETION_WORKER_URL: ${{ secrets.FISH_COMPLETION_WORKER_URL }}
  FISH_COMPLETION_WORKER_TOKEN: ${{ secrets.FISH_COMPLETION_WORKER_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: uat
    steps:
      - name: Checkout exact lab commit
        uses: actions/checkout@v4
      - name: Authenticate to Google Cloud with GitHub OIDC/WIF
        uses: google-github-actions/auth@v3.0.0
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3.0.1
        with:
          project_id: ${{ env.PROJECT_ID }}
          version: ">= 416.0.0"
      - name: Deploy isolated Cloud Run lab
        id: deploy
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --source . --service-account "$RUNTIME_SERVICE_ACCOUNT" --set-env-vars="APP_GIT_COMMIT=${GIT_SHA},GCS_BUCKET=${GCS_BUCKET},SEGMENTATION_MODEL_TYPE=${SEGMENTATION_MODEL_TYPE},SEGMENTATION_CHECKPOINT_URI=${SEGMENTATION_CHECKPOINT_URI},SEGMENTATION_DEMO_AUTH_DISABLED=${SEGMENTATION_DEMO_AUTH_DISABLED},FISH_COMPLETION_ENABLED=${FISH_COMPLETION_ENABLED},FISH_COMPLETION_WORKER_URL=${FISH_COMPLETION_WORKER_URL},FISH_COMPLETION_WORKER_TOKEN=${FISH_COMPLETION_WORKER_TOKEN}" --cpu=4 --memory=8Gi --concurrency=1 --min-instances=0 --max-instances=1 --timeout=900 --allow-unauthenticated --format="value(status.url)" > service_url.txt
          SERVICE_URL="$(cat service_url.txt)"
          echo "service_url=${SERVICE_URL}" >> "$GITHUB_OUTPUT"
          REVISION="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format="value(status.latestReadyRevisionName)")"
          [[ -n "$REVISION" ]]
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
      - name: Verify lab routes
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.service_url }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          REVISION="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format="value(status.latestReadyRevisionName)")"
          [[ -n "$REVISION" ]]
          TRAFFIC="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format="value(status.traffic[0].percent)")"
          [[ "$TRAFFIC" == "100" ]]
          {
            echo "### Fish Completion Lab Deployment"
            echo "- Service: $SERVICE"
            echo "- URL: ${SERVICE_URL}/debug/fish-completion-lab"
            echo "- Revision: $REVISION"
            echo "- Commit: ${GIT_SHA}"
            echo "- Completion Worker: code-integrated; runtime URL not configured"
            echo "- Cloud Run readiness: **PASS**"
            echo "- HTTP page probe: skipped because IAM remains protected"
          } >> "$GITHUB_STEP_SUMMARY"
