name: Qwen GPU Control Audit

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  BACKEND_PROJECT_ID: gemini-api-project-503706
  BACKEND_REGION: asia-east1
  BACKEND_SERVICE: yujian-model-factory-console
  GPU_PROJECT_ID: gen-lang-client-0224022273
  GPU_ZONE: us-central1-a
  GPU_INSTANCE: fish-completion-worker
  WIF_PROVIDER: projects/571785698442/locations/global/workloadIdentityPools/github-actions/providers/yujian-main
  DEPLOY_SERVICE_ACCOUNT: yujian-github-deployer@gemini-api-project-503706.iam.gserviceaccount.com

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3.0.0
        with:
          project_id: ${{ env.BACKEND_PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3.0.1
        with:
          project_id: ${{ env.BACKEND_PROJECT_ID }}
          version: '>= 416.0.0'

      - name: Audit Cloud Run identity, VM access and systemd
        shell: bash
        run: |
          set -euo pipefail

          SERVICE_JSON="$(gcloud run services describe "$BACKEND_SERVICE"             --project "$BACKEND_PROJECT_ID"             --region "$BACKEND_REGION"             --format=json)"
          printf '%s' "$SERVICE_JSON" > /tmp/service.json

          RUNTIME_SA="$(python3 - <<'PY'
          import json
          with open("/tmp/service.json", encoding="utf-8") as handle:
              payload = json.load(handle)
          spec = ((payload.get("spec") or {}).get("template") or {}).get("spec") or {}
          print(spec.get("serviceAccountName") or spec.get("serviceAccount") or "")
          PY
          )"
          test -n "$RUNTIME_SA"
          echo "runtime_service_account=$RUNTIME_SA"
          echo "runtime_service_account=$RUNTIME_SA" >> "$GITHUB_STEP_SUMMARY"

          echo "vm_access_as_deployer:"
          gcloud compute instances describe "$GPU_INSTANCE"             --project "$GPU_PROJECT_ID"             --zone "$GPU_ZONE"             --format='yaml(name,status,lastStartTimestamp,lastStopTimestamp)'

          echo "runtime_permission_probe:"
          set +e
          PROBE_OUTPUT="$(gcloud projects test-iam-permissions "$GPU_PROJECT_ID"             --permissions=compute.instances.get,compute.instances.start,compute.instances.stop             --impersonate-service-account="$RUNTIME_SA" 2>&1)"
          PROBE_RC=$?
          set -e
          printf '%s\n' "$PROBE_OUTPUT"
          echo "runtime_permission_probe_exit=$PROBE_RC"
          if [[ "$PROBE_RC" -eq 0 ]]; then
            echo "runtime_permission_probe=$PROBE_OUTPUT" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "runtime_permission_probe_error=$PROBE_OUTPUT" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "systemd_probe:"
          set +e
          SSH_OUTPUT="$(gcloud compute ssh "$GPU_INSTANCE"             --project "$GPU_PROJECT_ID"             --zone "$GPU_ZONE"             --quiet             --command='systemctl is-enabled fish-qwen-refine-worker && systemctl is-active fish-qwen-refine-worker && systemctl --no-pager --full status fish-qwen-refine-worker | sed -n "1,20p"' 2>&1)"
          SSH_RC=$?
          set -e
          printf '%s\n' "$SSH_OUTPUT"
          echo "systemd_probe_exit=$SSH_RC"
          echo "systemd_probe=$SSH_OUTPUT" >> "$GITHUB_STEP_SUMMARY"
          test "$SSH_RC" -eq 0
