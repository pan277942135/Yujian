name: ci

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall app scripts
      - name: Validate deployment shell syntax
        run: bash -n scripts/deploy_console_gcp.sh
      - name: Import Model Factory Console
        env:
          REGISTRY_DB_URL: 'sqlite:///:memory:'
        run: python -c "from app.entry import app; from app.db import init_db; init_db(); p=app.openapi()['paths']; print(app.title, app.version); assert '/api/presence/scan' in p; assert '/api/dedupe/scan' in p; assert '/api/bulk-review/apply' in p; assert '/review/bulk' in p"
      - name: Run Console flywheel smoke test
        env:
          REGISTRY_DB_URL: 'sqlite:///:memory:'
        run: python scripts/smoke_console.py
      - name: Run P0 efficiency smoke test
        env:
          REGISTRY_DB_URL: 'sqlite:///:memory:'
        run: python scripts/smoke_efficiency.py
      - name: Validate project config exists
        run: test -f config/project.yaml
      - name: Validate registry schema exists
        run: test -f schemas/registry.sql
