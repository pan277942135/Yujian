<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PowerPaint Direct Lab</title>
  <style>
    body{margin:0;background:#f6f8fb;color:#172033;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{max-width:1200px;margin:0 auto;padding:28px 20px 60px}
    h1{margin:12px 0 6px;font-size:30px}.muted{color:#667085}.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin:14px 0;box-shadow:0 2px 10px #1720330b}
    .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar select,.toolbar button{min-height:42px;border:1px solid #cbd5e1;border-radius:9px;padding:0 12px;background:#fff;font:inherit}.toolbar button{background:#172033;color:#fff;border:0;cursor:pointer}.toolbar button:disabled{opacity:.5;cursor:not-allowed}
    .items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;max-height:310px;overflow:auto}.item{border:1px solid #dbe3ee;border-radius:10px;background:#fff;padding:8px;text-align:left;cursor:pointer}.item.selected{border:2px solid #2563eb;background:#eff6ff}.item img{width:100%;height:120px;object-fit:cover;border-radius:7px;display:block}.item b,.item small{display:block;margin-top:5px}.item small{color:#667085}
    .status{white-space:pre-wrap;margin-top:10px}.progress{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.stage{border:1px solid #dbe3ee;border-radius:10px;padding:12px}.stage.ready{border-color:#86efac;background:#f0fdf4}.stage.failed{border-color:#fca5a5;background:#fef2f2}.stage b,.stage span{display:block}.stage span{margin-top:6px;color:#667085;font-size:13px}.results{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.results figure{margin:0}.results img{width:100%;height:320px;object-fit:contain;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px}.results figcaption{font-weight:700;margin-top:8px}.json{max-height:480px;overflow:auto;background:#0f172a;color:#dbeafe;padding:14px;border-radius:10px;white-space:pre-wrap;word-break:break-word}
    @media(max-width:760px){main{padding:18px 12px}.progress,.results{grid-template-columns:1fr}.results img{height:240px}}
  </style>
</head>
<body>
<header>{% include "_mobile_ux.html" %}</header>
<main>
  <h1>PowerPaint Direct Lab V0.1</h1>
  <p class="muted">独立直出实验：Dataset Freeze 原图 → Detector → SAM Mask → PowerPaint。此页面不执行 AUTO_COMPLETION、ROI、Completion Mask、Protected Compose 或 case_label。</p>
  <section class="card">
    <div class="toolbar">
      <label>Dataset Freeze <select id="datasetVersion"></select></label>
      <label>Split <select id="split"><option value="">全部</option><option value="test">test</option><option value="train">train</option><option value="val">val</option></select></label>
      <button id="run" disabled>运行 PowerPaint Direct</button>
    </div>
    <div id="selected" class="muted status">请选择图片</div>
    <div id="status" class="status muted"></div>
  </section>
  <section class="card"><h2>Dataset Freeze 图片</h2><div id="items" class="items"><span class="muted">正在读取…</span></div></section>
  <section class="card"><h2>Pipeline Trace</h2><div id="progress" class="progress"></div></section>
  <section class="card"><h2>结果对比</h2><div class="results"><figure><div id="original"><span class="muted">未运行</span></div><figcaption>A · Original</figcaption></figure><figure><div id="sam"><span class="muted">未运行</span></div><figcaption>B · SAM Mask</figcaption></figure><figure><div id="generated"><span class="muted">未运行</span></div><figcaption>C · PowerPaint AI Generated</figcaption></figure></div></section>
  <section class="card"><h2>Report JSON</h2><pre id="report" class="json">未运行</pre></section>
</main>
<script>
const $=id=>document.getElementById(id);let items=[];let selected=null;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderItems(){ $('items').innerHTML=items.length?items.map((x,i)=>`<button class="item ${selected&&selected.dataset_item_id===x.dataset_item_id?'selected':''}" onclick="choose(${i})"><img src="${esc(x.preview_url)}" alt="${esc(x.image_id)}"><b>${esc(x.image_id)}</b><small>${esc(x.species||'-')} · ${esc(x.split||'-')} · item ${esc(x.dataset_item_id)}</small></button>`).join(''):'<span class="muted">没有图片</span>' }
function choose(i){selected=items[i]||null;renderItems();$('run').disabled=!selected;$('selected').textContent=selected?`已选择 ${selected.image_id} · item ${selected.dataset_item_id} · ${selected.species||'-'}`:'请选择图片'}
function renderProgress(stages){$('progress').innerHTML=(stages||[]).map(x=>{const s=String(x.status||'PENDING').toUpperCase();const cls=s.includes('FAIL')?'failed':s==='READY'||s==='WORKER_EXECUTED'?'ready':'';return `<div class="stage ${cls}"><b>${esc(x.label||x.stage)}</b><span>${esc(s)}</span><span>${x.elapsed_ms==null?'—':Number(x.elapsed_ms).toFixed(2)+' ms'}</span><span>${esc(typeof x.result==='object'?JSON.stringify(x.result):x.result||'')}</span></div>`}).join('')}
function show(id,url){$(id).innerHTML=url?`<img src="${esc(url)}" alt="${id}">`:'<span class="muted">未生成</span>'}
async function load(){const versions=await (await fetch('/api/debug/powerpaint-direct-lab/datasets',{credentials:'include'})).json();$('datasetVersion').innerHTML=versions.map(x=>`<option value="${esc(x.dataset_version)}">${esc(x.dataset_version)} · ${esc(x.image_count)} 张</option>`).join('');await loadItems()}
async function loadItems(){const v=$('datasetVersion').value;if(!v)return;const p=new URLSearchParams({limit:'60'});if($('split').value)p.set('split',$('split').value);items=await (await fetch('/api/debug/powerpaint-direct-lab/datasets/'+encodeURIComponent(v)+'/images?'+p,{credentials:'include'})).json();selected=null;$('run').disabled=true;renderItems();$('selected').textContent='请选择图片'}
async function run(){if(!selected)return;$('run').disabled=true;$('status').textContent='正在执行 Detector → SAM → PowerPaint…';$('report').textContent='运行中…';try{const p=new URLSearchParams({dataset_version:selected.dataset_version,dataset_item_id:String(selected.dataset_item_id)});const r=await fetch('/api/debug/powerpaint-direct-lab/run',{method:'POST',credentials:'include',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:p});const d=await r.json();const report=d.report||{};renderProgress(report.progress||[]);$('report').textContent=JSON.stringify(report,null,2);if(report.result_preview)show('generated',report.result_preview);show('original',report.preview_original);show('sam',report.preview_sam);if(r.ok){$('status').textContent=`Worker Executed · ${report.worker?.worker_ms||'-'} ms · ${report.worker?.result_uri||''}`}else{$('status').textContent=`HTTP ${r.status} · ${d.stage||'运行失败'}：${d.error?.error||d.error?.message||d.detail||d.message||JSON.stringify(d)}`} }catch(e){$('status').textContent=String(e)}finally{$('run').disabled=false}}
$('datasetVersion').addEventListener('change',loadItems);$('split').addEventListener('change',loadItems);$('run').addEventListener('click',run);load().catch(e=>$('status').textContent=String(e));
</script>
</body>
</html>
