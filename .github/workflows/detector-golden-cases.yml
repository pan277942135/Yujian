name: Detector Golden Cases

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build_detector_golden_cases.py
      - app/detector_runtime.py
      - app/recognition_pipeline.py
      - config/recognition_pipeline_v1.json
      - .github/workflows/detector-golden-cases.yml
  workflow_run:
    workflows:
      - Detector Bootstrap
    types:
      - completed

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: gemini-api-project-503706
  WIF_PROVIDER: projects/571785698442/locations/global/workloadIdentityPools/github-actions/providers/yujian-main
  DEPLOY_SERVICE_ACCOUNT: yujian-github-deployer@gemini-api-project-503706.iam.gserviceaccount.com
  BUCKET: yujian-model-factory-571785698442
  DETECTOR_DATASET_VERSION: DET_DS_v0.1
  DETECTOR_MODEL_VERSION: DET_FISH_v0.1

jobs:
  publish-golden-cases:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: google-github-actions/auth@v3.0.0
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
      - name: Install detector parity runtime
        run: python -m pip install -r requirements-detector.txt
      - name: Publish audited detector golden cases
        run: |
          python scripts/build_detector_golden_cases.py \
            --bucket "$BUCKET" \
            --dataset-version "$DETECTOR_DATASET_VERSION" \
            --model-version "$DETECTOR_MODEL_VERSION"
