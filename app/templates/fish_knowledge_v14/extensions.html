<section class="panel"><h1>扩展内容</h1><p class="muted">资料档案与钓鱼知识继续使用既有结构化接口；此区域不编辑图片或发布状态。</p></section>
<div class="grid">
  <section class="panel"><h2>基础生态资料</h2><label>体型描述<textarea id="bodyShape"></textarea></label><label>特征（JSON 数组）<textarea id="features"></textarea></label><label>栖息地（JSON 数组）<textarea id="habitat"></textarea></label><label>食物<input id="food" class="wide"></label><label>季节（JSON 数组）<textarea id="season"></textarea></label><button id="saveProfile" class="primary">保存基础资料</button></section>
  <section class="panel"><h2>钓鱼知识</h2><label>水层<input id="waterLayer" class="wide"></label><label>季节（JSON 数组）<textarea id="fishingSeason"></textarea></label><label>饵料（JSON 数组）<textarea id="bait"></textarea></label><label>钓法（JSON 数组）<textarea id="method"></textarea></label><label>摘要<textarea id="fishingSummary"></textarea></label><button id="saveFishing" class="primary">保存钓鱼知识</button></section>
