{% extends "platform/base.html" %}
{% block content %}
<div class="page-heading"><div><h1>模型仓库</h1><p>统一查看模型、版本、指标和发布状态；模型文件仍由现有 Registry 管理。</p></div><div class="page-actions"><a class="button primary" href="/platform/model/training">＋ 创建训练</a><button class="button" type="button" onclick="loadModels()">刷新</button></div></div>
<section class="panel"><div class="panel-heading"><div><h2>模型版本</h2><p><span class="code">/api/platform/models</span> · 不展示内部存储路径</p></div></div><div id="modelState"><div class="loading">加载中…</div></div></section>
{% endblock %}
{% block scripts %}
<script>
const modelState=document.getElementById('modelState');
function modelStatus(row){const labels={TRAINED:'训练完成',STAGING:'测试中',PRODUCTION:'线上',DEPRECATED:'废弃',SUCCESS:'训练完成'};return `<span class="status-tag status-${String(row.status||'').toLowerCase()}"><span class="status-dot"></span>${esc(labels[row.status]||row.status||'未知')}</span>`}
function metricSummary(metrics){const metric=metrics||{};return `Top1 ${metric.top1==null?'—':(Number(metric.top1)*100).toFixed(1)+'%'} · F1 ${metric.f1==null?'—':(Number(metric.f1)*100).toFixed(1)+'%'}`}
function renderModels(rows){
  if(!rows.length){modelState.innerHTML='<div class="empty">暂无模型版本<br><span class="muted">完成一次训练后，模型会出现在这里</span></div>';return}
  modelState.innerHTML=`<div class="table-wrap"><table class="data-table"><thead><tr><th>模型名称</th><th>版本</th><th>类型</th><th>指标</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead><tbody>${rows.map(row=>`<tr><td><strong>${esc(row.name)}</strong></td><td><span class="code">${esc(row.version)}</span></td><td>${esc(row.type)}</td><td>${esc(metricSummary(row.metrics))}</td><td>${modelStatus(row)}</td><td>${esc(row.created_at||'—')}</td><td><a class="button" href="/platform/model/evaluation?model=${encodeURIComponent(row.id)}">查看评估</a></td></tr>`).join('')}</tbody></table></div>`
}
async function loadModels(){renderState(modelState,'loading');try{renderModels(await platformFetch('/api/platform/models'))}catch(error){renderState(modelState,'error',platformError(error))}}
loadModels();
</script>
{% endblock %}
