name: Qwen GPU Control Audit

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  BACKEND_PROJECT_ID: gemini-api-project-503706
  BACKEND_REGION: asia-east1
  BACKEND_SERVICE: yujian-model-factory-console
  GPU_PROJECT_ID: gen-lang-client-0224022273
  GPU_ZONE: us-central1-a
  GPU_INSTANCE: fish-completion-worker
  WIF_PROVIDER: projects/571785698442/locations/global/workloadIdentityPools/github-actions/providers/yujian-main
  DEPLOY_SERVICE_ACCOUNT: yujian-github-deployer@gemini-api-project-503706.iam.gserviceaccount.com

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3.0.0
        with:
          project_id: ${{ env.BACKEND_PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3.0.1
        with:
          project_id: ${{ env.BACKEND_PROJECT_ID }}
          version: '>= 416.0.0'

      - name: Audit Cloud Run runtime identity and VM permissions
        shell: bash
        run: |
          set -euo pipefail

          SERVICE_JSON="$(gcloud run services describe "$BACKEND_SERVICE"             --project "$BACKEND_PROJECT_ID"             --region "$BACKEND_REGION"             --format=json)"
          printf '%s' "$SERVICE_JSON" > /tmp/service.json

          RUNTIME_SA="$(python3 - <<'PY'
          import json
          with open("/tmp/service.json", encoding="utf-8") as handle:
              payload = json.load(handle)
          spec = ((payload.get("spec") or {}).get("template") or {}).get("spec") or {}
          print(spec.get("serviceAccountName") or spec.get("serviceAccount") or "")
          PY
          )"
          test -n "$RUNTIME_SA"
          echo "runtime_service_account=$RUNTIME_SA" >> "$GITHUB_STEP_SUMMARY"

          gcloud projects get-iam-policy "$GPU_PROJECT_ID" --format=json > /tmp/gpu-policy.json
          RUNTIME_SA="$RUNTIME_SA" python3 - <<'PY'
          import json
          import os
          runtime_member = "serviceAccount:" + os.environ["RUNTIME_SA"]
          with open("/tmp/gpu-policy.json", encoding="utf-8") as handle:
              policy = json.load(handle)
          roles = []
          for binding in policy.get("bindings", []):
              if runtime_member in (binding.get("members") or []):
                  roles.append(binding.get("role"))
          print("project_roles=" + ",".join(sorted(role for role in roles if role)))
          with open("/tmp/runtime_roles.txt", "w", encoding="utf-8") as handle:
              handle.write("\n".join(sorted(role for role in roles if role)))
          PY

          while IFS= read -r role; do
            test -n "$role" || continue
            echo "role=$role"
            if [[ "$role" == roles/* ]]; then
              gcloud iam roles describe "$role" --format=json 2>/dev/null                 | python3 -c 'import json,sys; p=json.load(sys.stdin); print("permissions="+",".join(x for x in p.get("includedPermissions",[]) if x.startswith("compute.instances.")))'                 || true
            fi
          done < /tmp/runtime_roles.txt

          echo "required_permissions=compute.instances.get,compute.instances.start,compute.instances.stop" >> "$GITHUB_STEP_SUMMARY"

          gcloud compute instances describe "$GPU_INSTANCE"             --project "$GPU_PROJECT_ID"             --zone "$GPU_ZONE"             --format='yaml(name,status,lastStartTimestamp,lastStopTimestamp)' | tee /tmp/vm.yaml

          gcloud compute ssh "$GPU_INSTANCE"             --project "$GPU_PROJECT_ID"             --zone "$GPU_ZONE"             --quiet             --command='systemctl is-enabled fish-qwen-refine-worker && systemctl is-active fish-qwen-refine-worker && systemctl --no-pager --full status fish-qwen-refine-worker | sed -n "1,20p"'
