<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fish Segmentation Preview · 渔见 AI</title>
<style>
*{box-sizing:border-box}body{font-family:Inter,system-ui,sans-serif;margin:0;background:#f6f7f8;color:#171717}
main{max-width:1200px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px;margin-top:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.muted{color:#6b7280}.actions{display:flex;gap:10px;align-items:center;margin-top:14px}
button{border:0;border-radius:9px;padding:10px 16px;background:#111827;color:#fff;font-weight:700;cursor:pointer}
.preview{min-height:320px;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:12px;display:grid;place-items:center;overflow:hidden;margin-top:14px}
.preview img{max-width:100%;max-height:560px;object-fit:contain}pre{white-space:pre-wrap;word-break:break-word;background:#111827;color:#e5e7eb;border-radius:10px;padding:14px;font-size:12px;overflow:auto}
.result{display:none}.result.show{display:block}.pill{display:inline-block;background:#ecfdf5;color:#047857;border-radius:999px;padding:5px 10px;font-weight:700}
@media(max-width:800px){main{padding:14px}.grid{grid-template-columns:1fr}}
</style></head>
<body><header>{% include "_mobile_ux.html" %}</header>
<main><h1>Fish Segmentation Preview</h1>
<p class="muted">实验页面：真实 DET_FISH_v0.1 主框 → SAM bbox prompt → mask → transparent fish。</p>
<div class="card"><input id="file" type="file" accept="image/jpeg,image/png,image/webp">
<div class="actions"><button onclick="run()">运行 Fish Segmentation</button><span id="status" class="muted"></span></div></div>
<div class="grid"><div class="card"><h2>Mask Overlay</h2><div id="mask" class="preview"><span class="muted">尚未运行</span></div>
<h2>Transparent Fish</h2><div id="cutout" class="preview"><span class="muted">尚未运行</span></div></div>
<div class="card"><h2>Metrics</h2><div id="summary" class="muted">上传图片后显示 detector bbox、mask quality 与处理时间。</div><pre id="json" class="result"></pre></div></div></main>
<script>
const $=id=>document.getElementById(id);
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function run(){const f=$("file").files[0];if(!f){$("status").textContent="请先选择图片";return}
$("status").textContent="推理中…";try{const fd=new FormData();fd.append("image",f,f.name);
const r=await fetch("/api/debug/fish-segmentation",{method:"POST",body:fd});const d=await r.json();if(!r.ok)throw Error(typeof d.detail==="string"?d.detail:JSON.stringify(d.detail));
$("mask").innerHTML='<img src="'+d.mask_overlay+'" alt="mask overlay">';
$("cutout").innerHTML='<img src="'+d.transparent_fish+'" alt="transparent fish">';
$("summary").innerHTML='<span class="pill">'+esc(d.segmentation.quality)+'</span><p>Detector bbox: '+esc(JSON.stringify(d.detector.bbox_normalized))+'<br>Mask area ratio: '+esc(d.segmentation.mask_area_ratio)+' · edge ratio: '+esc(d.segmentation.edge_ratio)+'<br>Processing: '+esc(d.segmentation.processing_ms)+' ms</p>';
$("json").textContent=JSON.stringify(d,null,2);$("json").classList.add("show");$("status").textContent="完成"}catch(e){$("status").textContent=e.message;$("mask").innerHTML="<span class='muted'>运行失败</span>";$("cutout").innerHTML="<span class='muted'>运行失败</span>"}}
</script></body></html>
