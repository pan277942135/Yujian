<style>
  :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17252b;background:#f4f7f6;--ink:#17252b;--muted:#71817d;--line:#dfe8e4;--panel:#fff;--brand:#164f48;--gold:#b07b2a;--soft:#edf5f1}

  .stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.stat{border:1px solid #e1ebe7;border-radius:12px;background:#fbfdfc;padding:14px}.stat strong{display:block;font-size:24px;letter-spacing:-.03em}.stat span{display:block;color:var(--muted);font-size:12px;margin-top:4px}.inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.notice{padding:12px 14px;border-radius:10px;background:#edf6f1;color:#315e51;border:1px solid #cce3d8}.notice.warning{background:#fff8e8;color:#795a20;border-color:#ead093}.matrix{border-collapse:collapse;font-size:12px;min-width:440px}.matrix th,.matrix td{padding:8px 10px;border:1px solid #e0ebe6;text-align:center}.matrix th{background:#f4f8f6;color:#5f736d}.asset-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.asset-tile{border:1px solid #e0ebe6;border-radius:12px;padding:10px;background:#fbfdfc}.asset-tile img{width:100%;aspect-ratio:4/3;object-fit:contain;background:#eff4f1;border-radius:8px}.asset-tile strong{display:block;margin-top:8px;font-size:13px}.batch-action-bar{position:fixed;z-index:35;left:calc(260px + 34px);right:34px;bottom:18px;padding:12px 15px;border:1px solid #c8ddd3;border-radius:14px;background:rgba(246,252,249,.96);box-shadow:0 12px 30px rgba(31,75,61,.15);display:flex;align-items:center;gap:12px;flex-wrap:wrap}.batch-action-buttons{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto}.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:#f2f6f4;border-radius:6px;padding:2px 5px}.timeline{display:flex;align-items:flex-start;gap:0;overflow:auto;padding:10px 0 18px}.timeline-step{min-width:145px;position:relative;padding-right:28px}.timeline-step:not(:last-child)::after{content:'';position:absolute;left:23px;right:5px;top:12px;height:2px;background:#c8dcd3}.timeline-step > div{position:relative;z-index:1;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:#dceae5;color:#2b6556;font-size:12px;font-weight:850}.timeline-step.success > div{background:#2a8068;color:#fff}.timeline-step.failed > div{background:#b94b42;color:#fff}.timeline-step strong{display:block;margin-top:8px;font-size:13px}.timeline-step small{display:block;color:var(--muted);margin-top:4px;line-height:1.4}.four-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.four-grid .panel{padding:12px}.four-grid img{width:100%;aspect-ratio:1/1;object-fit:contain;border-radius:9px;background:#eef4f1}.batch-action-bar[hidden]{display:none}
  @media(max-width:1100px){.platform-sidebar{width:220px}.platform-main{margin-left:220px;padding-left:24px;padding-right:24px}.metric-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.split-layout{grid-template-columns:190px minmax(0,1fr)}}
  @media(max-width:1100px){.asset-grid,.four-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.batch-action-bar{left:244px;right:24px}}
  @media(max-width:780px){.platform-sidebar{transform:translateX(-105%);transition:transform .2s ease;width:270px}.platform-sidebar.open{transform:translateX(0)}.platform-main{margin-left:0;padding:0 14px 36px}.platform-topbar{min-height:64px}.mobile-menu{display:inline-flex}.page-wrap{padding-top:22px}.page-heading{display:block}.page-actions{margin-top:16px}.metric-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric-card{padding:14px}.metric-value{font-size:25px}.split-layout{grid-template-columns:1fr}.filter-panel,.ai-panel{position:static}.review-card{grid-template-columns:96px minmax(0,1fr)}.review-thumb{width:96px;height:80px}.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}.stat-grid{grid-template-columns:1fr 1fr}.batch-action-bar{left:14px;right:14px;bottom:10px}.batch-action-buttons{margin-left:0}.four-grid,.asset-grid{grid-template-columns:1fr 1fr}}
  @media(max-width:420px){.metric-grid{grid-template-columns:1fr 1fr}.metric-label{font-size:12px}.metric-value{font-size:23px}.topbar-link{display:none}}
  .sidebar-toggle{margin-left:auto;border:1px solid rgba(233,244,239,.22);border-radius:8px;background:rgba(255,255,255,.08);color:#e9f4ef;padding:7px 8px;cursor:pointer;font-size:12px;white-space:nowrap}.sidebar-toggle:hover{background:rgba(255,255,255,.16)}
  .nav-icon{width:20px;text-align:center;flex:0 0 20px;font-size:15px;color:#b8d5ca}.nav-link.active .nav-icon{color:#c1872d}.platform-sidebar.collapsed{width:72px;padding-left:10px;padding-right:10px}.platform-main.sidebar-collapsed{margin-left:72px}.platform-sidebar.collapsed .brand{justify-content:center;padding-left:0;padding-right:0}.platform-sidebar.collapsed .brand-copy,.platform-sidebar.collapsed .toggle-label,.platform-sidebar.collapsed .nav-group-title,.platform-sidebar.collapsed .nav-label,.platform-sidebar.collapsed .sidebar-foot{display:none}.platform-sidebar.collapsed .sidebar-toggle{margin-left:0;padding:7px}.platform-sidebar.collapsed .nav-link{justify-content:center;padding-left:8px;padding-right:8px}.platform-sidebar.collapsed .nav-icon{width:28px;flex-basis:28px}.sidebar-overlay{display:none}
  .import-flow{display:flex;align-items:stretch;gap:8px;overflow:auto;padding:8px 0 4px}.import-step{min-width:150px;flex:1;border:1px solid #dce9e3;border-radius:12px;background:#f8fcfa;padding:15px}.import-step span{display:grid;place-items:center;width:25px;height:25px;border-radius:50%;background:#2a8068;color:#fff;font-weight:800;font-size:12px}.import-step strong{display:block;margin-top:10px}.import-step small{display:block;color:var(--muted);line-height:1.45;margin-top:5px}.import-arrow{display:grid;place-items:center;color:#8ba79d;font-size:22px}.import-note{margin-top:16px}.import-note h2{font-size:18px;margin:0}.import-note p{color:var(--muted);line-height:1.7}.import-note a{color:var(--brand);font-weight:750}

<body>
<div class="platform-app">
  {% include "platform/sidebar.html" %}
  <button id="platformSidebarOverlay" class="sidebar-overlay" type="button" aria-label="关闭导航" onclick="closePlatformSidebar()"></button>
  <div class="platform-main">
    <header class="platform-topbar">
      <button class="mobile-menu" type="button" onclick="togglePlatformSidebar()" aria-label="打开导航">☰</button>
      <div class="breadcrumb"><span>渔见 AI 智能生产平台</span><strong>{{ page_title }}</strong></div>
      <div class="topbar-spacer"></div>
      <a class="topbar-link" href="/">切换工作台</a>
      <a class="topbar-link" href="/logout">退出</a>
    </header>
    <main class="page-wrap">
      {% block content %}{% endblock %}
    </main>
  </div>
</div>
<script>
const platformSidebarStorageKey='yujian_platform_sidebar_collapsed';
function isPlatformMobile(){return window.matchMedia('(max-width:780px)').matches}
function applyPlatformSidebarState(collapsed){const sidebar=document.querySelector('.platform-sidebar');const main=document.querySelector('.platform-main');if(!sidebar||!main)return;if(isPlatformMobile()){sidebar.classList.remove('collapsed','expanded');main.classList.remove('sidebar-collapsed','sidebar-expanded');return}sidebar.classList.toggle('collapsed',collapsed);sidebar.classList.toggle('expanded',!collapsed);main.classList.toggle('sidebar-collapsed',collapsed);main.classList.toggle('sidebar-expanded',!collapsed);const toggle=sidebar.querySelector('.sidebar-toggle');toggle?.setAttribute('aria-expanded',String(!collapsed));toggle?.setAttribute('aria-label',collapsed?'展开导航':'收起导航')}
function togglePlatformSidebarCollapse(){const sidebar=document.querySelector('.platform-sidebar');if(isPlatformMobile()){sidebar?.classList.toggle('open');document.getElementById('platformSidebarOverlay')?.classList.toggle('visible',sidebar?.classList.contains('open'));return}const collapsed=!sidebar?.classList.contains('collapsed');localStorage.setItem(platformSidebarStorageKey,collapsed?'1':'0');applyPlatformSidebarState(collapsed)}
function togglePlatformSidebar(){togglePlatformSidebarCollapse()}
function closePlatformSidebar(){document.querySelector('.platform-sidebar')?.classList.remove('open');document.getElementById('platformSidebarOverlay')?.classList.remove('visible')}
document.addEventListener('DOMContentLoaded',()=>{const stored=localStorage.getItem(platformSidebarStorageKey);const collapsed=stored===null?window.matchMedia('(min-width:781px) and (max-width:1199px)').matches:stored==='1';applyPlatformSidebarState(collapsed);document.querySelectorAll('.platform-sidebar a').forEach(link=>link.addEventListener('click',()=>{if(isPlatformMobile())closePlatformSidebar()}));window.addEventListener('resize',()=>{const value=localStorage.getItem(platformSidebarStorageKey);applyPlatformSidebarState(value===null?window.matchMedia('(min-width:781px) and (max-width:1199px)').matches:value==='1')})});
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function platformError(error){return error instanceof Error?error.message:String(error||'请求失败')}
async function platformFetch(url,options){const response=await fetch(url,options);const text=await response.text();let data={};try{data=text?JSON.parse(text):{}}catch{data={detail:text}}if(!response.ok){throw new Error(typeof data.detail==='string'?data.detail:(data.detail?.message||data.message||`请求失败 (${response.status})`))}return data}
function renderState(target,state,message){const node=typeof target==='string'?document.getElementById(target):target;if(!node)return;node.innerHTML=state==='loading'?'<div class="loading">加载中…</div>':state==='error'?`<div class="error-state">${esc(message||'数据加载失败')}</div>`:''}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
