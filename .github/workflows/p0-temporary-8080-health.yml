name: P0 Temporary 8080 Health Probe

on:
  push:
    branches:
      - p0-8080-probe-20260913
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup-old-uat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cancel pending old 8000 UAT deploy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh api --method POST             repos/pan277942135/Yujian/actions/runs/34742331046/cancel
          RC=$?
          echo "CANCEL_RC=$RC"
          exit 0
