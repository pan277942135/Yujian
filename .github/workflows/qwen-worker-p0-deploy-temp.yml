name: Temporary Qwen Worker P0 Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  TARGET_SHA: 781cb5864c3b2c4c44691f908ed17b63b7e10d92
  GCP_PROJECT: gen-lang-client-0224022273
  VM_NAME: fish-completion-worker
  ZONE: us-central1-a
  DEPLOY_PROJECT: gemini-api-project-503706
  WIF_PROVIDER: projects/571785698442/locations/global/workloadIdentityPools/github-actions/providers/yujian-main
  DEPLOY_SERVICE_ACCOUNT: yujian-github-deployer@gemini-api-project-503706.iam.gserviceaccount.com
  WORKER_URL: http://34.69.75.199:8002
  TEST_BUCKET: yujian-model-factory-571785698442

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout deployment baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3.0.0
        with:
          project_id: ${{ env.DEPLOY_PROJECT }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3.0.1
        with:
          project_id: ${{ env.DEPLOY_PROJECT }}
          version: '>= 416.0.0'

      - name: Prepare worker source and fixed test input
        shell: bash
        run: |
          set -euo pipefail
          test -f workers/fish-qwen-refine-worker/worker.py
          test -f workers/fish-qwen-refine-worker/config.yaml
          test -f workers/fish-qwen-refine-worker/qwen2511_api.json
          grep -q 'warmup_steps' workers/fish-qwen-refine-worker/worker.py
          grep -q 'torch.%s' workers/fish-qwen-refine-worker/worker.py
          tar -C workers -czf "$RUNNER_TEMP/qwen-worker-p0.tgz" fish-qwen-refine-worker

          mkdir -p "$RUNNER_TEMP/qwen-p0-evidence"
          report_uri="$(gcloud storage ls "gs://${TEST_BUCKET}/experiments/fish_completion_lab/v0.3.1/FCL_20260918_*/16_test_report.json" 2>/dev/null | sort | tail -n 1 || true)"
          if [[ -z "$report_uri" ]]; then
            echo "No historical fish report found in ${TEST_BUCKET}" >&2
            exit 1
          fi
          gcloud storage cp "$report_uri" "$RUNNER_TEMP/qwen-p0-evidence/historical_report.json"
          input_uri="$(python3 - "$RUNNER_TEMP/qwen-p0-evidence/historical_report.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)
          assets = report.get("assets") or {}
          for key in ("original", "refined_visible", "sam_raw_transparent", "sam_transparent"):
              value = str(assets.get(key) or "").strip()
              if value:
                  print(value)
                  break
          else:
              raise SystemExit("historical report has no usable input asset")
          PY
          )"
          printf '%s\n' "$input_uri" > "$RUNNER_TEMP/qwen-p0-evidence/input_uri.txt"
          gcloud storage cp "$input_uri" "$RUNNER_TEMP/qwen-p0-evidence/input.png"
          file "$RUNNER_TEMP/qwen-p0-evidence/input.png"

      - name: Deploy worker to GPU VM and verify startup
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/qwen-worker-p0.tgz"
          remote_script="$RUNNER_TEMP/qwen-p0-remote.sh"
          cat > "$remote_script" <<'REMOTE'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          TARGET_SHA="$1"
          ARCHIVE="$2"
          WORKER="/opt/fish-qwen-refine-worker"
          BACKUP="$WORKER.before_p0_$(date -u +%Y%m%d_%H%M%S)"
          echo "[P0] host=$(hostname)"
          echo "[P0] target=$TARGET_SHA"
          test -d "$WORKER"

          echo "[P0] systemd before"
          sudo systemctl cat fish-qwen-refine-worker || true
          echo "[P0] health before"
          curl -sS --max-time 15 http://127.0.0.1:8002/health || true
          echo
          echo "[P0] gpu before"
          nvidia-smi || true

          sudo cp -a "$WORKER" "$BACKUP"
          echo "[P0] backup=$BACKUP"

          is_git="$(sudo git -C "$WORKER" rev-parse --is-inside-work-tree 2>/dev/null || true)"
          if [[ "$is_git" == "true" ]]; then
            sudo git -C "$WORKER" fetch --no-tags https://github.com/pan277942135/Yujian.git "$TARGET_SHA"
            sudo git -C "$WORKER" checkout --detach "$TARGET_SHA"
          else
            sudo mkdir -p /tmp/qwen-worker-p0-source
            sudo tar -xzf "$ARCHIVE" -C /tmp/qwen-worker-p0-source
            sudo cp -a /tmp/qwen-worker-p0-source/fish-qwen-refine-worker/. "$WORKER"/
          fi

          sudo install -m 0644 "$WORKER/fish-qwen-refine-worker.service" /etc/systemd/system/fish-qwen-refine-worker.service
          sudo mkdir -p "$WORKER/output"
          sudo chown -R pan277942135:pan277942135 "$WORKER/output"
          if [[ ! -x "$WORKER/.venv/bin/python" ]]; then
            sudo python3 -m venv "$WORKER/.venv"
          fi
          sudo "$WORKER/.venv/bin/pip" install --disable-pip-version-check -r "$WORKER/requirements.txt"

          echo "[P0] static worker commit"
          sudo git -C "$WORKER" rev-parse HEAD 2>/dev/null || true
          echo "[P0] config"
          sudo sed -n '1,160p' "$WORKER/config.yaml"
          echo "[P0] systemd after"
          sudo systemctl cat fish-qwen-refine-worker

          sudo systemctl daemon-reload
          sudo systemctl enable fish-qwen-refine-worker
          sudo systemctl restart fish-qwen-refine-worker
          sudo systemctl is-active --quiet fish-qwen-refine-worker

          health=""
          ready=0
          for attempt in $(seq 1 180); do
            health="$(curl -fsS --max-time 15 http://127.0.0.1:8002/health || true)"
            echo "[P0] health attempt=$attempt $health"
            if HEALTH_JSON="$health" python3 - <<'PY'
          import json
          import os
          try:
              payload = json.loads(os.environ["HEALTH_JSON"])
          except Exception:
              raise SystemExit(1)
          required = (
              payload.get("status") == "ready"
              and payload.get("model_loaded") is True
              and payload.get("dtype") == "float16"
              and payload.get("device") == "cuda"
              and (payload.get("config") or {}).get("width") == 768
              and (payload.get("config") or {}).get("height") == 768
              and (payload.get("config") or {}).get("steps") == 25
          )
          raise SystemExit(0 if required else 1)
          PY
            then
              ready=1
              break
            fi
            sleep 5
          done
          if [[ "$ready" != "1" ]]; then
            echo "[P0] worker did not become ready"
            sudo systemctl status fish-qwen-refine-worker --no-pager || true
            sudo journalctl -u fish-qwen-refine-worker -n 300 --no-pager || true
            exit 1
          fi

          echo "[P0] startup journal"
          sudo journalctl -u fish-qwen-refine-worker -n 300 --no-pager
          echo "[P0] gpu resident initial"
          nvidia-smi
          sleep 35
          echo "[P0] gpu resident idle_35s"
          nvidia-smi
          echo "[P0] health ready"
          curl -fsS http://127.0.0.1:8002/health
          echo
          REMOTE
          chmod +x "$remote_script"

          gcloud compute scp "$archive" "$remote_script" "${VM_NAME}:/tmp/"             --project="$GCP_PROJECT" --zone="$ZONE" --quiet
          gcloud compute ssh "$VM_NAME"             --project="$GCP_PROJECT" --zone="$ZONE" --quiet             --command="sudo bash /tmp/$(basename "$remote_script") $TARGET_SHA /tmp/$(basename "$archive")"

      - name: Run fixed-input first and steady-state latency tests
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/qwen-p0-evidence"
          test -s "$evidence/input.png"
          cat > "$evidence/params.json" <<'JSON'
          {
            "mode": "fish_preserve_refine_qwen_v1",
            "source_run_id": "QWEN_P0_RUNTIME_UAT",
            "steps": 25,
            "seed": 12345,
            "auto_straighten": false,
            "prompt": "Restore and refine this fish into a clean, complete, realistic fish portrait. Keep the exact same fish identity, species traits, body proportions, head shape, fin structure, scale texture, and natural color pattern. Use the visible fish as the only identity reference. Complete the missing or occluded fish body parts naturally. Remove all non-fish objects and do not keep any human hand, fingers, tools, nets, hooks, ropes, buckets, or other foreign objects. The result should be a single complete fish, realistic, clean, natural, and high-detail.",
            "negative_prompt": "human hand, fingers, arm, person, tool, fishing net, hook, rope, bucket, extra fish, duplicated fish, changed species, wrong anatomy, deformed body, cartoon, painting, fake texture, unrealistic fins, broken tail"
          }
          JSON

          for label in first steady_state; do
            started="$(date +%s.%N)"
            status="$(
              curl --retry 2 --retry-all-errors --retry-delay 2                 --connect-timeout 15 --max-time 1500                 -sS -o "$evidence/${label}.json" -w '%{http_code}'                 -F "image=@$evidence/input.png;type=image/png"                 -F "params=<${evidence}/params.json"                 "${WORKER_URL}/refine"
            )"
            finished="$(date +%s.%N)"
            printf '%s\n' "$status" > "$evidence/${label}.http_status"
            python3 - "$evidence/${label}.json" "$started" "$finished" "$label" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              payload = json.load(handle)
          if payload.get("status") != "success":
              raise SystemExit(f"worker response not success: {payload}")
          performance = payload.get("performance") or {}
          required = ("inference_time", "total_time", "save_time")
          if any(key not in performance for key in required):
              raise SystemExit(f"worker performance fields missing: {payload}")
          started = float(sys.argv[2])
          finished = float(sys.argv[3])
          result = {
              "label": sys.argv[4],
              "request_wall_time": round(finished - started, 3),
              "inference_time": performance.get("inference_time"),
              "download_time": performance.get("download_time"),
              "save_time": performance.get("save_time"),
              "total_time": performance.get("total_time"),
              "runtime": payload.get("runtime"),
              "seed": payload.get("seed"),
              "steps": payload.get("steps"),
              "result_uri": payload.get("result_uri"),
          }
          with open(sys.argv[1] + ".summary.json", "w", encoding="utf-8") as handle:
              json.dump(result, handle, ensure_ascii=False, indent=2)
          print(json.dumps(result, ensure_ascii=False))
          PY
            result_uri="$(python3 - "$evidence/${label}.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              print(json.load(handle).get("result_uri") or "")
          PY
            )"
            test -n "$result_uri"
            curl --retry 2 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 120               -fsS "${WORKER_URL}${result_uri}" -o "$evidence/${label}_output.png"
          done

          python3 - "$evidence" <<'PY'
          import json
          import sys
          from pathlib import Path
          root = Path(sys.argv[1])
          baseline = 390.0
          rows = []
          for label in ("first", "steady_state"):
              row = json.loads((root / f"{label}.json.summary.json").read_text(encoding="utf-8"))
              total = float(row["total_time"])
              row["before_baseline_seconds"] = baseline
              row["improvement_percent_vs_390s"] = round((baseline - total) / baseline * 100, 2)
              rows.append(row)
          (root / "latency_summary.json").write_text(json.dumps(rows, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps(rows, ensure_ascii=False, indent=2))
          PY

      - name: Collect runtime evidence
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/qwen-p0-evidence"
          curl -sS --connect-timeout 10 --max-time 30 "${WORKER_URL}/health"             -o "$RUNNER_TEMP/qwen-p0-evidence/public_health.json" || true
          {
            echo "### Qwen Worker P0 Runtime Evidence"
            echo "- Target commit: $TARGET_SHA"
            echo "- Worker URL: $WORKER_URL"
            echo "- Fixed input source: historical fish completion report asset"
            echo "- Baseline: approximately 390 seconds"
          } > "$RUNNER_TEMP/qwen-p0-evidence/summary.md"
          cat "$RUNNER_TEMP/qwen-p0-evidence/public_health.json" >> "$RUNNER_TEMP/qwen-p0-evidence/summary.md" 2>/dev/null || true

      - name: Upload P0 evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: qwen-worker-p0-runtime-evidence
          path: ${{ runner.temp }}/qwen-p0-evidence
          if-no-files-found: warn
