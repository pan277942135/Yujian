<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鱼体自动资产流水线 V0.2</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f6f4;color:#17211f;font-family:system-ui,sans-serif}main{max-width:1480px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #dbe7e1;border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 4px 18px #153b2d0b}h1,h2{margin:0 0 9px}.muted{color:#64736d;font-size:13px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}button,input{font:inherit;border:1px solid #cbd9d3;border-radius:9px;padding:10px}button{background:#123b2e;color:#fff;border:0;font-weight:700;cursor:pointer}button:disabled{opacity:.5}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.step{padding:10px;border:1px solid #dbe7e1;border-radius:10px;background:#f9fbfa}.step b{display:block}.running{border-color:#d79b25;background:#fff7df}.ok{border-color:#47a77a;background:#edf9f2}.fail{border-color:#c75b5b;background:#fff0f0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.preview{min-height:220px;display:grid;place-items:center;background:#f7faf8;border:1px dashed #cbd9d3;border-radius:12px;overflow:hidden}.preview img{max-width:100%;max-height:520px;object-fit:contain}.log{white-space:pre-wrap;background:#10241d;color:#e8f4ef;border-radius:12px;padding:14px;min-height:130px;font:12px/1.5 ui-monospace,monospace}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#e4f3eb;color:#08734d;font-weight:700}@media(max-width:900px){main{padding:12px}.grid,.steps{grid-template-columns:1fr}.toolbar{display:grid;grid-template-columns:1fr}.toolbar>*{width:100%;min-height:44px}}
</style></head>
<body><header>{% include "_mobile_ux.html" %}</header><main>
<h1>鱼体自动资产流水线 <span class="badge">V0.2</span></h1><p class="muted">默认一键自动生成；原有手动遮罩页不变，作为高级调试工具保留。</p>
<section class="card"><div class="toolbar"><input id="file" type="file" accept="image/jpeg,image/png,image/webp"><input id="label" placeholder="案例标签（可选）"><button id="run">一键生成鱼体资产</button></div><p id="status" class="muted">等待选择图片</p></section>
<section class="card"><h2>流水线进度</h2><div id="steps" class="steps"></div></section>
<section class="card"><h2>运行日志</h2><pre id="log" class="log"></pre></section>
<section class="card"><h2>结果资产</h2><div id="results" class="grid"></div></section>
<section class="card"><h2>自动判断</h2><pre id="analysis" class="log">尚未运行</pre></section>
<section class="card"><h2>Completion Worker（补全工作节点）</h2><pre id="worker" class="log">尚未检测</pre></section>
<section class="card"><details><summary><b>展开高级调试</b></summary><p>手动遮罩编辑器、SAM 叠加层和诊断信息保留在原实验页。</p><a href="/debug/fish-completion-lab">打开 Manual Mask Editor（高级调试）</a></details></section>
<script>
const names=["上传与检测","鱼体分割","完整度判断","自动补全区域","AI 补全","边缘优化","描边输出","最终资产"],$=id=>document.getElementById(id);
function steps(active=-1,failed=-1){$("steps").innerHTML=names.map((n,i)=>`<div class="step ${i===failed?"fail":i===active?"running":i<active?"ok":""}"><b>${i+1}. ${n}</b><span>${i===failed?"失败":i===active?"进行中":i<active?"成功":"等待中"}</span></div>`).join("")}
function log(msg,data){$("log").textContent+=`[${new Date().toLocaleTimeString()}] ${msg}`+(data?"\n"+JSON.stringify(data,null,2):"")+"\n"}
async function responseJson(r){const t=await r.text();try{return JSON.parse(t)}catch(_){return{status:"error",stage:"network",error:{error_code:"HTTP_NON_JSON",message:t||("HTTP "+r.status),detail:{raw:t}}}}}
function render(data){const a=data.assets||{},items={original_image:"A · 原图",sam_transparent:"B · SAM 分割",auto_completion_mask:"C · 自动补全区域",edge_refined:"D · 边缘优化","fish_clean.png":"E · Clean 透明鱼体","fish_gold_outline.png":"F · Gold 描边","fish_black_outline.png":"G · Black 描边",generated_roi:"H · Worker 生成区域",final_asset:"I · 最终合成资产"};$("results").innerHTML=Object.entries(items).filter(([k])=>a[k]).map(([k,v])=>`<div><b>${v}</b><div class="preview"><img src="${a[k]}" alt="${v}"></div></div>`).join("")}
async function run(){const f=$("file").files[0];if(!f){$("status").textContent="请先选择图片";return}$("run").disabled=true;$("log").textContent="";steps(0);log("Step 1 上传与检测开始",{file:f.name,size:f.size});const fd=new FormData();fd.append("file",f,f.name);fd.append("case_label",$("label").value);try{const r=await fetch("/api/debug/fish-completion-lab-v02/auto-run",{method:"POST",credentials:"include",body:fd}),b=await responseJson(r);log("API 返回",{status:r.status,body:b});if(!r.ok||b.status==="error")throw b;const d=b.data,w=d.worker||{};log("Step 1 上传与检测成功",d.detector);log("Step 2 SAM 分割成功",d.segmentation);log("Step 3 完整度判断成功",d.auto_completion);log("Step 4 自动补全区域生成成功",d.completion_mask);log("Step 5 AI 补全状态",w);if(w.status==="WORKER_UNAVAILABLE"||w.status==="WORKER_FAILED"){steps(4,4);log("AI 补全未完成：Worker 不可用或失败",w)}else{log("Step 5 AI 补全成功或跳过",w);log("Step 6 边缘优化成功");log("Step 7 描边输出成功");log("Pipeline completed（流水线完成）");steps(8)}render(d);$("analysis").textContent=JSON.stringify(d.auto_completion,null,2);$("worker").textContent=JSON.stringify(w,null,2);$("status").textContent=w.status==="WORKER_UNAVAILABLE"?"基础资产完成；补全 Worker 不可用":"自动资产流水线完成"}catch(e){const x=e.error?e:{error:{error_code:"CLIENT_PIPELINE_FAILED",message:e.message||String(e)}};log("流水线失败",x);$("status").textContent=x.error.message||"流水线失败";steps(-1,0)}finally{$("run").disabled=false}}
steps();$("run").addEventListener("click",run);
</script></main></body></html>
