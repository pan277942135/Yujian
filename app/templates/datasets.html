<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>数据集 · 渔见 AI</title>
  <style>
    body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f6f7f8;color:#171717}header{background:#fff;border-bottom:1px solid #e5e7eb;padding:14px 24px;display:flex;gap:22px;align-items:center;position:sticky;top:0;z-index:3}header a{text-decoration:none;color:#111827;font-weight:650}main{max-width:1180px;margin:0 auto;padding:24px}.muted{color:#6b7280}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.section{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px;margin-top:18px}input,button{font:inherit;border:1px solid #d1d5db;border-radius:8px;padding:9px;background:#fff}button{cursor:pointer;font-weight:650}.primary{background:#111827;color:#fff}.row{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;margin:10px 0}.species{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#f3f4f6;font-size:12px}.pillBtn{cursor:pointer;border:0}.pillBtn:hover{text-decoration:underline;text-underline-offset:2px;box-shadow:0 0 0 2px rgba(15,23,42,.07)}.good{background:#ecfdf5}.warn{background:#fff7ed}.big{font-size:34px;font-weight:750}.bigBtn{border:0;padding:0;background:transparent;font-size:34px;font-weight:750;cursor:pointer;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #eee;font-size:13px}th{color:#6b7280}.banner{display:none;white-space:pre-wrap;padding:12px;border-radius:10px;background:#eef2ff;margin-top:12px}.spinner{opacity:.6;pointer-events:none}.rule{border-left:4px solid #111827;padding:10px 12px;background:#f9fafb;border-radius:0 8px 8px 0;margin-top:14px}
    .modal{position:fixed;inset:0;background:rgba(15,23,42,.52);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.modal.open{display:flex}.modalCard{width:min(1180px,96vw);max-height:92vh;background:#fff;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.28)}.modalHeader{display:flex;gap:10px;align-items:center;padding:15px 18px;border-bottom:1px solid #e5e7eb}.modalHeader h2{margin:0;font-size:20px}.spacer{flex:1}.modalBody{padding:16px 18px;overflow:auto}.gallery{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}.gcard{border:1px solid #e5e7eb;border-radius:11px;padding:7px}.gcard img{width:100%;aspect-ratio:4/3;object-fit:contain;background:#111;border-radius:8px}.gmeta{font-size:12px;display:flex;flex-direction:column;gap:3px;margin-top:5px;min-width:0}.gid{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.modalFooter{padding:12px 18px;border-top:1px solid #e5e7eb;display:flex;gap:8px;align-items:center}.catalogList{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.catalogItem{border:1px solid #e5e7eb;border-radius:10px;padding:10px}.empty{padding:60px 20px;text-align:center;color:#6b7280}@media(max-width:850px){.grid{grid-template-columns:1fr}.section{overflow:auto}.gallery{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.gallery{grid-template-columns:repeat(2,1fr)}.catalogList{grid-template-columns:1fr}.modal{padding:7px}}
  </style>
</head>
<body>
<header><a href="/">总览</a><a href="/batches">数据批次</a><a href="/review">人工审核</a><a href="/species">鱼种管理</a><a href="/feedback">用户反馈</a><a href="/datasets">数据集</a></header>
<main>
  <h1>数据集版本</h1><div class="muted">数据集不是临时挑一批图片复制出来，而是“累计可用数据总池”在某一时刻的不可变快照。页面上的数量可以点击下钻检查。</div>
  <div id="banner" class="banner"></div>
  <div class="grid">
    <div class="section"><h2>累计可用数据总池</h2><div id="summary"></div><div class="rule"><b>默认规则：使用全部已通过数据</b><br><span class="muted">所有历史批次中当前审核为“通过”且鱼种已经启用的样本都会进入下一版数据集；候选鱼种样本继续保留，等鱼种启用后自动进入后续版本。</span></div></div>
    <div class="section"><h2>冻结新版本</h2><div class="row"><label>数据集版本</label><input id="version" value="DS_M1_v0.1"></div><div class="row"><label>父版本</label><input id="parent" placeholder="留空则自动继承最新版本"></div><div class="row"><label>代码版本</label><input id="git" placeholder="可填写 Git commit"></div><div class="row"><label>随机种子</label><input id="seed" type="number" value="20260826"></div><div class="row"><label>训练集比例</label><input id="train" type="number" step="0.01" value="0.70"></div><div class="row"><label>验证集比例</label><input id="val" type="number" step="0.01" value="0.15"></div><button class="primary" onclick="freeze()">冻结累计数据集</button><div class="muted" style="margin-top:9px">系统会同时生成数据清单、版本说明和类别映射文件；旧版本永不覆盖。</div></div>
  </div>
  <div class="section" id="frozen"><h2>已冻结版本</h2><table><thead><tr><th>版本</th><th>父版本</th><th>鱼种数</th><th>训练集</th><th>验证集</th><th>测试集</th><th>选样规则</th><th>状态</th></tr></thead><tbody id="datasets"></tbody></table></div>
</main>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="modalCard"><div class="modalHeader"><h2 id="modalTitle">数据详情</h2><span id="modalCount" class="muted"></span><div class="spacer"></div><button onclick="closeModal()">关闭</button></div><div class="modalBody" id="modalBody"></div><div class="modalFooter" id="modalFooter"></div></div></div>
<script>
let summaryData=null,gallerySpecies='',galleryOffset=0,galleryTotal=0,galleryLimit=24;
function esc(v){return (v??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function msg(t,err=false){const b=document.getElementById('banner');b.style.display='block';b.style.background=err?'#fff1f2':'#eef2ff';b.textContent=t}
async function api(url,opts){const r=await fetch(url,opts);const text=await r.text();let d;try{d=JSON.parse(text)}catch{d=text}if(!r.ok)throw new Error(d.detail||text);return d}
function modeName(v){return ({ALL_APPROVED:'全部已通过数据'})[v]||v||'-'}function datasetStatus(v){return ({FROZEN:'已冻结'})[v]||v||'-'}
function openModal(){document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}
async function openApproved(species=''){gallerySpecies=species;galleryOffset=0;await loadApprovedGallery()}
async function loadApprovedGallery(){const p=new URLSearchParams({status:'approved',limit:String(galleryLimit),offset:String(galleryOffset)});const sp=new URLSearchParams({status:'approved'});if(gallerySpecies){p.set('species',gallerySpecies);sp.set('species',gallerySpecies)}const [items,stats]=await Promise.all([api('/api/review?'+p),api('/api/review/stats?'+sp)]);galleryTotal=stats.filtered||0;document.getElementById('modalTitle').textContent=gallerySpecies?`${gallerySpecies} · 已通过图片`:'累计可用图片';document.getElementById('modalCount').textContent=`共 ${galleryTotal} 张`;document.getElementById('modalBody').innerHTML=items.length?`<div class="gallery">${items.map(x=>`<div class="gcard"><img loading="lazy" src="${x.media_url}" alt="${esc(x.image_id)}"><div class="gmeta"><div class="gid" title="${esc(x.image_id)}">${esc(x.image_id)}</div><div>鱼种：<b>${esc(x.truth_species||x.claimed_species||'-')}</b></div><div class="muted">批次：${esc(x.batch_id)}</div></div></div>`).join('')}</div>`:'<div class="empty">没有符合条件的图片。</div>';const from=galleryTotal?galleryOffset+1:0,to=Math.min(galleryTotal,galleryOffset+galleryLimit);document.getElementById('modalFooter').innerHTML=`<button ${galleryOffset<=0?'disabled':''} onclick="galleryPrev()">← 上一页</button><span class="muted">${from}-${to} / ${galleryTotal}</span><button ${galleryOffset+galleryLimit>=galleryTotal?'disabled':''} onclick="galleryNext()">下一页 →</button><div class="spacer"></div><a href="/review?status=approved${gallerySpecies?'&species='+encodeURIComponent(gallerySpecies):''}">进入单张审核 →</a>`;openModal()}
function galleryPrev(){if(galleryOffset>=galleryLimit){galleryOffset-=galleryLimit;loadApprovedGallery().catch(e=>alert(e.message))}}function galleryNext(){if(galleryOffset+galleryLimit<galleryTotal){galleryOffset+=galleryLimit;loadApprovedGallery().catch(e=>alert(e.message))}}
async function openCatalog(status,label){const rows=await api('/api/species?status='+encodeURIComponent(status));document.getElementById('modalTitle').textContent=label;document.getElementById('modalCount').textContent=`共 ${rows.length} 个`;document.getElementById('modalBody').innerHTML=rows.length?`<div class="catalogList">${rows.map(x=>`<div class="catalogItem"><b>${esc(x.common_name_zh)}</b><div class="muted">${esc(x.common_name_en||'-')}</div><div class="muted">${esc(x.scientific_name||'-')}</div><div style="margin-top:6px"><button class="pill pillBtn" onclick="openApproved('${esc(x.common_name_zh)}')">查看已通过图片</button></div></div>`).join('')}</div>`:'<div class="empty">当前没有对应鱼种。</div>';document.getElementById('modalFooter').innerHTML='<div class="spacer"></div><a href="/species">进入鱼种管理 →</a>';openModal()}
function jumpLatest(){document.getElementById('frozen').scrollIntoView({behavior:'smooth'})}
async function load(){try{const [s,d]=await Promise.all([api('/api/datasets/summary'),api('/api/datasets')]);summaryData=s;document.getElementById('summary').innerHTML=`<button class="bigBtn" onclick="openApproved()">${s.approved_master_pool}</button><div class="muted">累计可用图片 · 点击查看</div><div class="species"><button class="pill pillBtn good" onclick="openApproved()">本轮新增通过 ${s.new_approved_since_latest_dataset}</button><button class="pill pillBtn" onclick="openCatalog('active','已启用鱼种')">已启用鱼种 ${s.active_species}</button><button class="pill pillBtn warn" onclick="openCatalog('candidate','候选鱼种')">候选鱼种 ${s.candidate_species}</button><button class="pill pillBtn" onclick="jumpLatest()">最新版本 ${esc(s.latest_dataset||'暂无')}</button></div><div class="species" style="margin-top:14px">${(s.approved_species||[]).map(x=>`<button class="pill pillBtn" onclick='openApproved(${JSON.stringify(x.species)})'>${esc(x.species)} ${x.count}</button>`).join('')}</div>`;if(!document.getElementById('parent').value&&s.latest_dataset)document.getElementById('parent').placeholder=`自动继承：${s.latest_dataset}`;document.getElementById('datasets').innerHTML=d.map(x=>`<tr><td><b>${esc(x.dataset_version)}</b></td><td>${esc(x.parent_version||'-')}</td><td>${x.species_count}</td><td>${x.train_count}</td><td>${x.val_count}</td><td>${x.test_count}</td><td><span class="pill">${esc(modeName(x.selection_mode))}</span></td><td><span class="pill good">${esc(datasetStatus(x.status))}</span></td></tr>`).join('')||'<tr><td colspan="8" class="muted">还没有冻结任何数据集版本</td></tr>'}catch(e){msg(e.message,true)}}
async function freeze(){const payload={dataset_version:document.getElementById('version').value.trim(),parent_version:document.getElementById('parent').value.trim()||null,git_commit:document.getElementById('git').value.trim()||'unknown',seed:Number(document.getElementById('seed').value),train:Number(document.getElementById('train').value),val:Number(document.getElementById('val').value)};document.body.classList.add('spinner');msg('正在冻结累计可用数据快照 …');try{const d=await api('/api/datasets/freeze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});msg(`数据集已冻结：${d.dataset_version}\n图片数量：${d.image_count}\n鱼种数量：${d.species_count}\n训练 / 验证 / 测试：${d.split_counts?.train||0} / ${d.split_counts?.val||0} / ${d.split_counts?.test||0}`);await load()}catch(e){msg(e.message,true)}finally{document.body.classList.remove('spinner')}}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});load();
</script>
</body>
</html>
