<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>鱼种管理 · 渔见 AI</title>
  <style>
    body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f6f7f8;color:#171717}header{background:#fff;border-bottom:1px solid #e5e7eb;padding:14px 24px;display:flex;gap:22px;align-items:center;position:sticky;top:0;z-index:3}header a{text-decoration:none;color:#111827;font-weight:650}main{max-width:1180px;margin:0 auto;padding:24px}.muted{color:#6b7280}.section{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px;margin-top:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row{display:grid;grid-template-columns:140px 1fr;gap:10px;align-items:center;margin:9px 0}input,button,select,textarea{font:inherit;border:1px solid #d1d5db;border-radius:8px;padding:9px;background:#fff}textarea{min-height:70px}button{cursor:pointer;font-weight:650}.primary{background:#111827;color:#fff}.pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#f3f4f6;font-size:12px}.active{background:#ecfdf5}.candidate{background:#fff7ed}.retired{background:#f3f4f6}.filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.filters button.selected{background:#111827;color:#fff}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #eee;font-size:13px}th{color:#6b7280}.banner{display:none;white-space:pre-wrap;padding:12px;border-radius:10px;background:#eef2ff;margin-top:12px}@media(max-width:850px){.grid{grid-template-columns:1fr}.section{overflow:auto}}
  </style>
</head>
<body>
<header><a href="/">总览</a><a href="/batches">数据批次</a><a href="/review">人工审核</a><a href="/species">鱼种管理</a><a href="/feedback">用户反馈</a><a href="/datasets">数据集</a></header>
<main>
  <h1>鱼种管理</h1><div class="muted">鱼种是长期资产。新鱼种先作为候选，确认后再启用；历史数据集里的类别映射不会被破坏。</div>
  <div class="filters"><button id="f-all" onclick="setFilter('')">全部</button><button id="f-active" onclick="setFilter('active')">已启用</button><button id="f-candidate" onclick="setFilter('candidate')">候选</button><button id="f-retired" onclick="setFilter('retired')">已停用</button></div>
  <div id="banner" class="banner"></div>
  <div class="grid">
    <div class="section"><h2>新增候选鱼种</h2><div class="row"><label>中文名</label><input id="zh" placeholder="例如：翘嘴"></div><div class="row"><label>鱼种标识</label><input id="key" placeholder="可留空自动生成"></div><div class="row"><label>英文名</label><input id="en"></div><div class="row"><label>学名</label><input id="scientific"></div><div class="row"><label>备注</label><textarea id="notes"></textarea></div><button class="primary" onclick="createSpecies()">加入候选鱼种</button></div>
    <div class="section"><h2>状态说明</h2><p><b>候选</b>：审核时可以选择为真实鱼种，但暂不进入训练数据集。</p><p><b>已启用</b>：有审核通过样本后，下一版累计数据集自动纳入。</p><p><b>已停用</b>：历史记录保留，但后续数据集不再新增该鱼种样本。</p><p class="muted">每个数据集会冻结自己的类别映射文件，因此扩展鱼种不会破坏历史模型。</p></div>
  </div>
  <div class="section"><h2>鱼种目录</h2><table><thead><tr><th>#</th><th>中文名</th><th>鱼种标识</th><th>英文名 / 学名</th><th>状态</th><th>操作</th></tr></thead><tbody id="table"></tbody></table></div>
</main>
<script>
let currentFilter=new URLSearchParams(location.search).get('status')||'';
function esc(v){return (v??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function msg(t,err=false){const b=document.getElementById('banner');b.style.display='block';b.style.background=err?'#fff1f2':'#eef2ff';b.textContent=t}
async function api(url,opts){const r=await fetch(url,opts);const t=await r.text();let d;try{d=JSON.parse(t)}catch{d=t}if(!r.ok)throw new Error(d.detail||t);return d}
function statusName(v){return ({candidate:'候选',active:'已启用',retired:'已停用'})[v]||v}function statusClass(v){return v}
function setFilter(v){currentFilter=v;history.replaceState(null,'','/species'+(v?'?status='+encodeURIComponent(v):''));load().catch(e=>msg(e.message,true))}
async function load(){for(const id of ['all','active','candidate','retired'])document.getElementById('f-'+id).classList.toggle('selected',(id==='all'&&!currentFilter)||id===currentFilter);const d=await api('/api/species'+(currentFilter?'?status='+encodeURIComponent(currentFilter):''));document.getElementById('table').innerHTML=d.map(x=>`<tr><td>${x.catalog_order}</td><td><b>${esc(x.common_name_zh)}</b>${x.is_other?' <span class="pill">其他鱼类</span>':''}</td><td>${esc(x.species_key)}</td><td>${esc(x.common_name_en||'-')}<br><span class="muted">${esc(x.scientific_name||'')}</span></td><td><span class="pill ${statusClass(x.status)}">${esc(statusName(x.status))}</span></td><td><select id="s-${esc(x.species_key)}"><option value="candidate" ${x.status==='candidate'?'selected':''}>候选</option><option value="active" ${x.status==='active'?'selected':''}>已启用</option><option value="retired" ${x.status==='retired'?'selected':''}>已停用</option></select> <button onclick="setStatus('${esc(x.species_key)}')">更新</button></td></tr>`).join('')||'<tr><td colspan="6" class="muted">当前筛选下没有鱼种。</td></tr>'}
async function createSpecies(){const payload={common_name_zh:document.getElementById('zh').value.trim(),species_key:document.getElementById('key').value.trim()||null,common_name_en:document.getElementById('en').value.trim()||null,scientific_name:document.getElementById('scientific').value.trim()||null,notes:document.getElementById('notes').value.trim()||null};try{const d=await api('/api/species',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});msg(`已加入候选鱼种：${d.common_name_zh}`);await load()}catch(e){msg(e.message,true)}}
async function setStatus(key){try{const d=await api(`/api/species/${encodeURIComponent(key)}/status`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:document.getElementById('s-'+key).value})});msg(`${d.common_name_zh} → ${statusName(d.status)}`);await load()}catch(e){msg(e.message,true)}}
load().catch(e=>msg(e.message,true));
</script>
</body>
</html>
