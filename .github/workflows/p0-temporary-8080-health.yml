name: P0 Temporary 8080 Health Probe

on:
  push:
    branches:
      - p0-8080-probe-20260913
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shape-guided:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run fixed Shape Guided case
        shell: bash
        run: |
          set +e
          curl -sS --connect-timeout 10 --max-time 900 \
            -H 'Content-Type: application/json' \
            -w '\nHTTP_STATUS=%{http_code}\nCONNECT=%{time_connect}\nTOTAL=%{time_total}\n' \
            -X POST \
            --data '{"dataset_version":"DS_M1_v0.7","dataset_item_id":5098,"fitting_degrees":[0.6,0.8,0.95]}' \
            https://yujian-model-factory-console-6254hdioya-de.a.run.app/api/debug/powerpaint-shape-guided-lab/run
          CURL_RC=$?
          echo "CURL_RC=${CURL_RC}"
          exit 0
