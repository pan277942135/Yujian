name: Publish Detector Android Bundle

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Production Detector Runtime
    types:
      - completed

permissions:
  contents: write
  id-token: write

env:
  PROJECT_ID: gemini-api-project-503706
  WIF_PROVIDER: projects/571785698442/locations/global/workloadIdentityPools/github-actions/providers/yujian-main
  DEPLOY_SERVICE_ACCOUNT: yujian-github-deployer@gemini-api-project-503706.iam.gserviceaccount.com
  BUCKET: yujian-model-factory-571785698442
  DETECTOR_MODEL_VERSION: DET_FISH_v0.1
  DETECTOR_RELEASE_TAG: detector-model-v0.1

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: google-github-actions/auth@v3.0.0
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
      - name: Install GCS bundle runtime
        run: python -m pip install google-cloud-storage
      - name: Build byte-verified DET_FISH Android bundle
        run: |
          python scripts/build_detector_android_release_bundle.py \
            --bucket "$BUCKET" \
            --model-version "$DETECTOR_MODEL_VERSION" \
            --output det_fish_v0_1_android_bundle.zip
      - name: Publish detector bundle under the existing mobile-model convention
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.DETECTOR_RELEASE_TAG }}
          name: DET_FISH_v0.1 Android bundle
          body: Verified mirror of gs://yujian-model-factory-571785698442/models/DET_FISH_v0.1 for Android ONNX Runtime.
          files: det_fish_v0_1_android_bundle.zip
          overwrite_files: true
