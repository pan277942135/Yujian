name: Fish Completion Worker Build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/fish-completion-lab-v0.1
    paths:
      - workers/fish_completion_worker/**

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: gemini-api-project-503706
  REGION: asia-east1
  WIF_PROVIDER: projects/571785698442/locations/global/workloadIdentityPools/github-actions/providers/yujian-main
  DEPLOY_SERVICE_ACCOUNT: yujian-github-deployer@gemini-api-project-503706.iam.gserviceaccount.com
  IMAGE: asia-east1-docker.pkg.dev/gemini-api-project-503706/yujian/fish-completion-worker:${{ github.sha }}
  POWERPAINT_COMMIT: 5b4c3d52291709fcec2a1870d987da693fd3549c

jobs:
  docker-build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud with GitHub OIDC/WIF
        uses: google-github-actions/auth@v3.0.0
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3.0.1
        with:
          project_id: ${{ env.PROJECT_ID }}
          version: ">= 416.0.0"

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build Worker image
        run: |
          set -euo pipefail
          docker build \
            --file workers/fish_completion_worker/Dockerfile \
            --tag "${IMAGE}" \
            workers/fish_completion_worker

      - name: Verify cached_download compatibility
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python3 "${IMAGE}" -c "from huggingface_hub import cached_download; print('cached_download: PASS')"

      - name: Verify frozen PowerPaint runtime
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python3 "${IMAGE}" -c "import torch, diffusers, transformers; assert torch.__version__ == '2.5.1+cu124', torch.__version__; assert torch.version.cuda == '12.4', torch.version.cuda; assert diffusers.__version__ == '0.27.0', diffusers.__version__; assert transformers.__version__ == '4.28.0', transformers.__version__; print('torch=' + torch.__version__); print('torch_cuda=' + str(torch.version.cuda)); print('diffusers=' + diffusers.__version__); print('transformers=' + transformers.__version__); print('Runtime freeze validation: PASS')"
          docker run --rm --entrypoint sh "${IMAGE}" -c "test \"$(cat /worker/POWERPAINT_COMMIT)\" = \"${POWERPAINT_COMMIT}\""

      - name: Push Worker image
        run: |
          set -euo pipefail
          docker push "${IMAGE}"
