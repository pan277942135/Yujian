<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>单张审核 · 渔见 AI</title>
  <style>
    body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f6f7f8;color:#171717}header{background:#fff;border-bottom:1px solid #e5e7eb;padding:12px 22px;display:flex;gap:18px;align-items:center;position:sticky;top:0;z-index:4}header a{text-decoration:none;color:#111827;font-weight:650}.filters{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto}select,input,button,textarea{font:inherit;border:1px solid #d1d5db;border-radius:8px;padding:8px;background:#fff}button{cursor:pointer;font-weight:650}main{max-width:1250px;margin:0 auto;padding:20px}.summary{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.pill{padding:5px 9px;border-radius:999px;background:#fff;border:1px solid #e5e7eb;font-size:12px}.workspace{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(340px,.75fr);gap:16px}.panel{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:16px}.photo{width:100%;height:68vh;object-fit:contain;background:#111;border-radius:10px}.meta{display:grid;grid-template-columns:110px 1fr;gap:10px;font-size:13px;align-items:center}.label{color:#6b7280}.notes{width:100%;box-sizing:border-box;min-height:88px;margin-top:14px}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}.actions button{padding:12px}.ok{background:#111827;color:#fff}.danger{background:#fff1f2}.pending{background:#fff7ed}.skip{width:100%;margin-top:8px}.empty{text-align:center;padding:100px 20px;color:#6b7280}.hint{font-size:12px;color:#6b7280;margin-top:10px}.source{word-break:break-all}.candidateMark{color:#b45309;font-size:12px;margin-top:5px}.presenceGood{color:#047857;font-weight:700}.presenceBad{color:#be123c;font-weight:700}.presencePending{color:#b45309;font-weight:700}@media(max-width:980px){header{align-items:flex-start;flex-wrap:wrap}.filters{margin-left:0}.workspace{grid-template-columns:1fr}.photo{height:48vh}}
  </style>
</head>
<body>
<header class="app-nav"><a href="/">总览</a><a href="/batches">数据批次</a><a href="/review/bulk">快速审核</a><a href="/review">单张审核</a><a href="/species">鱼种管理</a><a href="/feedback">用户反馈</a><a href="/datasets">数据集</a><div class="filters"><select id="status"><option value="pending">待定</option><option value="approved">通过</option><option value="rejected">不通过</option><option value="">全部</option></select><select id="batch"><option value="">全部批次</option></select><select id="species"><option value="">全部真实鱼种</option><option value="未确认真实鱼种">未确认真实鱼种</option></select><input id="q" placeholder="图片 ID / 来源"><button onclick="applyFilters()">筛选</button></div></header>
<style id="yujian-mobile-ux">
  html{overflow-x:hidden}
  body{min-width:0}
  main{min-width:0;width:100%;box-sizing:border-box}
  header.app-nav{box-sizing:border-box}
  header.app-nav{overflow:visible!important;white-space:normal!important;flex-wrap:wrap!important;align-items:center!important}
  header.app-nav .nav-toggle{display:none;border:0;background:transparent;color:#111827;font:inherit;font-weight:750;cursor:pointer;align-items:center;gap:8px;padding:0;min-height:44px}
  header.app-nav .nav-toggle:focus-visible{outline:2px solid #2563eb;outline-offset:2px}
  header.app-nav .nav-icon{font-size:22px;line-height:1}
  header.app-nav .nav-links{display:flex;align-items:center;gap:6px;flex:1 1 auto;min-width:0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin}
  header.app-nav .nav-links a{flex:0 0 auto}
  header.app-nav .filters{flex:0 0 auto}
  img{max-width:100%}
  input,select,textarea{max-width:100%}
  @media(max-width:768px){
    header.app-nav{padding:8px 16px!important;gap:0!important;overflow:visible!important}
    header.app-nav .nav-toggle{display:flex;order:0}
    header.app-nav .nav-links{display:none;order:2;flex-basis:100%;width:100%;flex-direction:column;align-items:stretch;gap:4px;padding:8px 0 4px;overflow:visible}
    header.app-nav .nav-links.open{display:flex}
    header.app-nav .nav-links a{width:100%;min-height:44px;padding:0 12px;justify-content:flex-start}
    header.app-nav .filters{order:3;width:100%;margin:8px 0 0!important;display:grid!important;grid-template-columns:1fr;gap:8px;align-items:stretch}
    header.app-nav .filters>*{width:100%!important;min-height:44px;box-sizing:border-box}
    main{max-width:100%!important;padding:12px 16px!important}
    h1{font-size:26px;line-height:1.2}
    h2{font-size:20px;line-height:1.3}
    .top{align-items:stretch!important;flex-direction:column}
    .section,.panel,.card{max-width:100%;box-sizing:border-box}
    .section{padding:14px!important}
    .actions{display:flex;flex-direction:column;align-items:stretch;gap:8px}
    .actions>*{width:100%;box-sizing:border-box}
    .actions>button,.actions>.button,.primary,.prepare,.top>button,main>button,.uploadBox button,.skip,.footer button{width:100%;min-height:44px;box-sizing:border-box}
    .footer{display:flex;flex-direction:column;align-items:stretch;gap:8px}
    .footer>*{width:100%;text-align:center;box-sizing:border-box}
    .summary{display:grid!important;grid-template-columns:1fr 1fr!important;gap:8px!important}
    .summary .pill{min-height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
    .cards{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important}
    .workflow{grid-template-columns:1fr!important}
    .grid{grid-template-columns:1fr!important}
    .metrics,.metricGrid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important}
    .metric{min-width:0;padding:10px!important}
    .row{grid-template-columns:1fr!important;gap:6px!important}
    main input:not([type="checkbox"]):not([type="radio]),main select,main textarea{width:100%;min-height:44px;box-sizing:border-box}
    input[type="file"]{min-height:44px}
    .toolbar{display:grid!important;grid-template-columns:1fr!important;gap:8px!important;align-items:stretch}
    .toolbar>*{width:100%;min-height:44px;box-sizing:border-box}
    .toolbar .spacer{display:none}
    .filters{display:grid;grid-template-columns:1fr;gap:8px}
    .filters>*{width:100%;min-height:44px;box-sizing:border-box}
    .stateBtns{grid-template-columns:1fr!important;gap:8px!important}
    .stateBtns button{min-height:44px!important}
    .speciesTabs{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px!important}
    .speciesTabs button{min-height:44px}
    .bulkSpecies{display:flex;flex-direction:column;align-items:stretch;padding:8px 0 0;border-left:0;border-top:1px solid #e5e7eb}
    .bulkSpecies>*{width:100%;min-height:44px;box-sizing:border-box}
    .tabs{display:grid!important;grid-template-columns:1fr 1fr;gap:8px!important}
    .tabs .tab{min-height:44px}
    .photo{height:auto!important;max-height:58vh;min-height:220px}
    .previewBox{min-height:200px}
    .heroPrediction b{font-size:26px}
    .topRow{grid-template-columns:minmax(70px,1fr) minmax(0,2fr) 60px}
    .top3mini{white-space:normal;max-width:none;overflow:visible}
    .tableWrap{overflow:visible!important;border:0!important}
    table[data-card-labels]{display:block;width:100%;min-width:0!important;border-collapse:separate;border-spacing:0}
    table[data-card-labels] thead{display:none}
    table[data-card-labels] tbody,table[data-card-labels] tr,table[data-card-labels] td{display:block;width:100%;box-sizing:border-box}
    table[data-card-labels] tr{margin:0 0 12px;padding:6px 10px;border:1px solid #e5e7eb;border-radius:12px;background:#fff;box-shadow:0 1px 2px rgba(15,23,42,.04)}
    table[data-card-labels] tr:last-child{margin-bottom:0}
    table[data-card-labels] td{display:grid;grid-template-columns:minmax(80px,34%) minmax(0,1fr);gap:8px;align-items:start;border:0!important;padding:8px 0!important;min-width:0!important;font-size:13px;line-height:1.45;overflow-wrap:anywhere}
    table[data-card-labels] td::before{content:attr(data-label);color:#6b7280;font-size:12px;font-weight:650;line-height:1.4}
    table[data-card-labels] td[colspan]{display:block;text-align:center}
    table[data-card-labels] td[colspan]::before{display:none}
    table[data-card-labels] td>input,table[data-card-labels] td>select,table[data-card-labels] td>textarea{width:100%!important;min-height:44px;box-sizing:border-box}
    table[data-card-labels] td .actions{display:flex;flex-direction:column;align-items:stretch;gap:8px}
    table[data-card-labels] td .actions>*{width:100%;min-height:44px;box-sizing:border-box}
    table[data-card-labels] td .audit,table[data-card-labels] td .presence,table[data-card-labels] td .dedupe{display:flex;flex-direction:column;align-items:stretch;gap:6px;min-width:0}
    table[data-card-labels] td .pill{display:flex;align-items:center;min-height:32px;box-sizing:border-box}
    table[data-card-labels] td .numBtn{font-size:inherit;text-align:left;padding:0;min-height:32px}
    table[data-card-labels] td .reviewLink{display:block;padding:10px;border:1px solid #d1d5db;border-radius:8px;text-align:center}
    table[data-card-labels] td .uri{max-width:none}
    .matrixWrap,.diag{max-width:100%;overflow:auto!important}
  }
</style>
<script>
(function(){
  function decorateTables(){
    document.querySelectorAll('table[data-card-labels]').forEach(function(table){
      const labels=(table.dataset.cardLabels||'').split('|');
      table.querySelectorAll('tbody tr').forEach(function(row){
        Array.from(row.cells).forEach(function(cell,index){
          if(cell.colSpan>1){cell.removeAttribute('data-label');return}
          if(labels[index])cell.setAttribute('data-label',labels[index]);
        });
      });
    });
  }
  function initNav(){
    const header=document.querySelector('header.app-nav');
    if(!header)return;
    if(!header.dataset.mobileReady){
      const links=Array.from(header.children).filter(function(el){return el.tagName==='A'});
      const controls=Array.from(header.children).filter(function(el){return el.tagName!=='A'});
      const nav=document.createElement('nav');
      nav.className='nav-links';
      nav.id='yujian-primary-nav';
      nav.setAttribute('aria-label','主导航');
      links.forEach(function(link){nav.appendChild(link)});
      const toggle=document.createElement('button');
      toggle.type='button';
      toggle.className='nav-toggle';
      toggle.setAttribute('aria-expanded','false');
      toggle.setAttribute('aria-controls',nav.id);
      toggle.innerHTML='<span class="nav-icon" aria-hidden="true">☰</span><span>渔见 AI Console</span>';
      header.insertBefore(toggle,header.firstChild);
      header.insertBefore(nav,controls[0]||null);
      toggle.addEventListener('click',function(){
        const open=nav.classList.toggle('open');
        toggle.setAttribute('aria-expanded',String(open));
      });
      nav.addEventListener('click',function(event){
        if(event.target.closest('a')){
          nav.classList.remove('open');
          toggle.setAttribute('aria-expanded','false');
        }
      });
      document.addEventListener('click',function(event){
        if(!header.contains(event.target)){
          nav.classList.remove('open');
          toggle.setAttribute('aria-expanded','false');
        }
      });
      header.dataset.mobileReady='true';
    }
    decorateTables();
    if(!window.__yujianMobileObserver){
      const observer=new MutationObserver(decorateTables);
      observer.observe(document.body,{childList:true,subtree:true});
      window.__yujianMobileObserver=observer;
    }
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',initNav,{once:true});else initNav();
})();
</script>
<main><div class="summary" id="summary"></div><div id="content"></div></main>
<script>
let catalog=[],current=null,offset=0,currentBackendStatus='pending';
function esc(v){return (v??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function api(url,opts){const r=await fetch(url,opts);const t=await r.text();let d;try{d=JSON.parse(t)}catch{d=t}if(!r.ok)throw new Error(d.detail||t);return d}
function baseParams(){const p=new URLSearchParams();for(const id of ['batch','species','q']){const v=document.getElementById(id).value.trim();if(v)p.set(id==='batch'?'batch_id':id,v)}return p}
function speciesOptions(selected){const current=catalog.find(x=>x.common_name_zh===selected);const historical=current?.status==='retired'?`<option value="${esc(selected)}" selected>${esc(selected)} · 已停用（历史保留）</option>`:'';return `<option value="" ${!selected?'selected':''}>未确认真实鱼种</option>`+historical+catalog.filter(x=>x.status!=='retired').map(x=>`<option value="${esc(x.common_name_zh)}" ${x.common_name_zh===selected?'selected':''}>${esc(x.common_name_zh)}${x.status==='candidate'?' · 候选鱼种':''}</option>`).join('')}
function sourceName(v){return ({pilot:'种子集',doubao:'豆包',app_feedback:'用户反馈',workbuddy:'WorkBuddy',other:'其他'})[v]||v||'-'}
function statusName(v){if(v==='approved')return '通过';if(v==='rejected')return '不通过';return '待定'}
function presenceName(v){return ({single_fish:'单鱼',multi_fish:'多鱼',no_fish:'无鱼',uncertain:'不确定',error:'检测失败',not_scanned:'未检测'})[v]||'未检测'}
function presenceClass(v){if(v==='single_fish')return 'presenceGood';if(v==='no_fish')return 'presenceBad';return 'presencePending'}
async function init(){
  const [batches,speciesCatalog]=await Promise.all([api('/api/batches'),api('/api/species')]);catalog=speciesCatalog;
  document.getElementById('species').innerHTML+=catalog.map(x=>`<option value="${esc(x.common_name_zh)}">${esc(x.common_name_zh)}${x.status==='candidate'?' · 候选鱼种':''}</option>`).join('');
  document.getElementById('batch').innerHTML+=batches.map(x=>`<option value="${esc(x.batch_id)}">${esc(x.batch_id)} · ${sourceName(x.source)}</option>`).join('');
  const u=new URLSearchParams(location.search);if(u.get('batch'))document.getElementById('batch').value=u.get('batch');if(u.get('status'))document.getElementById('status').value=u.get('status');if(u.get('species'))document.getElementById('species').value=u.get('species');
  await load();
}
async function fetchOne(status){const p=baseParams();if(status)p.set('status',status);p.set('limit','1');p.set('offset',offset);return api('/api/review?'+p)}
async function load(){
  const selected=document.getElementById('status').value;const statParams=baseParams();const stats=await api('/api/review/stats?'+statParams);const fly=await api('/api/flywheel/summary');const s=stats.status||{};const pendingTotal=(s.pending||0)+(s.needs_review||0)+(s.hard_case||0);document.getElementById('summary').innerHTML=`<span class="pill">通过 ${s.approved||0}</span><span class="pill">待定 ${pendingTotal}</span><span class="pill">不通过 ${s.rejected||0}</span><span class="pill">累计可用 ${fly.approved_master_pool}</span>`;
  let items=[];currentBackendStatus=selected||'';
  if(selected==='pending'){for(const legacyStatus of ['pending','needs_review','hard_case']){items=await fetchOne(legacyStatus);if(items.length){currentBackendStatus=legacyStatus;break}}}else{items=await fetchOne(selected)}
  current=items[0]||null;render();if(current)await showPresence();
}
function render(){const c=document.getElementById('content');if(!current){c.innerHTML='<div class="panel empty">当前筛选条件已经没有图片。可以切换状态、批次或鱼种。</div>';return}const x=current;const selected=x.truth_species||'';const selectedCatalog=catalog.find(s=>s.common_name_zh===selected);c.innerHTML=`<div class="workspace"><div class="panel"><img class="photo" src="${x.media_url}" alt="${esc(x.image_id)}"></div><div class="panel"><div class="meta"><div class="label">图片 ID</div><div><b>${esc(x.image_id)}</b></div><div class="label">批次</div><div>${esc(x.batch_id)}</div><div class="label">鱼体检测</div><div id="presenceInfo" class="muted">读取中…</div><div class="label">采集标注</div><div>${esc(x.claimed_species||'-')}</div><div class="label">真实鱼种</div><div><select id="truthSpecies">${speciesOptions(selected)}</select>${selectedCatalog?.status==='candidate'?'<div class="candidateMark">候选鱼种暂不进入训练集。</div>':''}</div><div class="label">当前审核状态</div><div><b>${statusName(x.review_status)}</b></div><div class="label">场景 / 质量</div><div>${esc(x.scene||'-')} / ${esc(x.quality||'-')}</div><div class="label">来源</div><div class="source">${x.source_url?`<a target="_blank" href="${esc(x.source_url)}">${esc(x.source_platform||'查看原始来源')}</a>`:'-'}</div></div><textarea class="notes" id="notes" placeholder="备注（可选）">${esc(x.notes||'')}</textarea><div class="actions"><button class="ok" onclick="save('approved')">A · 通过</button><button class="danger" onclick="save('rejected')">R · 不通过</button><button class="pending" onclick="save('pending')">D · 待定</button></div><button class="skip" onclick="skip()">→ 跳过</button><div class="hint">采集标注仅供参考，不会自动成为真实鱼种。点击“通过”前必须明确确认真实鱼种。</div></div></div>`}
async function showPresence(){const el=document.getElementById('presenceInfo');if(!el||!current)return;try{const p=await api(`/api/presence/image/${encodeURIComponent(current.batch_id)}/${encodeURIComponent(current.image_id)}`);el.className=presenceClass(p.status);let detail=presenceName(p.status);if(p.status!=='not_scanned'&&p.status!=='error')detail+=` · 置信 ${Math.round((p.fish_score||0)*100)}%`;if((p.fish_count||0)>0)detail+=` · ${p.fish_count}条`;el.textContent=detail}catch(e){el.className='muted';el.textContent='未检测'}}
async function save(status){if(!current)return;const selected=document.getElementById('status').value;const truth=document.getElementById('truthSpecies').value;if(status==='approved'&&!truth){alert('通过前必须确认真实鱼种');return}const payload={review_status:status,truth_species:truth,notes:document.getElementById('notes').value,reviewer:'网页审核'};try{await api(`/api/review/${encodeURIComponent(current.batch_id)}/${encodeURIComponent(current.image_id)}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const staysInCurrentFilter=!selected||selected===status||(selected==='pending'&&status==='pending');if(staysInCurrentFilter)offset++;await load()}catch(e){alert(e.message)}}
function skip(){offset++;load().catch(e=>alert(e.message))}function applyFilters(){offset=0;load().catch(e=>alert(e.message))}
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if(e.key.toLowerCase()==='a')save('approved');else if(e.key.toLowerCase()==='r')save('rejected');else if(e.key.toLowerCase()==='d')save('pending');else if(e.key==='ArrowRight')skip()});
init().catch(e=>document.getElementById('content').innerHTML=`<div class="panel empty">${esc(e.message)}</div>`);
</script>
</body>
