<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>数据批次 · 渔见 AI</title>
  <style>
    body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f6f7f8;color:#171717}header{background:#fff;border-bottom:1px solid #e5e7eb;padding:14px 24px;display:flex;gap:22px;align-items:center;position:sticky;top:0;z-index:3}header a{text-decoration:none;color:#111827;font-weight:650}main{max-width:1220px;margin:0 auto;padding:24px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-end}.muted{color:#6b7280}.section{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px;margin-top:18px}table{width:100%;border-collapse:collapse}th,td{padding:10px 8px;border-bottom:1px solid #eee;text-align:left;font-size:13px;vertical-align:top}th{color:#6b7280}input,select,button{font:inherit;border:1px solid #d1d5db;border-radius:8px;padding:8px;background:white}input{width:220px}button{cursor:pointer;font-weight:650}.soft{background:#f3f4f6}.prepare{background:#0f172a;color:#fff;border-color:#0f172a}.pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#f3f4f6;font-size:12px}.ok{background:#ecfdf5}.warn{background:#fff7ed}.bad{background:#fff1f2}.actions{display:flex;gap:6px;flex-wrap:wrap}.audit{display:flex;gap:5px;flex-wrap:wrap}.banner{display:none;margin-top:16px;padding:12px 14px;border-radius:10px;background:#eef2ff;white-space:pre-wrap}.spinner{opacity:.6;pointer-events:none}.reviewLink{font-weight:650;text-decoration:none;color:#111827}@media(max-width:900px){.section{overflow:auto}input{width:170px}}
  </style>
</head>
<body>
<header><a href="/">总览</a><a href="/batches">数据批次</a><a href="/review">人工审核</a><a href="/species">鱼种管理</a><a href="/feedback">用户反馈</a><a href="/datasets">数据集</a></header>
<main>
  <div class="top"><div><h1>数据批次</h1><div class="muted">上传落地区 → 自动检查 → 正式入库 → 数据登记。日常只需确认正式批次 ID 和来源后点击“准备审核”。</div></div><button onclick="loadAll()">刷新</button></div>
  <div id="banner" class="banner"></div>
  <div class="section"><h2>待处理上传数据</h2><div class="muted">上传文件夹只是临时落地区；正式批次 ID 才是长期追溯 ID。历史命名不准确时无需移动云端文件。</div><table><thead><tr><th>上传文件夹</th><th>图片 / 清单</th><th>自动检查</th><th>正式批次 ID</th><th>来源</th><th>状态</th><th>操作</th></tr></thead><tbody id="incoming"></tbody></table></div>
  <div class="section"><h2>已登记批次</h2><table><thead><tr><th>批次</th><th>来源</th><th>图片</th><th>通过</th><th>待定</th><th>不通过</th><th>状态 / 下一步</th></tr></thead><tbody id="registered"></tbody></table></div>
</main>
<script>
function esc(v){return (v??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function msg(text,isError=false){const b=document.getElementById('banner');b.style.display='block';b.style.background=isError?'#fff1f2':'#eef2ff';b.textContent=text}function setBusy(on){document.body.classList.toggle('spinner',on)}async function api(url,opts){const r=await fetch(url,opts);const text=await r.text();let data;try{data=JSON.parse(text)}catch{data=text}if(!r.ok)throw new Error(data.detail||text||r.statusText);return data}function values(i,prefix){const batch=document.getElementById('batch-'+i).value.trim();const source=document.getElementById('source-'+i).value;if(!batch||!source)throw new Error('请先确认正式批次 ID 和来源');return {incoming_prefix:prefix,batch_id:batch,source}}
function sourceName(v){return ({pilot:'种子集',doubao:'豆包',app_feedback:'用户反馈',workbuddy:'WorkBuddy',other:'其他'})[v]||v||'-'}function batchStatus(v){return ({REGISTERED:'已登记',INGESTED:'已入库'})[v]||v||'-'}
async function loadAll(){try{const [incoming,registered]=await Promise.all([api('/api/incoming'),api('/api/batches')]);document.getElementById('incoming').innerHTML=incoming.map((x,i)=>{const a=x.audit||{},s=a.status_counts||{};return `<tr><td><b>${esc(x.folder)}</b><br><span class="muted">${esc(x.incoming_prefix)}</span></td><td>${x.image_count} / ${x.manifest_count}</td><td>${a.batch_id?`<div class="audit"><span class="pill ok">候选 ${s.CANDIDATE||0}</span><span class="pill warn">待定 ${s.NEEDS_REVIEW||0}</span><span class="pill bad">剔除 ${s.AUTO_REJECT||0}</span></div>`:'<span class="muted">未检查</span>'}</td><td><input id="batch-${i}" value="${esc(x.canonical_batch_id)}"></td><td><select id="source-${i}"><option value="">选择来源</option><option value="pilot" ${x.source==='pilot'?'selected':''}>种子集</option><option value="doubao" ${x.source==='doubao'?'selected':''}>豆包</option><option value="app_feedback" ${x.source==='app_feedback'?'selected':''}>用户反馈</option><option value="workbuddy" ${x.source==='workbuddy'?'selected':''}>WorkBuddy</option><option value="other" ${x.source==='other'?'selected':''}>其他</option></select></td><td>${x.promoted?'<span class="pill ok">已入库</span>':'<span class="pill">待入库</span>'}</td><td><div class="actions"><button class="prepare" onclick="prepare(${i},'${esc(x.incoming_prefix)}')">准备审核</button><button class="soft" onclick="act(${i},'audit','${esc(x.incoming_prefix)}')">仅检查</button><button onclick="act(${i},'promote','${esc(x.incoming_prefix)}')">仅入库</button><button onclick="sync(${i})">仅登记</button></div></td></tr>`}).join('')||'<tr><td colspan="7" class="muted">没有发现待处理上传数据</td></tr>';document.getElementById('registered').innerHTML=registered.map(x=>{const pending=(x.review.pending||0)+(x.review.needs_review||0)+(x.review.hard_case||0);return `<tr><td><b>${esc(x.batch_id)}</b></td><td>${esc(sourceName(x.source))}</td><td>${x.image_count}</td><td>${x.review.approved||0}</td><td>${pending}</td><td>${x.review.rejected||0}</td><td><span class="pill">${esc(batchStatus(x.status))}</span> · <a class="reviewLink" href="/review?batch=${encodeURIComponent(x.batch_id)}">进入审核 →</a></td></tr>`}).join('')||'<tr><td colspan="7" class="muted">还没有已登记批次</td></tr>'}catch(e){msg(e.message,true)}}
async function act(i,action,prefix){let payload;try{payload=values(i,prefix)}catch(e){msg(e.message,true);return}setBusy(true);msg(`${action==='audit'?'正在自动检查':'正在正式入库'} ${payload.batch_id} …`);try{const d=await api(`/api/batches/${action}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});msg(JSON.stringify(d,null,2));await loadAll()}catch(e){msg(e.message,true)}finally{setBusy(false)}}
async function sync(i){const batch=document.getElementById('batch-'+i).value.trim();if(!batch){msg('请先确认正式批次 ID',true);return}setBusy(true);msg(`正在登记 ${batch} …`);try{const d=await api('/api/batches/sync',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({batch_id:batch})});msg(JSON.stringify(d,null,2));await loadAll()}catch(e){msg(e.message,true)}finally{setBusy(false)}}
async function prepare(i,prefix){let payload;try{payload=values(i,prefix)}catch(e){msg(e.message,true);return}setBusy(true);try{msg(`1/3 自动检查 ${payload.batch_id} …`);const audit=await api('/api/batches/audit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});msg(`2/3 正式入库 ${payload.batch_id} …`);const promote=await api('/api/batches/promote',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});msg(`3/3 登记数据 ${payload.batch_id} …`);const syncResult=await api('/api/batches/sync',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({batch_id:payload.batch_id})});msg(`准备审核完成\n自动检查：候选 ${audit.status_counts?.CANDIDATE||0} / 待定 ${audit.status_counts?.NEEDS_REVIEW||0} / 剔除 ${audit.status_counts?.AUTO_REJECT||0}\n正式入库：${promote.already_exists?'已存在，直接复用':'完成'}\n数据登记：完成\n\n下一步：进入“人工审核”页面。`);await loadAll()}catch(e){msg(e.message,true)}finally{setBusy(false)}}
loadAll();
</script>
</body>
</html>
