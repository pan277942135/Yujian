<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Crop Review · 渔见 AI</title>
  <style>
    :root{color-scheme:light}body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f6f7f8;color:#171717}
    main{max-width:1500px;margin:0 auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:14px}.muted{color:#6b7280;font-size:13px}.section{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:16px;margin-top:16px}.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.controls input,.controls select,.controls button{font:inherit;border:1px solid #d1d5db;border-radius:8px;min-height:42px;padding:0 10px;background:#fff}.controls button{cursor:pointer;font-weight:700}.primary{background:#111827!important;color:#fff;border-color:#111827!important}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:16px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;overflow:hidden}.card[data-status="ACCEPTED"],.card[data-status="TRAINING_READY"]{border-color:#86efac}.images{display:grid;grid-template-columns:1.3fr .7fr;gap:8px;padding:10px;background:#f9fafb}.stage{position:relative;background:#111827;border-radius:9px;overflow:hidden;min-height:160px}.stage img{display:block;width:100%;height:auto;min-height:160px;object-fit:contain}.bbox{position:absolute;border:3px solid #f59e0b;pointer-events:none}.accepted{border-color:#22c55e}.crop-preview{min-height:160px;border-radius:9px;background:#e5e7eb;color:#6b7280;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;font-size:12px}.body{padding:13px}.title{font-weight:750;overflow-wrap:anywhere}.meta{font-size:12px;line-height:1.65;margin-top:7px}.pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:12px}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}.actions button{font:inherit;min-height:44px;border:1px solid #d1d5db;border-radius:8px;background:#fff;cursor:pointer;font-weight:700}.actions .accept{background:#166534;color:#fff;border-color:#166534}.actions .reject{background:#fff1f2;color:#9f1239}.bbox-fields{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.bbox-fields label{font-size:11px;color:#6b7280}.bbox-fields input{width:100%;box-sizing:border-box;font:inherit;min-height:38px;border:1px solid #d1d5db;border-radius:7px;padding:0 7px}.banner{display:none;white-space:pre-wrap;margin-top:12px;padding:11px;border-radius:9px;background:#fff1f2;color:#9f1239}.empty{padding:42px;color:#6b7280;text-align:center;background:#fff;border:1px dashed #d1d5db;border-radius:12px;margin-top:16px}
    @media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:680px){main{padding:12px 16px}.top{align-items:flex-start;flex-direction:column}.controls{display:grid;grid-template-columns:1fr;width:100%}.controls input,.controls select,.controls button{width:100%;box-sizing:border-box}.grid{grid-template-columns:1fr}.section{padding:14px}.images{grid-template-columns:1fr 1fr}.actions{grid-template-columns:1fr}.bbox-fields{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
<header class="app-nav"></header>
{% include "_mobile_ux.html" %}
<main>
  <div class="top"><div><h1 style="margin:0">Crop Review</h1><div class="muted">只把人工明确确认的 bbox 写入 Crop Dataset；候选框永远只是建议。</div></div><a href="/crop-datasets">返回 Crop Dataset</a></div>
  <section class="section"><div class="controls"><input id="batch" placeholder="BATCH_C70BA2D53823" /><input id="datasetVersion" placeholder="DS_M1_v0.5" /><select id="status"><option value="REVIEW_REQUIRED">待审核</option><option value="BBOX_REQUIRED">待标注 bbox</option><option value="ACCEPTED">已接受</option><option value="TRAINING_READY">训练就绪</option><option value="REJECTED">已拒绝</option><option value="ALL">全部</option></select><button class="primary" onclick="loadItems()">加载</button><span id="summary" class="muted"></span></div><div id="sourceInfo" class="muted" style="margin-top:8px"></div><div id="banner" class="banner"></div></section>
  <div id="items" class="grid"></div>
</main>
<script>
function esc(v){return (v??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function showError(text){const b=document.getElementById('banner');b.style.display='block';b.textContent=text}
function clearError(){document.getElementById('banner').style.display='none'}
async function api(url,opts){const r=await fetch(url,opts);const text=await r.text();let d;try{d=JSON.parse(text)}catch{d=text}if(!r.ok){const detail=d&&typeof d==='object'?d.detail:d;throw new Error(typeof detail==='object'?JSON.stringify(detail):detail||r.statusText)}return d}
function boxStyle(box,color){if(!box)return '';return `left:${box[0]*100}%;top:${box[1]*100}%;width:${box[2]*100}%;height:${box[3]*100}%;border-color:${color}`}
function card(item,index){const candidate=item.candidate_bbox,accepted=item.accepted_bbox||candidate||[0.1,0.1,0.8,0.8];const status=item.status||'REVIEW_REQUIRED';const frozen=Boolean(item.source_type==='FROZEN_DATASET');return `<article class="card" data-status="${esc(status)}" data-image-id="${esc(item.image_id)}"><div class="images"><div class="stage"><img src="${esc(item.media_url)}" loading="lazy" alt="${esc(item.image_id)}"/><div class="bbox" style="${boxStyle(candidate,'#f59e0b')}" title="candidate_bbox · 仅供参考"></div><div class="bbox accepted" style="${boxStyle(item.accepted_bbox,'#22c55e')}" title="accepted_bbox · human review"></div></div><div class="crop-preview">Crop Preview<br/>接受后由 Builder 从 Original 生成</div></div><div class="body"><div class="title">${esc(item.image_id)} <span class="pill">${esc(status)}</span></div><div class="meta">${frozen?'Frozen Dataset：'+esc(item.source_dataset_version):'批次：'+esc(item.batch_id)}<br/>Split：${esc(item.split||'-')} · Class：${esc(item.class_index??'-')}<br/>鱼种：${esc(item.species_name||item.suggested_species||'-')}<br/>候选框：${candidate?candidate.map(v=>Number(v).toFixed(4)).join(', '):'未检测到候选框，请人工绘制'}</div><div class="bbox-fields"><label>x<input id="x-${index}" type="number" min="0" max="1" step="0.0001" value="${accepted[0]??''}"></label><label>y<input id="y-${index}" type="number" min="0" max="1" step="0.0001" value="${accepted[1]??''}"></label><label>w<input id="w-${index}" type="number" min="0" max="1" step="0.0001" value="${accepted[2]??''}"></label><label>h<input id="h-${index}" type="number" min="0" max="1" step="0.0001" value="${accepted[3]??''}"></label></div><div class="actions"><button class="accept" onclick="decide(${index},'ACCEPTED')">接受 bbox</button><button class="accept" onclick="decide(${index},'TRAINING_READY')">标记训练就绪</button><button onclick="decide(${index},'BBOX_REQUIRED')">稍后</button><button class="reject" onclick="decide(${index},'REJECTED')">拒绝</button></div></div></article>`}
let frozen=false;
async function loadItems(){clearError();const dataset=document.getElementById('datasetVersion').value.trim();const batch=document.getElementById('batch').value.trim();frozen=Boolean(dataset);if(!frozen&&!batch){showError('请填写 Batch ID 或 Frozen Dataset 版本');return}try{const status=encodeURIComponent(frozen?(document.getElementById('status').value==='REVIEW_REQUIRED'?'BBOX_REQUIRED':document.getElementById('status').value):document.getElementById('status').value);const base=frozen?`/api/dataset-crop-review/${encodeURIComponent(dataset)}`:`/api/crop-review/${encodeURIComponent(batch)}`;const [data,summary]=await Promise.all([api(`${base}/items?status=${status}&limit=60`),api(`${base}/summary`)]);document.getElementById('sourceInfo').textContent=frozen?'来源：Frozen Dataset；鱼种、class index、split 已从父 Dataset Freeze 继承，只审核 bbox。':'来源：Raw Batch；接受时仍需确认鱼种。';document.getElementById('summary').textContent=`总数 ${summary.total_images||0} · 待审核 ${summary.bbox_required??summary.review_required??0} · 已接受 ${summary.accepted||0} · 已拒绝 ${summary.rejected||0} · 当前列表 ${data.total||0}`;document.getElementById('items').innerHTML=(data.items||[]).map(card).join('')||'<div class="empty">暂无满足条件的图片。</div>'}catch(error){showError(error.message);document.getElementById('items').innerHTML='<div class="empty">无法读取 Crop Review 队列。</div>'}}
async function decide(index,decision){const cardNode=document.querySelectorAll('.card')[index];if(!cardNode)return;const id=cardNode.dataset.imageId;const values=['x','y','w','h'].map(k=>Number(document.getElementById(`${k}-${index}`).value));const payload={decision,accepted_bbox:values};const base=frozen?`/api/dataset-crop-review/${encodeURIComponent(document.getElementById('datasetVersion').value.trim())}`:`/api/crop-review/${encodeURIComponent(document.getElementById('batch').value.trim())}`;if(!frozen&&(decision==='ACCEPTED'||decision==='TRAINING_READY')){payload.species_name=prompt('确认真实鱼种（必填；不会自动使用采集标注）','');if(!payload.species_name)return}try{await api(`${base}/${encodeURIComponent(id)}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});await loadItems()}catch(error){showError(error.message)}}
const query=new URLSearchParams(location.search);if(query.get('batch_id'))document.getElementById('batch').value=query.get('batch_id');if(query.get('dataset_version'))document.getElementById('datasetVersion').value=query.get('dataset_version');loadItems();
</script>
</body>
</html>
