<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>人工审核 · 渔见 AI</title>
  <style>
    body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f6f7f8;color:#171717}header{background:#fff;border-bottom:1px solid #e5e7eb;padding:12px 22px;display:flex;gap:18px;align-items:center;position:sticky;top:0;z-index:4}header a{text-decoration:none;color:#111827;font-weight:650}.filters{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto}select,input,button,textarea{font:inherit;border:1px solid #d1d5db;border-radius:8px;padding:8px;background:#fff}button{cursor:pointer;font-weight:650}main{max-width:1250px;margin:0 auto;padding:20px}.summary{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.pill{padding:5px 9px;border-radius:999px;background:#fff;border:1px solid #e5e7eb;font-size:12px}.workspace{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(340px,.75fr);gap:16px}.panel{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:16px}.photo{width:100%;height:68vh;object-fit:contain;background:#111;border-radius:10px}.meta{display:grid;grid-template-columns:110px 1fr;gap:10px;font-size:13px;align-items:center}.label{color:#6b7280}.notes{width:100%;box-sizing:border-box;min-height:88px;margin-top:14px}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}.actions button{padding:12px}.ok{background:#111827;color:#fff}.danger{background:#fff1f2}.pending{background:#fff7ed}.skip{width:100%;margin-top:8px}.empty{text-align:center;padding:100px 20px;color:#6b7280}.hint{font-size:12px;color:#6b7280;margin-top:10px}.source{word-break:break-all}.candidateMark{color:#b45309;font-size:12px;margin-top:5px}@media(max-width:980px){header{align-items:flex-start;flex-wrap:wrap}.filters{margin-left:0}.workspace{grid-template-columns:1fr}.photo{height:48vh}}
  </style>
</head>
<body>
<header><a href="/">总览</a><a href="/batches">数据批次</a><a href="/review">人工审核</a><a href="/species">鱼种管理</a><a href="/feedback">用户反馈</a><a href="/datasets">数据集</a><div class="filters"><select id="status"><option value="pending">待定</option><option value="approved">通过</option><option value="rejected">不通过</option><option value="">全部</option></select><select id="batch"><option value="">全部批次</option></select><select id="species"><option value="">全部鱼种</option></select><input id="q" placeholder="图片 ID / 来源"><button onclick="applyFilters()">筛选</button></div></header>
<main><div class="summary" id="summary"></div><div id="content"></div></main>
<script>
let catalog=[],current=null,offset=0,currentBackendStatus='pending';
function esc(v){return (v??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function api(url,opts){const r=await fetch(url,opts);const t=await r.text();let d;try{d=JSON.parse(t)}catch{d=t}if(!r.ok)throw new Error(d.detail||t);return d}
function baseParams(){const p=new URLSearchParams();for(const id of ['batch','species','q']){const v=document.getElementById(id).value.trim();if(v)p.set(id==='batch'?'batch_id':id,v)}return p}
function speciesOptions(selected){return catalog.filter(x=>x.status!=='retired').map(x=>`<option value="${esc(x.common_name_zh)}" ${x.common_name_zh===selected?'selected':''}>${esc(x.common_name_zh)}${x.status==='candidate'?' · 候选鱼种':''}</option>`).join('')}
function sourceName(v){return ({pilot:'种子集',doubao:'豆包',app_feedback:'用户反馈',workbuddy:'WorkBuddy',other:'其他'})[v]||v||'-'}
function statusName(v){if(v==='approved')return '通过';if(v==='rejected')return '不通过';return '待定'}
async function init(){
  const [batches,speciesCatalog]=await Promise.all([api('/api/batches'),api('/api/species')]);catalog=speciesCatalog;
  document.getElementById('species').innerHTML+=catalog.map(x=>`<option value="${esc(x.common_name_zh)}">${esc(x.common_name_zh)}${x.status==='candidate'?' · 候选鱼种':''}</option>`).join('');
  document.getElementById('batch').innerHTML+=batches.map(x=>`<option value="${esc(x.batch_id)}">${esc(x.batch_id)} · ${sourceName(x.source)}</option>`).join('');
  const u=new URLSearchParams(location.search);if(u.get('batch'))document.getElementById('batch').value=u.get('batch');if(u.get('status'))document.getElementById('status').value=u.get('status');
  await load();
}
async function fetchOne(status){const p=baseParams();if(status)p.set('status',status);p.set('limit','1');p.set('offset',offset);return api('/api/review?'+p)}
async function load(){
  const selected=document.getElementById('status').value;const statParams=baseParams();const stats=await api('/api/review/stats?'+statParams);const fly=await api('/api/flywheel/summary');const s=stats.status||{};const pendingTotal=(s.pending||0)+(s.needs_review||0)+(s.hard_case||0);document.getElementById('summary').innerHTML=`<span class="pill">通过 ${s.approved||0}</span><span class="pill">待定 ${pendingTotal}</span><span class="pill">不通过 ${s.rejected||0}</span><span class="pill">累计可用 ${fly.approved_master_pool}</span>`;
  let items=[];currentBackendStatus=selected||'';
  if(selected==='pending'){
    for(const legacyStatus of ['pending','needs_review','hard_case']){items=await fetchOne(legacyStatus);if(items.length){currentBackendStatus=legacyStatus;break}}
  }else{items=await fetchOne(selected)}
  current=items[0]||null;render();
}
function render(){const c=document.getElementById('content');if(!current){c.innerHTML='<div class="panel empty">当前筛选条件已经没有图片。可以切换状态、批次或鱼种。</div>';return}const x=current;const selected=x.truth_species||x.claimed_species||'';const selectedCatalog=catalog.find(s=>s.common_name_zh===selected);c.innerHTML=`<div class="workspace"><div class="panel"><img class="photo" src="${x.media_url}" alt="${esc(x.image_id)}"></div><div class="panel"><div class="meta"><div class="label">图片 ID</div><div><b>${esc(x.image_id)}</b></div><div class="label">批次</div><div>${esc(x.batch_id)}</div><div class="label">采集标注</div><div>${esc(x.claimed_species||'-')}</div><div class="label">真实鱼种</div><div><select id="truthSpecies">${speciesOptions(selected)}</select>${selectedCatalog?.status==='candidate'?'<div class="candidateMark">候选鱼种暂不进入训练集，激活后才会纳入后续版本。</div>':''}</div><div class="label">当前审核状态</div><div><b>${statusName(x.review_status)}</b></div><div class="label">场景 / 质量</div><div>${esc(x.scene||'-')} / ${esc(x.quality||'-')}</div><div class="label">来源</div><div class="source">${x.source_url?`<a target="_blank" href="${esc(x.source_url)}">${esc(x.source_platform||'查看原始来源')}</a>`:'-'}</div></div><textarea class="notes" id="notes" placeholder="备注（可选）">${esc(x.notes||'')}</textarea><div class="actions"><button class="ok" onclick="save('approved')">A · 通过</button><button class="danger" onclick="save('rejected')">R · 不通过</button><button class="pending" onclick="save('pending')">D · 待定</button></div><button class="skip" onclick="skip()">→ 跳过</button><div class="hint">只需要判断两件事：真实鱼种是什么，这张图能不能用。快捷键：A 通过 · R 不通过 · D 待定 · → 跳过。</div></div></div>`}
async function save(status){if(!current)return;const selected=document.getElementById('status').value;const payload={review_status:status,truth_species:document.getElementById('truthSpecies').value,notes:document.getElementById('notes').value,reviewer:'网页审核'};try{await api(`/api/review/${encodeURIComponent(current.batch_id)}/${encodeURIComponent(current.image_id)}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const staysInCurrentFilter=!selected||selected===status||(selected==='pending'&&status==='pending');if(staysInCurrentFilter)offset++;await load()}catch(e){alert(e.message)}}
function skip(){offset++;load().catch(e=>alert(e.message))}function applyFilters(){offset=0;load().catch(e=>alert(e.message))}
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if(e.key.toLowerCase()==='a')save('approved');else if(e.key.toLowerCase()==='r')save('rejected');else if(e.key.toLowerCase()==='d')save('pending');else if(e.key==='ArrowRight')skip()});
init().catch(e=>document.getElementById('content').innerHTML=`<div class="panel empty">${esc(e.message)}</div>`);
</script>
</body>
</html>
