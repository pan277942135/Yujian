<section class="panel">
  <h1>鱼种概览</h1>
  <p class="muted">先选择鱼种，再进入图片资产、五张知识卡、发布中心、扩展内容或只读历史。ACTIVE 线上版本与 DRAFT 编辑版本分开显示。</p>
  <div id="overviewSummary" class="grid"></div>
</section>
<section class="panel"><h2>管理区域</h2><div class="grid">
  <div class="tile"><h3>图片资产</h3><p class="muted">COVER_LIST、COVER_HERO、TRANSPARENT_MAIN、TRANSPARENT_ALT 与知识卡图片均按版本管理。</p></div>
  <div class="tile"><h3>五张知识卡</h3><p class="muted">每张内容草稿绑定唯一图片 version_id，结构化内容不会再按空图片行猜测。</p></div>
  <div class="tile"><h3>发布中心</h3><p class="muted">校验 GCS 对象、SHA-256、版本绑定及 QA 后，在单一事务中发布。</p></div>
  <div class="tile"><h3>历史与审计</h3><p class="muted">已发布图片、内容修订和发布校验记录保留为可追溯历史。</p></div>
</div></section>
