name: P1.1 Worker Static External IP

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/p1-1-static-ip.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: yujian-p1-1-static-ip
  cancel-in-progress: true

env:
  PROJECT_ID: gemini-api-project-503706
  VM: fish-completion-worker
  ZONE: us-central1-a
  REGION: us-central1
  EXPECTED_IP: 136.111.134.128
  STATIC_NAME: yujian-fish-completion-worker-ip
  PORT: "8080"
  WIF_PROVIDER: projects/571785698442/locations/global/workloadIdentityPools/github-actions/providers/yujian-main
  DEPLOY_SERVICE_ACCOUNT: yujian-github-deployer@gemini-api-project-503706.iam.gserviceaccount.com

jobs:
  static-ip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: uat
    steps:
      - name: Authenticate to Google Cloud with GitHub OIDC/WIF
        uses: google-github-actions/auth@v3.0.0
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3.0.1
        with:
          project_id: ${{ env.PROJECT_ID }}
          version: ">= 416.0.0"

      - name: Promote current Worker IP and verify health
        shell: bash
        run: |
          set -uo pipefail
          collapse() { tr '\n' ' ' | tr -s ' ' | cut -c1-1800; }
          IAM_BLOCKER=""
          VM_STATUS=""
          STATIC_IP_NAME=""
          STATIC_IP_ADDRESS=""
          STATIC_IP_STATUS=""
          USERS=""
          WORKER_HEALTH="FAIL"
          P1_1_STATUS="FAIL"

          echo "=== CURRENT VM NETWORK ==="
          VM_YAML="$(gcloud compute instances describe "$VM" --project="$PROJECT_ID" --zone="$ZONE" --format="yaml(status,networkInterfaces.networkIP,networkInterfaces.accessConfigs.natIP,networkInterfaces.accessConfigs.networkTier)" 2>&1)"
          VM_RC=$?
          echo "$VM_YAML"
          if [[ "$VM_RC" -ne 0 ]]; then
            IAM_BLOCKER="$(printf '%s' "$VM_YAML" | collapse)"
            echo "IAM_BLOCKER=$IAM_BLOCKER"
            echo "STATIC_IP_NAME="
            echo "STATIC_IP_ADDRESS="
            echo "STATIC_IP_STATUS="
            echo "VM_STATUS=UNKNOWN"
            echo "WORKER_HEALTH=NOT_RUN"
            echo "P1_1_STATUS=BLOCKED"
            exit "$VM_RC"
          fi

          VM_STATUS="$(gcloud compute instances describe "$VM" --project="$PROJECT_ID" --zone="$ZONE" --format="value(status)" 2>/dev/null)"
          CURRENT_IP="$(gcloud compute instances describe "$VM" --project="$PROJECT_ID" --zone="$ZONE" --format="value(networkInterfaces[0].accessConfigs[0].natIP)" 2>/dev/null)"
          echo "VM_STATUS=$VM_STATUS"
          echo "CURRENT_EXTERNAL_IP=$CURRENT_IP"
          if [[ "$VM_STATUS" != "RUNNING" || "$CURRENT_IP" != "$EXPECTED_IP" ]]; then
            echo "IAM_BLOCKER="
            echo "STATIC_IP_NAME="
            echo "STATIC_IP_ADDRESS=$CURRENT_IP"
            echo "STATIC_IP_STATUS=ADDRESS_MISMATCH"
            echo "VM_STATUS=$VM_STATUS"
            echo "WORKER_HEALTH=NOT_RUN"
            echo "P1_1_STATUS=BLOCKED_ADDRESS_MISMATCH"
            exit 2
          fi

          echo "=== STATIC ADDRESS LOOKUP ==="
          ADDR_LIST="$(gcloud compute addresses list --project="$PROJECT_ID" --filter="address=$EXPECTED_IP" --format="csv[no-heading](name,address,status,region.basename(),networkTier)" 2>&1)"
          ADDR_RC=$?
          echo "$ADDR_LIST"
          if [[ "$ADDR_RC" -ne 0 ]]; then
            IAM_BLOCKER="$(printf '%s' "$ADDR_LIST" | collapse)"
            echo "IAM_BLOCKER=$IAM_BLOCKER"
            echo "STATIC_IP_NAME="
            echo "STATIC_IP_ADDRESS=$EXPECTED_IP"
            echo "STATIC_IP_STATUS=LOOKUP_FAILED"
            echo "VM_STATUS=$VM_STATUS"
            echo "WORKER_HEALTH=NOT_RUN"
            echo "P1_1_STATUS=BLOCKED"
            exit "$ADDR_RC"
          fi

          STATIC_IP_NAME="$(gcloud compute addresses list --project="$PROJECT_ID" --filter="address=$EXPECTED_IP" --format="value(name)" 2>/dev/null | head -1)"
          if [[ -z "$STATIC_IP_NAME" ]]; then
            echo "=== PROMOTE EPHEMERAL IP IN PLACE ==="
            CREATE_OUT="$(gcloud compute addresses create "$STATIC_NAME" --project="$PROJECT_ID" --region="$REGION" --addresses="$EXPECTED_IP" 2>&1)"
            CREATE_RC=$?
            echo "$CREATE_OUT"
            if [[ "$CREATE_RC" -ne 0 ]]; then
              IAM_BLOCKER="$(printf '%s' "$CREATE_OUT" | collapse)"
              echo "IAM_BLOCKER=$IAM_BLOCKER"
              echo "STATIC_IP_NAME=$STATIC_NAME"
              echo "STATIC_IP_ADDRESS=$EXPECTED_IP"
              echo "STATIC_IP_STATUS=CREATE_FAILED"
              echo "VM_STATUS=$VM_STATUS"
              echo "WORKER_HEALTH=NOT_RUN"
              echo "P1_1_STATUS=BLOCKED"
              exit "$CREATE_RC"
            fi
            STATIC_IP_NAME="$STATIC_NAME"
          fi

          echo "=== STATIC ADDRESS ==="
          ADDR_YAML="$(gcloud compute addresses describe "$STATIC_IP_NAME" --project="$PROJECT_ID" --region="$REGION" --format="yaml(name,address,status,users,networkTier)" 2>&1)"
          ADDR_DESC_RC=$?
          echo "$ADDR_YAML"
          if [[ "$ADDR_DESC_RC" -ne 0 ]]; then
            IAM_BLOCKER="$(printf '%s' "$ADDR_YAML" | collapse)"
            echo "IAM_BLOCKER=$IAM_BLOCKER"
            echo "STATIC_IP_NAME=$STATIC_IP_NAME"
            echo "STATIC_IP_ADDRESS=$EXPECTED_IP"
            echo "STATIC_IP_STATUS=DESCRIBE_FAILED"
            echo "VM_STATUS=$VM_STATUS"
            echo "WORKER_HEALTH=NOT_RUN"
            echo "P1_1_STATUS=BLOCKED"
            exit "$ADDR_DESC_RC"
          fi

          STATIC_IP_ADDRESS="$(gcloud compute addresses describe "$STATIC_IP_NAME" --project="$PROJECT_ID" --region="$REGION" --format="value(address)" 2>/dev/null)"
          STATIC_IP_STATUS="$(gcloud compute addresses describe "$STATIC_IP_NAME" --project="$PROJECT_ID" --region="$REGION" --format="value(status)" 2>/dev/null)"
          USERS="$(gcloud compute addresses describe "$STATIC_IP_NAME" --project="$PROJECT_ID" --region="$REGION" --format="value(users)" 2>/dev/null)"
          echo "STATIC_IP_NAME=$STATIC_IP_NAME"
          echo "STATIC_IP_ADDRESS=$STATIC_IP_ADDRESS"
          echo "STATIC_IP_STATUS=$STATIC_IP_STATUS"
          echo "STATIC_IP_USERS=$USERS"

          echo "=== WORKER HEALTH ==="
          HEALTH_BODY="$(curl -fsS --connect-timeout 5 --max-time 10 "http://$EXPECTED_IP:$PORT/health" 2>&1)"
          HEALTH_RC=$?
          echo "HEALTH_CURL_RC=$HEALTH_RC"
          echo "HEALTH_BODY=$HEALTH_BODY"
          if [[ "$HEALTH_RC" -eq 0 && "$HEALTH_BODY" == *'"status":"ok"'* && "$HEALTH_BODY" == *'"gpu":"NVIDIA L4"'* && "$HEALTH_BODY" == *'"model":"PowerPaint"'* && "$HEALTH_BODY" == *'"checkpoint":"loaded"'* ]]; then
            WORKER_HEALTH="PASS"
          fi

          if [[ "$STATIC_IP_ADDRESS" == "$EXPECTED_IP" && "$STATIC_IP_STATUS" == "IN_USE" && "$USERS" == *"$VM"* && "$WORKER_HEALTH" == "PASS" ]]; then
            P1_1_STATUS="PASS"
          fi

          echo "IAM_BLOCKER=$IAM_BLOCKER"
          echo "STATIC_IP_NAME=$STATIC_IP_NAME"
          echo "STATIC_IP_ADDRESS=$STATIC_IP_ADDRESS"
          echo "STATIC_IP_STATUS=$STATIC_IP_STATUS"
          echo "VM_STATUS=$VM_STATUS"
          echo "WORKER_HEALTH=$WORKER_HEALTH"
          echo "P1_1_STATUS=$P1_1_STATUS"
          [[ "$P1_1_STATUS" == "PASS" ]]
