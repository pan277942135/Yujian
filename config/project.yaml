project:
  name: yujian-project
  dataset_family: M1
  timezone: Asia/Shanghai

cloud:
  provider: gcp
  project_id: gemini-api-project-503706
  project_number: '571785698442'
  region: asia-east1
  bucket_name: yujian-model-factory-571785698442

storage:
  provider: gcs
  incoming_prefix: incoming
  raw_prefix: raw/batches
  cleaning_prefix: cleaning
  reviewed_prefix: reviewed/batches
  feedback_prefix: feedback
  annotation_prefix: annotations/cvat
  dataset_prefix: datasets
  model_prefix: models
  evaluation_prefix: evaluations
  error_pool_prefix: error_pool

# Bootstrap only. Runtime species truth lives in Registry SpeciesCatalog and can expand.
# catalog_order is append-only; Dataset class_map.json freezes model-specific indices.
species_seed:
  0: grass_carp
  1: bighead_carp
  2: silver_carp
  3: common_carp
  4: crucian_carp
  5: largemouth_bass
  6: snakehead
  7: yellow_catfish
  8: black_carp
  9: other_freshwater_fish

review:
  approved_values: [approved, confirmed]
  excluded_values: [rejected, hard_case, needs_review, pending]

split:
  train: 0.70
  val: 0.15
  test: 0.15
  group_fields: [group_id, capture_event_id, event_id]
  seed: 20260826

dataset:
  canonical_selection_mode: ALL_APPROVED
  preserve_parent_class_indices: true
  include_species_status: [active]

feedback:
  accepted_types: [confirmed, corrected, unknown, new_species_candidate]
  reenter_review: true

naming:
  batch_prefix: BATCH_
  dataset_pattern: 'DS_M1_v{major}.{minor}'
  run_prefix: RUN_M1_
  model_prefix: MODEL_M1_
