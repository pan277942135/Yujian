<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>快速审核 · 渔见 AI</title>
  <style>
    body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f6f7f8;color:#171717}header{background:#fff;border-bottom:1px solid #e5e7eb;padding:12px 22px;display:flex;gap:18px;align-items:center;position:sticky;top:0;z-index:5}header a{text-decoration:none;color:#111827;font-weight:650}main{max-width:1440px;margin:0 auto;padding:20px}.bar,.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:12px;margin:12px 0}.spacer{flex:1}select,button{font:inherit;border:1px solid #d1d5db;border-radius:8px;padding:8px;background:#fff}button{cursor:pointer;font-weight:650}.primary{background:#111827;color:#fff}.soft{background:#f3f4f6}.danger{background:#fff1f2}.pending{background:#fff7ed}.speciesTabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.speciesTabs button{font-size:13px}.speciesTabs .active{background:#111827;color:#fff}.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}.card{background:#fff;border:2px solid transparent;border-radius:12px;padding:8px;box-shadow:0 1px 1px rgba(0,0,0,.03)}.card[data-state="approved"]{border-color:#059669}.card[data-state="rejected"]{border-color:#e11d48}.card[data-state="pending"]{border-color:#d97706}.photoStage{position:relative;width:100%;aspect-ratio:4/3;background:#111;border-radius:8px;overflow:hidden}.photoStage.bboxEditing{cursor:crosshair;user-select:none}.photo{width:100%;height:100%;object-fit:contain;background:#111;border-radius:8px}.bboxOverlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.bboxOverlay rect{fill:rgba(185,28,28,.10);stroke:#b91c1c;stroke-width:5px;vector-effect:non-scaling-stroke}.meta{font-size:12px;margin-top:7px;display:flex;flex-direction:column;gap:5px}.row{display:flex;gap:5px;align-items:center;flex-wrap:wrap}.pill{padding:3px 7px;border-radius:999px;background:#f3f4f6;font-size:11px}.good{background:#ecfdf5}.warn{background:#fff7ed}.bad{background:#fff1f2}.stateBtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-top:6px}.stateBtns button{padding:6px 4px;font-size:12px}.speciesSelect{width:100%;padding:6px;border:1px solid #d1d5db;border-radius:7px}.banner{display:none;padding:10px 12px;border-radius:9px;background:#eef2ff;margin:10px 0;white-space:pre-wrap}.empty{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:80px 20px;text-align:center;color:#6b7280}.footer{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:14px 0}.muted{color:#6b7280;font-size:13px}.bulkSpecies{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding-left:8px;border-left:1px solid #e5e7eb}.pickLabel{display:flex;gap:5px;align-items:center;font-size:12px;font-weight:650}.pickLabel input{width:16px;height:16px}.bbox{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.bbox input{width:100%;box-sizing:border-box;padding:5px;font-size:11px}.bboxTools{display:flex;gap:5px;align-items:center;flex-wrap:wrap}.bboxStatus{font-size:11px}.bboxStatus.pending{background:#eef2ff;color:#3730a3}.bboxStatus.good{background:#ecfdf5;color:#047857}.bboxStatus.warn{background:#fff7ed;color:#b45309}@media(max-width:1200px){.grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}header{flex-wrap:wrap}}
  </style>
</head>
<body>
<header class="app-nav"><a href="/">总览</a><a href="/batches">数据批次</a><a href="/review/bulk">快速审核</a><a href="/review">单张审核</a><a href="/species">鱼种管理</a><a href="/datasets">数据集</a></header>
{% include "_mobile_ux.html" %}
<main>
  <div class="bar"><div><h1 style="margin:0">快速审核</h1><div class="muted">按审核分组连续看图：优先真实鱼种，未确认时仅用采集标注分组；采集标注不会自动成为 Ground Truth。</div></div></div>
  <div id="banner" class="banner"></div>
  <div class="toolbar">
    <select id="batch"><option value="">选择批次</option></select>
    <select id="presence"><option value="">全部鱼体结果</option><option value="single_fish">单鱼</option><option value="multi_fish">多鱼</option><option value="no_fish">无鱼</option><option value="uncertain">不确定</option><option value="not_scanned">未检测</option></select>
    <span id="counter" class="muted"></span>
    <div class="bulkSpecies">
      <label class="pickLabel"><input id="selectAll" type="checkbox" onchange="toggleSelectAll(this.checked)">全选本页</label>
      <select id="bulkSpecies"><option value="">批量设置真实鱼种</option></select>
      <button class="soft" onclick="applyBulkSpecies()">应用鱼种到选中</button><button class="soft" onclick="applyBulkBbox()">批量接受候选框</button><button class="soft" onclick="autoDetectMissingBboxes()">重新识别缺失框</button>
      <span id="selectedCount" class="muted">已选 0 张</span>
    </div>
    <div class="spacer"></div>
    <button class="soft" onclick="markAll('approved')">本页全部通过</button>
    <button class="danger" onclick="markAll('rejected')">本页全部不通过</button>
    <button class="soft" onclick="markAll('pending')">本页全部待定</button>
    <button class="primary" onclick="submitPage()">提交本页</button>
  </div>
  <div id="speciesTabs" class="speciesTabs"></div>
  <div id="content"></div>
  <div class="footer"><button onclick="prevPage()">← 上一页</button><span id="pageInfo" class="muted"></span><button onclick="nextPage()">下一页 →</button></div>
</main>
<script>
const PENDING_REVIEW_STATUSES=['pending','needs_review','hard_case'];
function pendingReviewCount(batch){return PENDING_REVIEW_STATUSES.reduce((total,status)=>total+Number(batch.review?.[status]||0),0)}
function reviewableBatches(list){return list.filter(batch=>pendingReviewCount(batch)>0)}
function stateForCard(status){if(status==='rejected')return 'rejected';if(PENDING_REVIEW_STATUSES.includes(status))return 'pending';return 'approved'}
let batches=[],catalog=[],speciesRows=[],currentSpecies='',items=[],offset=0,limit=window.matchMedia('(max-width:768px)').matches?12:24,total=0,allImageCache=new Map();
function esc(v){return (v??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function api(url,opts){const r=await fetch(url,opts);const t=await r.text();let d;try{d=JSON.parse(t)}catch{d=t}if(!r.ok)throw new Error(d.detail||t);return d}
function msg(text,err=false){const b=document.getElementById('banner');b.style.display='block';b.style.background=err?'#fff1f2':'#eef2ff';b.textContent=text}
function sourceName(v){return ({pilot:'种子集',doubao:'豆包',app_feedback:'用户反馈',workbuddy:'WorkBuddy',other:'其他'})[v]||v||'-'}
function presenceName(v){return ({single_fish:'单鱼',multi_fish:'多鱼',no_fish:'无鱼',uncertain:'不确定',error:'检测失败',not_scanned:'未检测'})[v]||'未检测'}
function presenceClass(v){if(v==='single_fish')return 'good';if(v==='multi_fish'||v==='uncertain')return 'warn';if(v==='no_fish')return 'bad';return ''}
function speciesOptions(selected){const current=catalog.find(x=>x.common_name_zh===selected);const historical=current?.status==='retired'?`<option value="${esc(selected)}" selected>${esc(selected)} · 已停用（历史保留）</option>`:'';return `<option value="" ${!selected?'selected':''}>未确认真实鱼种</option>`+historical+catalog.filter(x=>x.status!=='retired').map(x=>`<option value="${esc(x.common_name_zh)}" ${x.common_name_zh===selected?'selected':''}>${esc(x.common_name_zh)}</option>`).join('')}
async function init(){
  const [registered,catalogData]=await Promise.all([api('/api/batches'),api('/api/species')]);
  batches=reviewableBatches(registered);catalog=catalogData;
  document.getElementById('batch').innerHTML='<option value="">全部批次</option>'+batches.map(x=>`<option value="${esc(x.batch_id)}">${esc(x.batch_id)} · ${esc(sourceName(x.source))}</option>`).join('');
  document.getElementById('bulkSpecies').innerHTML='<option value="">批量设置真实鱼种</option>';
  const u=new URLSearchParams(location.search);if(u.get('batch')&&batches.some(x=>x.batch_id===u.get('batch')))document.getElementById('batch').value=u.get('batch');
  document.getElementById('batch').addEventListener('change',()=>{offset=0;allImageCache.clear();loadSpecies().catch(e=>msg(e.message,true))});
  document.getElementById('presence').addEventListener('change',()=>{offset=0;loadImages().catch(e=>msg(e.message,true))});
  await loadSpecies();
}
async function loadSpecies(){
  const selectedBatch=document.getElementById('batch').value;
  const targetBatches=selectedBatch?batches.filter(x=>x.batch_id===selectedBatch):batches;
  allImageCache.clear();
  if(!targetBatches.length){speciesRows=[];currentSpecies='';renderTabs();document.getElementById('content').innerHTML='<div class="empty">没有可审核的批次。</div>';return}
  const perBatch=await Promise.all(targetBatches.map(x=>api(`/api/bulk-review/species?batch_id=${encodeURIComponent(x.batch_id)}&status=pending`)));
  const merged=new Map();
  perBatch.forEach((rows,index)=>rows.forEach(row=>{
    const current=merged.get(row.species)||{species:row.species,count:0,sources:[]};
    current.count+=Number(row.count||0);
    current.sources.push({batch_id:targetBatches[index].batch_id,count:Number(row.count||0)});
    merged.set(row.species,current);
  }));
  const catalogOrder=new Map(catalog.map((x,index)=>[x.common_name_zh,index]));
  speciesRows=[...merged.values()].sort((a,b)=>(catalogOrder.get(a.species)??9999)-(catalogOrder.get(b.species)??9999)||String(a.species).localeCompare(String(b.species)));
  if(!speciesRows.length){currentSpecies='';renderTabs();document.getElementById('content').innerHTML='<div class="empty">当前没有待审核图片。</div>';return}
  if(!speciesRows.some(x=>x.species===currentSpecies))currentSpecies=speciesRows[0].species;
  offset=0;renderTabs();await loadImages()
}
function renderBulkSpeciesOptions(){const el=document.getElementById('bulkSpecies');const selected=el.value;el.innerHTML='<option value="">批量设置真实鱼种</option>'+speciesRows.map(x=>`<option value="${esc(x.species)}">${esc(x.species)} · ${x.count}</option>`).join('');if(selected&&speciesRows.some(x=>x.species===selected))el.value=selected}
function renderTabs(){document.getElementById('speciesTabs').innerHTML=speciesRows.map(x=>`<button class="${x.species===currentSpecies?'active':''}" onclick="chooseSpecies('${esc(x.species)}')">${esc(x.species)} · ${x.count}</button>`).join('');renderBulkSpeciesOptions()}
function chooseSpecies(name){currentSpecies=name;offset=0;renderTabs();loadImages().catch(e=>msg(e.message,true))}
async function fetchAllImages(batchId,species,presence){
  let cursor=0;const result=[];
  while(true){
    const p=new URLSearchParams({batch_id:batchId,species,status:'pending',limit:'60',offset:String(cursor)});
    if(presence)p.set('presence',presence);
    const d=await api('/api/bulk-review/images?'+p);
    const page=(d.items||[]).map(x=>({...x,batch_id:batchId}));
    result.push(...page);
    if(!page.length||cursor+page.length>=Number(d.total||0))break;
    cursor+=page.length;
  }
  return result;
}
async function loadImages(){
  const selectedBatch=document.getElementById('batch').value;if(!currentSpecies)return;
  const presence=document.getElementById('presence').value;
  if(selectedBatch){
    const p=new URLSearchParams({batch_id:selectedBatch,species:currentSpecies,status:'pending',limit:String(limit),offset:String(offset)});
    if(presence)p.set('presence',presence);
    const d=await api('/api/bulk-review/images?'+p);
    items=(d.items||[]).map(x=>({...x,batch_id:selectedBatch}));total=d.total||0;
  }else{
    const speciesRow=speciesRows.find(x=>x.species===currentSpecies);if(!speciesRow){items=[];total=0;render();updatePageInfo();return}
    const cacheKey=`all|${currentSpecies}|${presence}`;let all=allImageCache.get(cacheKey);
    if(!all){const pages=await Promise.all(speciesRow.sources.map(source=>fetchAllImages(source.batch_id,currentSpecies,presence)));all=pages.flat();allImageCache.set(cacheKey,all)}
    total=all.length;items=all.slice(offset,offset+limit);
  }
  document.getElementById('counter').textContent=`${currentSpecies} · 待处理 ${total}`;render();updatePageInfo()
}
function render(){const c=document.getElementById('content');document.getElementById('selectAll').checked=false;if(!items.length){c.innerHTML='<div class="empty">当前筛选下没有图片。可以切换鱼体结果或下一个鱼种。</div>';updateSelectedCount();return}c.innerHTML=`<div class="grid">${items.map((x,i)=>{const initial=stateForCard(x.review_status);const dup=x.duplicate?.is_duplicate?`<span class="pill warn">近重复${x.duplicate.kind==='exact'?'·完全':'·相似'}</span>`:'';const b=x.accepted_bbox||x.candidate_bbox||[0,0,0,0];const bboxLabel=x.accepted_bbox?'已确认':x.candidate_bbox?'Parity 候选框已生成':'缺失，自动识别中…';return `<div class="card" id="card-${i}" data-state="${initial}"><div class="photoStage"><img id="photo-${i}" class="photo" loading="lazy" src="${x.media_url}" onload="syncCardBbox(${i})"><svg id="bbox-overlay-${i}" class="bboxOverlay" viewBox="0 0 1 1" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><rect id="bbox-rect-${i}" x="0" y="0" width="0" height="0" style="display:none"></rect></svg></div><div class="meta"><div class="row"><label class="pickLabel"><input class="itemPick" id="pick-${i}" type="checkbox" onchange="updateSelectedCount()">选择</label><b>${esc(x.image_id)}</b></div><div class="row"><span class="pill ${presenceClass(x.presence?.status)}">${presenceName(x.presence?.status)}${(x.presence?.fish_count||0)>0?' · '+x.presence.fish_count+'条':''}</span>${dup}</div><div class="muted">采集：${esc(x.claimed_species||'-')}</div><select class="speciesSelect" id="species-${i}">${speciesOptions(x.truth_species||'')}</select><div class="row"><div class="muted">accepted_bbox x / y / w / h</div><span id="bbox-status-${i}" class="pill bboxStatus ${x.accepted_bbox?'good':x.candidate_bbox?'good':'pending'}">${bboxLabel}</span></div><div class="bbox">${b.map((v,n)=>'<input id="bbox-'+i+'-'+n+'" type="number" min="0" max="1" step="0.000001" value="'+Number(v||0)+'" placeholder="'+['x','y','w','h'][n]+'" oninput="syncCardBbox('+i+')">').join('')}</div><div class="bboxTools"><button class="soft" onclick="reidentifyBbox(${i})">重新识别</button><button class="soft" onclick="startManualBbox(${i})">手动框选</button><button class="soft" onclick="clearBbox(${i})">清空框</button></div><div class="stateBtns"><button onclick="setState(${i},'approved')">通过</button><button onclick="setState(${i},'rejected')">不通过</button><button onclick="setState(${i},'pending')">待定</button></div></div></div>`}).join('')}</div>`;items.forEach((x,i)=>{x._state=x.review_status||'pending'});updateSelectedCount();autoDetectMissingBboxes()}
function setState(i,state){items[i]._state=state;document.getElementById('card-'+i).dataset.state=state}
function markAll(state){items.forEach((_,i)=>setState(i,state))}
function selectedIndexes(){const result=[];items.forEach((_,i)=>{const el=document.getElementById('pick-'+i);if(el?.checked)result.push(i)});return result}
function updateSelectedCount(){const selected=selectedIndexes();document.getElementById('selectedCount').textContent=`已选 ${selected.length} 张`;const all=document.getElementById('selectAll');if(all)all.checked=items.length>0&&selected.length===items.length}
function toggleSelectAll(checked){items.forEach((_,i)=>{const el=document.getElementById('pick-'+i);if(el)el.checked=checked});updateSelectedCount()}
function applyBulkSpecies(){const species=document.getElementById('bulkSpecies').value;if(!species){msg('请先选择要批量设置的真实鱼种',true);return}const selected=selectedIndexes();if(!selected.length){msg('请先勾选要设置鱼种的图片',true);return}selected.forEach(i=>{document.getElementById('species-'+i).value=species});msg(`已将 ${selected.length} 张图片的真实鱼种设置为“${species}”。审核状态未改变，点击“提交本页”后保存。`)}
function boxValues(i){return [0,1,2,3].map(n=>Number(document.getElementById('bbox-'+i+'-'+n)?.value||0))}
function hasBox(i){const b=boxValues(i);return b[2]>0&&b[3]>0&&b[0]>=0&&b[1]>=0&&b[0]+b[2]<=1&&b[1]+b[3]<=1}
function syncCardBbox(i){const img=document.getElementById('photo-'+i);const svg=document.getElementById('bbox-overlay-'+i);const rect=document.getElementById('bbox-rect-'+i);if(!img||!svg||!rect)return;const width=img.naturalWidth||1;const height=img.naturalHeight||1;svg.setAttribute('viewBox','0 0 '+width+' '+height);const b=boxValues(i);const valid=b[2]>0&&b[3]>0&&b[0]>=0&&b[1]>=0&&b[0]+b[2]<=1&&b[1]+b[3]<=1;if(!valid){rect.style.display='none';return}rect.setAttribute('x',b[0]*width);rect.setAttribute('y',b[1]*height);rect.setAttribute('width',b[2]*width);rect.setAttribute('height',b[3]*height);rect.style.display='block'}
function bboxPoint(i,event){const stage=document.getElementById('card-'+i)?.querySelector('.photoStage');const img=document.getElementById('photo-'+i);if(!stage||!img||!img.naturalWidth||!img.naturalHeight)return null;const r=stage.getBoundingClientRect();const scale=Math.min(r.width/img.naturalWidth,r.height/img.naturalHeight);const renderedW=img.naturalWidth*scale,renderedH=img.naturalHeight*scale;const offsetX=(r.width-renderedW)/2,offsetY=(r.height-renderedH)/2;const clamp=v=>Math.max(0,Math.min(1,v));return [clamp((event.clientX-r.left-offsetX)/renderedW),clamp((event.clientY-r.top-offsetY)/renderedH)]}
function setBboxInputs(i,b){b.forEach((v,n)=>{const el=document.getElementById('bbox-'+i+'-'+n);if(el)el.value=Number(v||0)});syncCardBbox(i)}
function clearBbox(i){if(!items[i])return;items[i].accepted_bbox=null;items[i].candidate_bbox=null;setBboxInputs(i,[0,0,0,0]);setBboxStatus(i,'已清空，请手动框选或重新识别','warn')}
function startManualBbox(i){const img=document.getElementById('photo-'+i);const stage=document.getElementById('card-'+i)?.querySelector('.photoStage');if(!img||!stage||!img.naturalWidth){setBboxStatus(i,'图片尚未加载','warn');return}stage.classList.add('bboxEditing');setBboxStatus(i,'拖动图片框选','pending');let start=null,active=false;const down=e=>{const point=bboxPoint(i,e);if(!point)return;e.preventDefault();start=point;active=true;stage.setPointerCapture?.(e.pointerId)};const move=e=>{if(!active)return;const end=bboxPoint(i,e);if(!end)return;setBboxInputs(i,[Math.min(start[0],end[0]),Math.min(start[1],end[1]),Math.abs(end[0]-start[0]),Math.abs(end[1]-start[1])])};const cleanup=()=>{stage.classList.remove('bboxEditing');stage.removeEventListener('pointerdown',down);stage.removeEventListener('pointermove',move);stage.removeEventListener('pointerup',finish);stage.removeEventListener('pointercancel',finish)};const finish=e=>{if(!active)return;const end=bboxPoint(i,e);active=false;stage.releasePointerCapture?.(e.pointerId);if(end){const b=[Math.min(start[0],end[0]),Math.min(start[1],end[1]),Math.abs(end[0]-start[0]),Math.abs(end[1]-start[1])];if(b[2]>=0.01&&b[3]>=0.01){items[i].accepted_bbox=null;items[i].candidate_bbox=null;setBboxInputs(i,b);setBboxStatus(i,'手动框选已填入','good')}else{setBboxStatus(i,'单击未修改，请拖动鼠标框选','warn')}}start=null;cleanup()};stage.addEventListener('pointerdown',down);stage.addEventListener('pointermove',move);stage.addEventListener('pointerup',finish);stage.addEventListener('pointercancel',finish)}
function setBboxStatus(i,text,kind='pending'){const el=document.getElementById('bbox-status-'+i);if(el){el.textContent=text;el.className='pill bboxStatus '+kind}}
function fillCandidate(i,b){if(!Array.isArray(b)||b.length!==4||items[i].accepted_bbox||hasBox(i))return;items[i].candidate_bbox=b;b.forEach((v,n)=>{const el=document.getElementById('bbox-'+i+'-'+n);if(el)el.value=Number(v||0)});setBboxStatus(i,'Parity 候选框已生成','good');syncCardBbox(i)}
async function reidentifyBbox(i){if(!items[i])return;const batchId=items[i].batch_id||document.getElementById('batch').value;if(!batchId){setBboxStatus(i,'缺少批次','warn');return}setBboxStatus(i,'识别中…','pending');try{const d=await api('/api/review/'+encodeURIComponent(batchId)+'/'+encodeURIComponent(items[i].image_id)+'/reidentify-bbox',{method:'POST'});items[i]={...items[i],...d,batch_id:batchId};if(d.candidate_bbox)fillCandidate(i,d.candidate_bbox);else setBboxStatus(i,'未检测到鱼体框','warn')}catch(e){setBboxStatus(i,'识别失败','warn');msg(items[i].image_id+'：'+e.message,true)}}
async function autoDetectMissingBboxes(){const queue=items.map((x,i)=>({x,i})).filter(({x})=>!x.accepted_bbox&&!x.candidate_bbox);if(!queue.length)return;let cursor=0;let generated=0;async function worker(){while(cursor<queue.length){const job=queue[cursor++];try{await reidentifyBbox(job.i);if(items[job.i].candidate_bbox)generated++}catch{}}}await Promise.all(Array.from({length:Math.min(2,queue.length)},worker));if(generated)msg('已按 Detector Golden Parity 自动生成 '+generated+' 张候选框，请检查后提交。')}
function applyBulkBbox(){const selected=selectedIndexes();if(!selected.length){msg('请先勾选图片',true);return}let count=0;selected.forEach(i=>{const b=items[i].candidate_bbox;if(!b)return;b.forEach((v,n)=>{const el=document.getElementById('bbox-'+i+'-'+n);if(el)el.value=v});syncCardBbox(i);count++});msg('已将 '+count+' 张图片的候选框填入 accepted_bbox，请检查后提交。')}
async function submitPage(){
  if(!items.length)return;
  for(let i=0;i<items.length;i++){if(items[i]._state==='approved'&&!document.getElementById('species-'+i).value){msg(`${items[i].image_id} 通过前必须确认真实鱼种`,true);return}if(items[i]._state==='approved'&&!hasBox(i)){msg(items[i].image_id+' 通过前必须确认 accepted_bbox',true);return}}
  const fallbackBatch=document.getElementById('batch').value;const grouped=new Map();
  for(let i=0;i<items.length;i++){const batchId=items[i].batch_id||fallbackBatch;if(!batchId){msg(items[i].image_id+' 缺少批次信息',true);return}if(!grouped.has(batchId))grouped.set(batchId,[]);grouped.get(batchId).push({image_id:items[i].image_id,review_status:items[i]._state||'pending',truth_species:document.getElementById('species-'+i).value,accepted_bbox:hasBox(i)?boxValues(i):null,notes:items[i].notes||''})}
  try{
    let updated=0;
    for(const [batchId,batchItems] of grouped){const d=await api('/api/bulk-review/apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({batch_id:batchId,items:batchItems})});updated+=d.updated||0}
    msg(`已提交 ${updated} 张。正在继续当前鱼种…`);
    const selectedBatch=fallbackBatch;const registered=await api('/api/batches');batches=reviewableBatches(registered);
    const select=document.getElementById('batch');select.innerHTML='<option value="">全部批次</option>'+batches.map(x=>`<option value="${esc(x.batch_id)}">${esc(x.batch_id)} · ${esc(sourceName(x.source))}</option>`).join('');
    if(selectedBatch&&batches.some(x=>x.batch_id===selectedBatch))select.value=selectedBatch;else select.value='';
    allImageCache.clear();offset=0;await loadSpecies();if(speciesRows.length&&currentSpecies)await loadImages()
  }catch(e){msg(e.message,true)}
}
function updatePageInfo(){const from=total?offset+1:0;const to=Math.min(total,offset+limit);document.getElementById('pageInfo').textContent=`${from}-${to} / ${total}`}
function nextPage(){if(offset+limit<total){offset+=limit;loadImages().catch(e=>msg(e.message,true));return}const idx=speciesRows.findIndex(x=>x.species===currentSpecies);if(idx>=0&&idx+1<speciesRows.length){currentSpecies=speciesRows[idx+1].species;offset=0;renderTabs();loadImages().catch(e=>msg(e.message,true))}}
function prevPage(){if(offset>=limit){offset-=limit;loadImages().catch(e=>msg(e.message,true))}}
init().catch(e=>msg(e.message,true));
</script>
