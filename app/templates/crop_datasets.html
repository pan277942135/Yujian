<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Crop Dataset · 渔见 AI</title>
  <style>
    :root{color-scheme:light}body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f6f7f8;color:#171717}
    main{max-width:1500px;margin:0 auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:14px}.muted{color:#6b7280;font-size:13px}.section{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px;margin-top:16px}.section h2{margin:0 0 10px;font-size:18px}.toolbar{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr auto;gap:10px;align-items:end}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;color:#6b7280}.field input,.field select,.toolbar button{font:inherit;min-height:42px;border:1px solid #d1d5db;border-radius:8px;padding:0 10px;background:#fff;box-sizing:border-box}.toolbar button{cursor:pointer;font-weight:700}.primary{background:#111827!important;color:#fff;border-color:#111827!important}.danger{background:#fff1f2;color:#9f1239}.batch-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}.batch-card{border:1px solid #e5e7eb;border-radius:12px;padding:13px;background:#fff}.batch-card.selected{border:2px solid #111827;padding:12px}.batch-card h3{margin:0;font-size:14px;overflow-wrap:anywhere}.batch-card .stats{font-size:12px;line-height:1.7;margin:8px 0}.pill{display:inline-block;padding:3px 8px;border-radius:999px;font-size:12px;background:#f3f4f6}.ready{background:#ecfdf5;color:#166534}.warn{background:#fff7ed;color:#9a3412}.bad{background:#fff1f2;color:#9f1239}.batch-actions{display:flex;gap:7px;flex-wrap:wrap}.batch-actions button,.batch-actions a{font:inherit;min-height:40px;border:1px solid #d1d5db;border-radius:8px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer;background:#fff;font-weight:700}.batch-actions .primary{color:#fff}.banner{display:none;white-space:pre-wrap;margin-top:13px;padding:12px;border-radius:9px;background:#fff1f2;color:#9f1239}.result{display:none;margin-top:13px;padding:12px;border-radius:9px;background:#ecfdf5;color:#166534}.result a{font-weight:700;color:inherit}.state-line{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    @media(max-width:900px){.toolbar{grid-template-columns:1fr 1fr}.batch-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){main{padding:12px 16px}.top{align-items:flex-start;flex-direction:column}.toolbar{grid-template-columns:1fr}.field input,.field select,.toolbar button{width:100%}.batch-grid{grid-template-columns:1fr}.section{padding:14px}.batch-actions{display:grid;grid-template-columns:1fr}.batch-actions button,.batch-actions a{width:100%}}
  </style>
</head>
<body>
<header class="app-nav"></header>
{% include "_mobile_ux.html" %}
<main>
  <div class="top"><div><h1 style="margin:0">Crop Dataset</h1><div class="muted">选择已通过人工 accepted_bbox 的来源 Batch，依次 Build、Validation、Freeze，再手动进入 Training。</div></div><span class="pill">CROP_CLASSIFIER_V1</span></div>
  <section class="section"><h2>1 · 来源 Batch</h2><div class="muted">候选框不会自动成为训练框。没有 accepted_bbox 的 Batch 只能先进入 Crop Review。</div><div id="batchGrid" class="batch-grid"></div><div id="banner" class="banner"></div></section>
  <section class="section"><h2>2 · Build / Validation / Freeze</h2><div class="toolbar"><div class="field"><label for="batchId">source Batch</label><input id="batchId" placeholder="BATCH_C70BA2D53823" /></div><div class="field"><label for="datasetVersion">dataset_version</label><input id="datasetVersion" value="DS_CROP_M1_v0.1" /></div><div class="field"><label for="expandRatio">expand_ratio</label><input id="expandRatio" type="number" min="0" max="1" step="0.01" value="0.15" /></div><div class="field"><label for="limit">limit</label><input id="limit" type="number" min="1" max="100000" value="5000" /></div><button class="primary" onclick="build()">Build Crop Dataset</button></div><div id="result" class="result"></div></section>
  <section class="section"><h2>3 · 当前状态</h2><div class="state-line"><span id="state" class="pill">尚未读取</span><span id="manifest" class="muted"></span><button onclick="refreshStatus()">刷新 Validation</button></div></section>
</main>
<script>
function esc(v){return (v??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function errorText(value){if(value&&typeof value==='object'){if(value.detail!==undefined)return errorText(value.detail);if(value.reason)return String(value.reason);if(value.error)return String(value.error);try{return JSON.stringify(value)}catch{return '请求失败'}}return String(value||'请求失败')}
function banner(text){const b=document.getElementById('banner');b.style.display='block';b.textContent=errorText(text)}
function clearBanner(){document.getElementById('banner').style.display='none'}
async function api(url,opts){const r=await fetch(url,opts);const text=await r.text();let d;try{d=JSON.parse(text)}catch{d=text}if(!r.ok)throw new Error(errorText(d));return d}
let sourceMap={};
function selectBatch(batchId){document.getElementById('batchId').value=batchId;document.querySelectorAll('.batch-card').forEach(x=>x.classList.toggle('selected',x.dataset.batch===batchId));refreshStatus()}
function renderBatches(items){sourceMap={};(items||[]).forEach(x=>sourceMap[x.batch_id]=x);const root=document.getElementById('batchGrid');root.innerHTML=(items||[]).map(x=>`<article class="batch-card" data-batch="${esc(x.batch_id)}"><h3>${esc(x.batch_id)}</h3><div class="stats"><span class="pill ${x.buildable?'ready':'warn'}">${esc(x.readiness)}</span><br/>图片：${esc(x.image_count)} · accepted_bbox：${esc(x.accepted_bbox_count)} · 可构建：${esc(x.valid_accepted_bbox_count||0)}<br/>待审核：${esc(x.review_required_count)} · 拒绝：${esc(x.rejected_count)} · 缺少鱼种：${esc(x.missing_species_count||0)}</div><div class="batch-actions"><button class="primary" ${x.buildable?'':'disabled'} onclick="selectBatch('${esc(x.batch_id)}')">选择</button><a href="${esc(x.review_url)}">Crop Review</a></div></article>`).join('')||'<div class="muted">暂无已注册 Batch。</div>'}
async function loadSources(){try{const data=await api('/api/crop-datasets/sources');renderBatches(data.items||[])}catch(e){banner(e.message)}}
function setState(value){document.getElementById('state').textContent=value||'未知';document.getElementById('manifest').textContent=''}
async function refreshStatus(){const version=document.getElementById('datasetVersion').value.trim();if(!version)return;try{const data=await api(`/api/crop-datasets/${encodeURIComponent(version)}/validation`);setState(data.state);document.getElementById('manifest').textContent=data.manifest_path||''}catch(e){setState('读取失败');banner(e.message)}}
async function build(){clearBanner();const batch=document.getElementById('batchId').value.trim()||null;if(batch&&sourceMap[batch]&&!sourceMap[batch].buildable){banner('该 Batch 尚无 accepted_bbox，请先进入 Crop Review 完成人工确认。');return}const version=document.getElementById('datasetVersion').value.trim();const payload={batch_id:batch,dataset_version:version,pipeline:'CROP_CLASSIFIER_V1',expand_ratio:Number(document.getElementById('expandRatio').value),limit:Number(document.getElementById('limit').value),freeze:false};try{const data=await api('/api/crop-datasets/build',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});setState(data.state);document.getElementById('manifest').textContent=data.manifest_path||'';document.getElementById('result').style.display='block';const checks=Object.entries(data.validation?.checks||{}).map(([key,value])=>`${esc(key)}: ${value?'PASS':'FAIL'}`).join(' · ');document.getElementById('result').innerHTML=`Build 完成：${esc(data.rows)} rows · ${esc(data.valid_rows)} valid · ${esc((data.classes||[]).join(', '))}<br/>${checks}<br/><button onclick="freeze()">确认 Freeze</button>`;await refreshStatus()}catch(e){banner(e.message)}}
async function freeze(){clearBanner();const version=document.getElementById('datasetVersion').value.trim();if(!confirm('确认 Freeze？该版本通过后不可覆盖。'))return;try{const data=await api(`/api/crop-datasets/${encodeURIComponent(version)}/freeze`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({confirm:true})});setState('READY_FOR_TRAINING');document.getElementById('result').style.display='block';document.getElementById('result').innerHTML=`Freeze 完成：${esc(data.image_count)} images · <a href="/training?dataset=${encodeURIComponent(version)}">进入 Training（不会自动启动）</a>`}catch(e){banner(e.message)}}
const query=new URLSearchParams(location.search);if(query.get('batch_id'))document.getElementById('batchId').value=query.get('batch_id');loadSources();refreshStatus();
</script>
</body>
</html>
