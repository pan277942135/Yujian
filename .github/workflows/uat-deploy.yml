name: UAT Deploy

on:
  workflow_run:
    workflows:
      - ci
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: yujian-uat-deploy
  cancel-in-progress: true

env:
  PROJECT_ID: gemini-api-project-503706
  PROJECT_NUMBER: '571785698442'
  REGION: asia-east1
  SERVICE: yujian-model-factory-console
  WIF_PROVIDER: projects/571785698442/locations/global/workloadIdentityPools/github-actions/providers/yujian-main
  DEPLOY_SERVICE_ACCOUNT: yujian-github-deployer@gemini-api-project-503706.iam.gserviceaccount.com
  DETECTOR_BUNDLE_URL: https://github.com/pan277942135/Yujian/releases/download/detector-model-v0.1/det_fish_v0_1_android_bundle.zip
  DETECTOR_BUNDLE_SHA256: 246ddacaf89ca7ecc9c64a47d3e12c5ee9088d92c763a38626778505ae8c15ee
  MODEL_TFLITE_URL: https://github.com/pan277942135/Yujian/releases/download/mobile-model-v0.2/fish_classifier_v0_2.tflite
  MODEL_TFLITE_SHA256: b77ea78e7f8554078ea3a79051039af1ace04f0ac4e2604da57d1dd8f0b010e7
  MODEL_TENSOR_CONTRACT_URL: https://github.com/pan277942135/Yujian/releases/download/mobile-model-v0.2/tensor_contract.json
  MODEL_TENSOR_CONTRACT_SHA256: f9a477f4f9ecd23b0162ee7f06c0f6965f005a52f17755e11f7b9283e104b1d8
  FISH_COMPLETION_WORKER_URL: http://136.111.134.128:8080
  FISH_PORTRAIT_WORKER_URL: http://34.69.75.199:8000
  FISH_PORTRAIT_WORKER_PATH: /portrait
  FISH_QWEN_REFINE_WORKER_URL: http://34.69.75.199:8002
  FISH_QWEN_REFINE_WORKER_PATH: /refine
  QWEN_GPU_PROJECT_ID: gen-lang-client-0224022273
  QWEN_GPU_ZONE: us-central1-a
  QWEN_GPU_INSTANCE: fish-completion-worker
  QWEN_GPU_NAME: NVIDIA L4
  QWEN_GPU_WORKER: fish-qwen-refine-worker
  QWEN_GPU_MODEL: Qwen Image Edit 2511
  QWEN_WORKER_BASE_URL: http://34.69.75.199:8002

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.meta.outputs.should_deploy }}
      deploy_sha: ${{ steps.meta.outputs.deploy_sha }}
      stale: ${{ steps.meta.outputs.stale }}
    steps:
      - name: Resolve deployment eligibility
        id: meta
        env:
          AUTO_DEPLOY_ENABLED: ${{ vars.YUJIAN_UAT_DEPLOY_ENABLED }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            DEPLOY_SHA="$WORKFLOW_SHA"
            CI_OK=false
            [[ "$WORKFLOW_CONCLUSION" == "success" ]] && CI_OK=true
          else
            DEPLOY_SHA="$DISPATCH_SHA"
            CI_OK=true
          fi

          SHOULD_DEPLOY=false
          if [[ "$AUTO_DEPLOY_ENABLED" == "true" && "$CI_OK" == "true" ]]; then
            SHOULD_DEPLOY=true
          fi

          STALE=false
          LATEST_MAIN="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | awk '{print $1}')"
          if [[ -n "$LATEST_MAIN" && "$DEPLOY_SHA" != "$LATEST_MAIN" ]]; then
            STALE=true
          fi

          echo "should_deploy=$SHOULD_DEPLOY" >> "$GITHUB_OUTPUT"
          echo "deploy_sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"
          echo "stale=$STALE" >> "$GITHUB_OUTPUT"

          {
            echo "### YuJian UAT deploy preflight"
            echo "- Auto deploy enabled: \`$AUTO_DEPLOY_ENABLED\`"
            echo "- CI eligible: \`$CI_OK\`"
            echo "- Deploy SHA: \`$DEPLOY_SHA\`"
            echo "- Latest main: \`$LATEST_MAIN\`"
            echo "- Stale run: \`$STALE\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: preflight
    if: needs.preflight.outputs.should_deploy == 'true' && needs.preflight.outputs.stale != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: uat
    steps:
      - name: Checkout exact CI-tested SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.deploy_sha }}
          fetch-depth: 1

      - name: Authenticate to Google Cloud with GitHub OIDC/WIF
        uses: google-github-actions/auth@v3.0.0
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3.0.1
        with:
          project_id: ${{ env.PROJECT_ID }}
          version: '>= 416.0.0'

      - name: Deploy Console runtime and smoke feedback backend
        id: deploy
        env:
          GIT_SHA: ${{ needs.preflight.outputs.deploy_sha }}
          FISH_COMPLETION_WORKER_URL: ${{ env.FISH_COMPLETION_WORKER_URL }}
          FISH_PORTRAIT_WORKER_URL: ${{ env.FISH_PORTRAIT_WORKER_URL }}
          FISH_PORTRAIT_WORKER_PATH: ${{ env.FISH_PORTRAIT_WORKER_PATH }}
          FISH_QWEN_REFINE_WORKER_URL: ${{ env.FISH_QWEN_REFINE_WORKER_URL }}
          FISH_QWEN_REFINE_WORKER_PATH: ${{ env.FISH_QWEN_REFINE_WORKER_PATH }}
          QWEN_GPU_PROJECT_ID: ${{ env.QWEN_GPU_PROJECT_ID }}
          QWEN_GPU_ZONE: ${{ env.QWEN_GPU_ZONE }}
          QWEN_GPU_INSTANCE: ${{ env.QWEN_GPU_INSTANCE }}
          QWEN_GPU_NAME: ${{ env.QWEN_GPU_NAME }}
          QWEN_GPU_WORKER: ${{ env.QWEN_GPU_WORKER }}
          QWEN_GPU_MODEL: ${{ env.QWEN_GPU_MODEL }}
          QWEN_WORKER_BASE_URL: ${{ env.QWEN_WORKER_BASE_URL }}
        run: bash scripts/deploy_console_runtime.sh

      - name: Legacy Fish Portrait Worker connectivity smoke (non-blocking)
        continue-on-error: true
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.service_url }}
          PORTRAIT_WORKER_URL: ${{ env.FISH_PORTRAIT_WORKER_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PORTRAIT_WORKER_URL"
          WORKER_HEALTH="$(curl --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 30 -fsS "$PORTRAIT_WORKER_URL/health")"
          printf '%s' "$WORKER_HEALTH" | python -c '
          import json,sys
          payload=json.load(sys.stdin)
          assert payload.get("status") == "ok", payload
          assert payload.get("service") == "fish-portrait-worker", payload
          '
          DEPLOY_HEALTH="$(curl --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 30 -fsS "$SERVICE_URL/health/deploy")"
          printf '%s' "$DEPLOY_HEALTH" | python -c '
          import json,sys
          payload=json.load(sys.stdin)
          assert payload.get("portrait_worker_configured") is True, payload
          assert payload.get("portrait_worker_url") == "http://34.69.75.199:8000", payload
          '
          {
            echo "### Legacy Fish Portrait Worker smoke (non-blocking)"
            echo "- Worker health: **PASS**"
            echo "- Cloud Run worker URL configuration: **PASS**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Temporary Qwen VM dependency diagnostic
        if: always()
        env:
          GPU_PROJECT_ID: ${{ env.QWEN_GPU_PROJECT_ID }}
          GPU_ZONE: ${{ env.QWEN_GPU_ZONE }}
          GPU_INSTANCE: ${{ env.QWEN_GPU_INSTANCE }}
        shell: bash
        run: |
          set -u
          timeout 120s gcloud compute ssh "$GPU_INSTANCE" \
            --project "$GPU_PROJECT_ID" --zone "$GPU_ZONE" --quiet \
            --command='
              echo "=== VM dependency diagnostic ==="
              echo "--- local qwen health ---"
              curl --connect-timeout 5 --max-time 20 -sS http://127.0.0.1:8002/health || true
              echo
              echo "--- local ComfyUI probes ---"
              for port in 8188 8002; do
                echo "port=$port"
                curl --connect-timeout 2 --max-time 5 -sS "http://127.0.0.1:$port/system_stats" || true
                echo
              done
              echo "--- listening ports ---"
              ss -ltnp | grep -E ":8188|:8002|:8000" || true
              echo "--- related systemd units ---"
              systemctl list-unit-files --type=service | grep -Ei "qwen|comfy|fish" || true
              systemctl --type=service --state=running | grep -Ei "qwen|comfy|fish" || true
              echo "--- docker containers ---"
              sudo docker ps -a --format "{{.Names}}\\t{{.Status}}\\t{{.Ports}}" || true
              echo "--- qwen worker journal ---"
              sudo journalctl -u fish-qwen-refine-worker -n 120 --no-pager || true
              echo "--- gpu ---"
              nvidia-smi || true
            ' 2>&1 || true

      - name: Qwen Refine Worker connectivity smoke
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.service_url }}
          FISH_QWEN_REFINE_WORKER_URL: ${{ env.FISH_QWEN_REFINE_WORKER_URL }}
          FISH_QWEN_REFINE_WORKER_PATH: ${{ env.FISH_QWEN_REFINE_WORKER_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          test "$FISH_QWEN_REFINE_WORKER_URL" = "http://34.69.75.199:8002"
          test "$FISH_QWEN_REFINE_WORKER_PATH" = "/refine"

          QWEN_WORKER_HEALTH="$(curl --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 30 -fsS "$FISH_QWEN_REFINE_WORKER_URL/health")"
          printf '%s' "$QWEN_WORKER_HEALTH" | python -c '
          import json,sys
          payload=json.load(sys.stdin)
          assert payload.get("status") in {"ok", "ready"}, payload
          if payload.get("status") == "ready":
              assert payload.get("model_loaded") is True, payload
          assert payload.get("service") == "fish-qwen-refine-worker", payload
          assert payload.get("model") == "Qwen-Image-Edit-2511", payload
          '

          RUNTIME_JSON="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json)"
          printf '%s' "$RUNTIME_JSON" | python -c '
          import json,sys
          payload=json.load(sys.stdin)
          containers=((payload.get("spec") or {}).get("template") or {}).get("spec",{}).get("containers") or []
          env={item.get("name"): item.get("value") for item in ((containers[0].get("env") if containers else []) or [])}
          assert env.get("FISH_QWEN_REFINE_WORKER_URL") == "http://34.69.75.199:8002", env
          assert env.get("FISH_QWEN_REFINE_WORKER_PATH") == "/refine", env
          assert env.get("QWEN_GPU_PROJECT_ID") == "gen-lang-client-0224022273", env
          assert env.get("QWEN_GPU_ZONE") == "us-central1-a", env
          assert env.get("QWEN_GPU_INSTANCE") == "fish-completion-worker", env
          assert env.get("QWEN_GPU_NAME") == "NVIDIA L4", env
          assert env.get("QWEN_GPU_WORKER") == "fish-qwen-refine-worker", env
          assert env.get("QWEN_GPU_MODEL") == "Qwen Image Edit 2511", env
          assert env.get("QWEN_WORKER_BASE_URL") == "http://34.69.75.199:8002", env
          '

          DEPLOY_HEALTH="$(curl --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 30 -fsS "$SERVICE_URL/health/deploy")"
          printf '%s' "$DEPLOY_HEALTH" | python -c '
          import json,sys
          payload=json.load(sys.stdin)
          assert payload.get("qwen_refine_worker_configured") is True, payload
          assert payload.get("qwen_refine_worker_url") == "http://34.69.75.199:8002", payload
          '
          {
            echo "### Qwen Refine Worker smoke"
            echo "- Worker /health: **PASS**"
            echo "- Cloud Run runtime URL/PATH: **PASS**"
            echo "- Cloud Run /health/deploy Qwen configuration: **PASS**"
          } >> "$GITHUB_STEP_SUMMARY"


      - name: Qwen Lab GPU manual control Runtime UAT
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.service_url }}
          PROJECT_ID: ${{ env.PROJECT_ID }}
          GPU_PROJECT_ID: ${{ env.QWEN_GPU_PROJECT_ID }}
          GPU_ZONE: ${{ env.QWEN_GPU_ZONE }}
          GPU_INSTANCE: ${{ env.QWEN_GPU_INSTANCE }}
        shell: bash
        run: bash scripts/qwen_gpu_manual_uat.sh

      - name: Temporary GPU cleanup after failed Qwen UAT
        if: failure()
        env:
          GPU_PROJECT_ID: ${{ env.QWEN_GPU_PROJECT_ID }}
          GPU_ZONE: ${{ env.QWEN_GPU_ZONE }}
          GPU_INSTANCE: ${{ env.QWEN_GPU_INSTANCE }}
        shell: bash
        run: |
          set -u
          gcloud compute instances stop "$GPU_INSTANCE" \
            --project "$GPU_PROJECT_ID" --zone "$GPU_ZONE" --quiet || true
          for _ in $(seq 1 36); do
            VM_STATUS="$(gcloud compute instances describe "$GPU_INSTANCE" \
              --project "$GPU_PROJECT_ID" --zone "$GPU_ZONE" --format='value(status)' 2>/dev/null || true)"
            echo "temporary-cleanup vm_status=$VM_STATUS"
            [[ "$VM_STATUS" == "TERMINATED" ]] && break
            sleep 5
          done

      - name: Fish Visible historical failed-case E2E
        id: fish_visible_e2e
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.service_url }}
          HISTORICAL_RUN_ID: FCL_20260918_145102_401f
          FISH_VISIBLE_E2E_BUCKET: yujian-model-factory-571785698442
        shell: bash
        run: |
          set -euo pipefail
          OUT="/tmp/fish-visible-e2e"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          COOKIE_JAR="$OUT/cookies.txt"

          CONSOLE_KEY="$(gcloud secrets versions access latest --secret=yujian-console-access-key --project="$PROJECT_ID")"
          test -n "$CONSOLE_KEY"
          echo "::add-mask::$CONSOLE_KEY"
          LOGIN_STATUS="$(curl --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 30 -sS -o /dev/null -w '%{http_code}' -c "$COOKIE_JAR" -X POST "$SERVICE_URL/login" --data-urlencode "access_key=$CONSOLE_KEY")"
          test "$LOGIN_STATUS" = "303"
          unset CONSOLE_KEY

          fetch_report() {
            local run_id="$1"
            local destination="$2"
            local status
            status="$(curl --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 60 -sS -b "$COOKIE_JAR" -o "$destination" -w '%{http_code}' "$SERVICE_URL/api/debug/fish-completion-lab/report/$run_id" || true)"
            [[ "$status" == "200" ]]
          }

          report_has_required_assets() {
            python3 - "$1" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)
          assets = report.get("assets") or {}
          required = (
              bool(assets.get("original")),
              bool(assets.get("sam_raw_mask") or assets.get("sam_raw_transparent") or assets.get("sam_transparent")),
              bool(assets.get("refined_visible")),
          )
          raise SystemExit(0 if all(required) else 1)
          PY
          }

          SELECTED_RUN_ID=""
          if fetch_report "$HISTORICAL_RUN_ID" "$OUT/historical_report.json" && report_has_required_assets "$OUT/historical_report.json"; then
            SELECTED_RUN_ID="$HISTORICAL_RUN_ID"
          else
            mapfile -t CANDIDATES < <(
              gcloud storage ls "gs://$FISH_VISIBLE_E2E_BUCKET/experiments/fish_completion_lab/v0.3.1/FCL_20260918_*/16_test_report.json" 2>/dev/null \
                | sed -n 's#.*/\(FCL_[^/]*\)/16_test_report.json#\1#p' \
                | sort -r
            )
            for candidate in "${CANDIDATES[@]}"; do
              if fetch_report "$candidate" "$OUT/historical_report.json" && report_has_required_assets "$OUT/historical_report.json"; then
                SELECTED_RUN_ID="$candidate"
                break
              fi
            done
          fi
          test -n "$SELECTED_RUN_ID"
          printf '%s\n' "$SELECTED_RUN_ID" > "$OUT/historical_run_id.txt"
          cp "$OUT/historical_report.json" "$OUT/00_historical_report.json"

          curl --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 120 -fsS -b "$COOKIE_JAR" \
            "$SERVICE_URL/api/debug/fish-completion-lab/media/$SELECTED_RUN_ID/original" \
            -o "$OUT/01_historical_original.png"

          PREPARE_STATUS="$(
            curl --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 900 \
              -sS -b "$COOKIE_JAR" -o "$OUT/prepare.json" -w '%{http_code}' \
              -F "file=@$OUT/01_historical_original.png;type=image/png" \
              -F "case_label=historical_failed_case:$SELECTED_RUN_ID" \
              -F "source_type=historical_failed_case" \
              "$SERVICE_URL/api/debug/fish-completion-lab/prepare"
          )"
          test "$PREPARE_STATUS" = "200"

          PREPARED_TEST_ID="$(python3 - "$OUT/prepare.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              payload = json.load(handle)
          test_id = str(payload.get("test_id") or "").strip()
          if not test_id:
              raise SystemExit("prepare did not return test_id")
          print(test_id)
          PY
          )"
          printf '%s\n' "$PREPARED_TEST_ID" > "$OUT/prepared_test_id.txt"

          curl --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 120 -fsS -b "$COOKIE_JAR" \
            "$SERVICE_URL/api/debug/fish-completion-lab/media/$PREPARED_TEST_ID/sam-raw" \
            -o "$OUT/02_sam_raw.png"
          curl --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 120 -fsS -b "$COOKIE_JAR" \
            "$SERVICE_URL/api/debug/fish-completion-lab/media/$PREPARED_TEST_ID/visible-fish-refined" \
            -o "$OUT/03_visible_fish_refined.png"

          python3 - "$OUT/prepare.json" "$OUT/quality.json" "$SELECTED_RUN_ID" "$PREPARED_TEST_ID" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              prepared = json.load(handle)
          quality = prepared.get("visible_fish_quality")
          report = prepared.get("visible_fish_quality_report") or prepared.get("statistics", {}).get("visible_quality") or {}
          if isinstance(quality, dict):
              report = quality
              status = str(quality.get("visible_fish_quality") or "INVALID").upper()
          else:
              status = str(quality or report.get("visible_fish_quality") or "INVALID").upper()
          if report.get("quality_gate_passed") is not (status == "GOOD"):
              raise SystemExit(f"quality gate mismatch: {status} / {report}")
          if "VISIBLE_REFINEMENT_REQUIRED" in (report.get("quality_reasons") or []):
              raise SystemExit("manual refinement must not be a quality warning")
          summary = {
              "historical_source_run_id": sys.argv[3],
              "prepared_source_run_id": sys.argv[4],
              "visible_fish_quality": status,
              "visible_fish_quality_report": report,
              "qwen_allowed": status == "GOOD",
              "qwen_input": "Visible Fish Refined",
          }
          with open(sys.argv[2], "w", encoding="utf-8") as handle:
              json.dump(summary, handle, ensure_ascii=False, indent=2)
          with open("/tmp/fish-visible-e2e/quality.txt", "w", encoding="utf-8") as handle:
              reasons = report.get("quality_reasons") or []
              handle.write(f"VISIBLE_FISH_QUALITY = {status}\n")
              handle.write(f"Quality Reasons = {', '.join(reasons) if reasons else '—'}\n")
              handle.write(f"Quality Gate = {'ALLOW QWEN' if status == 'GOOD' else 'BLOCK QWEN'}\n")
              handle.write("Qwen Input = Visible Fish Refined\n")
          PY

          python3 - "$OUT" <<'PY'
          import base64
          import html
          import struct
          import sys
          from pathlib import Path

          out = Path(sys.argv[1])
          items = [
              ("Original", out / "01_historical_original.png"),
              ("SAM Raw", out / "02_sam_raw.png"),
              ("Visible Fish Refined", out / "03_visible_fish_refined.png"),
          ]

          def png_dimensions(path):
              header = path.read_bytes()[:24]
              if header[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(f"not a PNG: {path}")
              return struct.unpack(">II", header[16:24])

          def data_uri(path):
              return "data:image/png;base64," + base64.b64encode(path.read_bytes()).decode("ascii")

          cards = []
          for index, (label, path) in enumerate(items):
              width, height = png_dimensions(path)
              cards.append(
                  f'<rect x="{index * 640}" y="0" width="600" height="560" fill="#ffffff"/>'
                  f'<image href="{data_uri(path)}" x="{index * 640 + 20}" y="20" '
                  f'width="560" height="500" preserveAspectRatio="xMidYMid meet"/>'
                  f'<text x="{index * 640 + 300}" y="545" text-anchor="middle" '
                  f'font-family="sans-serif" font-size="26" fill="#111827">{html.escape(label)}</text>'
              )

          quality_lines = [html.escape(line) for line in (out / "quality.txt").read_text(encoding="utf-8").splitlines()]
          quality_svg = "".join(
              f'<text x="24" y="{620 + index * 38}" font-family="sans-serif" '
              f'font-size="28" fill="#111827">{line}</text>'
              for index, line in enumerate(quality_lines)
          )
          svg = (
              '<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="820" '
              'viewBox="0 0 1920 820">'
              '<rect width="1920" height="820" fill="#f8fafc"/>'
              + "".join(cards)
              + quality_svg
              + "</svg>"
          )
          (out / "05_failed_case_e2e_screenshot.svg").write_text(svg, encoding="utf-8")
          PY

          QUALITY_STATUS="$(python3 - "$OUT/quality.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              print(json.load(handle)["visible_fish_quality"])
          PY
          )"

          python3 - "$OUT/prepare.json" "$OUT/qwen_payload.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              prepared = json.load(handle)
          assets = prepared.get("assets") or {}
          quality = prepared.get("visible_fish_quality")
          report = prepared.get("visible_fish_quality_report") or quality or {}
          status = str(quality.get("visible_fish_quality") if isinstance(quality, dict) else quality or report.get("visible_fish_quality") or "INVALID").upper()
          payload = {
              "mode": "fish_preserve_refine_qwen_v1",
              "source_run_id": prepared["test_id"],
              "original_image_uri": assets.get("original"),
              "sam_raw_uri": assets.get("sam_raw_transparent") or assets.get("sam_transparent") or assets.get("sam_raw_mask"),
              "visible_fish_refined_uri": assets.get("refined_visible"),
              "qwen_input_uri": assets.get("refined_visible"),
              "visible_fish_quality": status,
              "steps": 20,
              "seed": None,
              "auto_straighten": False,
              "prompt": "Restore and refine this fish into a clean, complete, realistic fish portrait. Keep the exact same fish identity, species traits, body proportions, head shape, fin structure, scale texture, and natural color pattern. Use the visible fish as the only identity reference. Complete the missing or occluded fish body parts naturally. Remove all non-fish objects and do not keep any human hand, fingers, tools, nets, hooks, ropes, buckets, or other foreign objects. The result should be a single complete fish, realistic, clean, natural, and high-detail.",
              "negative_prompt": "human hand, fingers, arm, person, tool, fishing net, hook, rope, bucket, extra fish, duplicated fish, changed species, wrong anatomy, deformed body, cartoon, painting, fake texture, unrealistic fins, broken tail",
              "qwen": {"steps": 20, "seed": None, "auto_straighten": False},
          }
          with open(sys.argv[2], "w", encoding="utf-8") as handle:
              json.dump(payload, handle, ensure_ascii=False, indent=2)
          PY

          if [[ "$QUALITY_STATUS" != "GOOD" ]]; then
            BLOCKED_STATUS="$(
              curl --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 120 \
                -sS -b "$COOKIE_JAR" -o "$OUT/qwen_blocked.json" -w '%{http_code}' \
                -H 'Content-Type: application/json' \
                --data-binary "@$OUT/qwen_payload.json" \
                "$SERVICE_URL/api/platform/portrait/jobs"
            )"
            test "$BLOCKED_STATUS" = "422"
            python3 - "$OUT/qwen_blocked.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              body = json.load(handle)
          detail = body.get("detail") if isinstance(body, dict) else {}
          code = detail.get("error_code") if isinstance(detail, dict) else None
          if code != "VISIBLE_FISH_QUALITY_GATE_BLOCKED":
              raise SystemExit(f"unexpected gate response: {body}")
          PY
            printf '%s\n' "Qwen correctly blocked at quality=$QUALITY_STATUS" > "$OUT/qwen_status.txt"
          else
            JOB_STATUS="$(
              curl --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 120 \
                -sS -b "$COOKIE_JAR" -o "$OUT/qwen_job.json" -w '%{http_code}' \
                -H 'Content-Type: application/json' \
                --data-binary "@$OUT/qwen_payload.json" \
                "$SERVICE_URL/api/platform/portrait/jobs"
            )"
            test "$JOB_STATUS" = "200"
            QWEN_RUN_ID="$(python3 - "$OUT/qwen_job.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              payload = json.load(handle)
          print(payload.get("run_id") or payload.get("pipeline_run_id") or "")
          PY
            )"
            test -n "$QWEN_RUN_ID"
            printf '%s\n' "$QWEN_RUN_ID" > "$OUT/qwen_run_id.txt"
            for _ in $(seq 1 120); do
              curl --retry 2 --retry-all-errors --retry-delay 1 --connect-timeout 10 --max-time 30 -fsS -b "$COOKIE_JAR" \
                "$SERVICE_URL/api/platform/pipeline/$QWEN_RUN_ID" -o "$OUT/qwen_pipeline.json"
              status="$(python3 - "$OUT/qwen_pipeline.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              print(str(json.load(handle).get("status") or "").upper())
          PY
              )"
              [[ "$status" == "SUCCESS" || "$status" == "FAILED" ]] && break
              sleep 15
            done
            test "$status" = "SUCCESS"
            curl --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 120 -fsS -b "$COOKIE_JAR" \
              "$SERVICE_URL/api/platform/portrait/results/$QWEN_RUN_ID" -o "$OUT/qwen_result.json"
            python3 - "$OUT/qwen_result.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              result = json.load(handle)
          metadata = result.get("metadata") or {}
          required = ("qwen_input_uri", "visible_fish_quality", "visible_fish_quality_report", "worker_model", "elapsed_ms", "refine_result_uri")
          missing = [key for key in required if metadata.get(key) in (None, "", {})]
          if missing:
              raise SystemExit(f"Qwen telemetry missing: {missing}; metadata={metadata}")
          if metadata.get("qwen_input_uri") != metadata.get("visible_fish_refined_uri"):
              raise SystemExit(f"Qwen input mismatch: {metadata}")
          if metadata.get("protected_compose_status") != "PENDING" or result.get("final_image") is not None:
              raise SystemExit(f"Final Asset must remain pending: {result}")
          PY
            curl --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 120 -fsS -b "$COOKIE_JAR" \
              "$SERVICE_URL/api/platform/portrait/results/$QWEN_RUN_ID/media/refined" \
              -o "$OUT/06_qwen_refined_candidate.png"
            printf '%s\n' "Qwen candidate SUCCESS; Final Asset remains PENDING" > "$OUT/qwen_status.txt"
          fi

          rm -f "$COOKIE_JAR"

          {
            echo "Fish Visible historical failed-case E2E"
            echo "Historical source run: $SELECTED_RUN_ID"
            echo "Prepared run: $PREPARED_TEST_ID"
            echo "Quality gate: $QUALITY_STATUS"
            echo "Qwen path: $(tr -d '\n' < "$OUT/qwen_status.txt")"
          } >> "$GITHUB_STEP_SUMMARY"


      - name: Fish Visible manual correction and GOOD Qwen E2E
        id: fish_visible_qwen_e2e
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.service_url }}
        shell: bash
        run: |
          set -euo pipefail
          OUT="/tmp/fish-visible-e2e"
          INITIAL_QUALITY="$(python3 - "$OUT/quality.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              print(json.load(handle)["visible_fish_quality"])
          PY
          )"

          if [[ "$INITIAL_QUALITY" == "GOOD" ]]; then
            printf '%s\n' "Initial Visible Fish quality was already GOOD; Qwen result is recorded by the preceding step." > "$OUT/qwen_e2e_status.txt"
            exit 0
          fi

          COOKIE_JAR="$OUT/qwen-cookies.txt"
          trap 'rm -f "$COOKIE_JAR"' EXIT
          CONSOLE_KEY="$(gcloud secrets versions access latest --secret=yujian-console-access-key --project="$PROJECT_ID")"
          test -n "$CONSOLE_KEY"
          echo "::add-mask::$CONSOLE_KEY"
          LOGIN_STATUS="$(curl --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 30 -sS -o /dev/null -w '%{http_code}' -c "$COOKIE_JAR" -X POST "$SERVICE_URL/login" --data-urlencode "access_key=$CONSOLE_KEY")"
          test "$LOGIN_STATUS" = "303"
          unset CONSOLE_KEY

          python3 - "$OUT/02_sam_raw.png" "$OUT/manual_masks.json" "$OUT/prepared_test_id.txt" <<'PY'
          import base64
          import json
          import struct
          import sys
          import zlib
          from pathlib import Path

          source_path = Path(sys.argv[1])
          output_path = Path(sys.argv[2])
          test_id = Path(sys.argv[3]).read_text(encoding="utf-8").strip()
          if not test_id:
              raise SystemExit("prepared test_id is empty")
          png = source_path.read_bytes()
          if png[:8] != b"\x89PNG\r\n\x1a\n":
              raise SystemExit("SAM Raw evidence is not PNG")

          offset = 8
          idat = bytearray()
          width = height = None
          color_type = None
          while offset < len(png):
              length = struct.unpack(">I", png[offset:offset + 4])[0]
              kind = png[offset + 4:offset + 8]
              payload = png[offset + 8:offset + 8 + length]
              offset += 12 + length
              if kind == b"IHDR":
                  width, height, bit_depth, color_type, compression, filtering, interlace = struct.unpack(">IIBBBBB", payload)
                  if bit_depth != 8 or color_type != 6 or interlace != 0:
                      raise SystemExit("expected non-interlaced 8-bit RGBA PNG")
              elif kind == b"IDAT":
                  idat.extend(payload)
              elif kind == b"IEND":
                  break

          decoded = zlib.decompress(bytes(idat))
          bytes_per_pixel = 4
          stride = width * bytes_per_pixel
          rows = []
          previous = bytearray(stride)
          cursor = 0

          def paeth(a, b, c):
              estimate = a + b - c
              pa = abs(estimate - a)
              pb = abs(estimate - b)
              pc = abs(estimate - c)
              return a if pa <= pb and pa <= pc else b if pb <= pc else c

          for _ in range(height):
              filter_type = decoded[cursor]
              cursor += 1
              row = bytearray(decoded[cursor:cursor + stride])
              cursor += stride
              for index in range(stride):
                  left = row[index - bytes_per_pixel] if index >= bytes_per_pixel else 0
                  up = previous[index]
                  upper_left = previous[index - bytes_per_pixel] if index >= bytes_per_pixel else 0
                  if filter_type == 1:
                      row[index] = (row[index] + left) & 255
                  elif filter_type == 2:
                      row[index] = (row[index] + up) & 255
                  elif filter_type == 3:
                      row[index] = (row[index] + ((left + up) // 2)) & 255
                  elif filter_type == 4:
                      row[index] = (row[index] + paeth(left, up, upper_left)) & 255
                  elif filter_type != 0:
                      raise SystemExit(f"unsupported PNG filter {filter_type}")
              rows.append(row)
              previous = row

          alpha = [[rows[y][x * 4 + 3] > 127 for x in range(width)] for y in range(height)]
          visited = [[False] * width for _ in range(height)]
          components = []
          for y in range(height):
              for x in range(width):
                  if not alpha[y][x] or visited[y][x]:
                      continue
                  stack = [(y, x)]
                  visited[y][x] = True
                  points = []
                  while stack:
                      cy, cx = stack.pop()
                      points.append((cy, cx))
                      for ny in range(max(0, cy - 1), min(height, cy + 2)):
                          for nx in range(max(0, cx - 1), min(width, cx + 2)):
                              if alpha[ny][nx] and not visited[ny][nx]:
                                  visited[ny][nx] = True
                                  stack.append((ny, nx))
                  components.append(points)
          components.sort(key=len, reverse=True)
          if len(components) < 2 or len(components[1]) < 100:
              raise SystemExit(f"expected a separated visible fish fin component: {[len(x) for x in components[:5]]}")

          keep = [[False] * width for _ in range(height)]
          for component in components[:2]:
              for y, x in component:
                  keep[y][x] = True

          distance = None
          for y, x in components[0]:
              for yy, xx in components[1]:
                  current = (y - yy) ** 2 + (x - xx) ** 2
                  if distance is None or current < distance[0]:
                      distance = (current, y, x, yy, xx)
          _, y1, x1, y2, x2 = distance
          added = [[False] * width for _ in range(height)]
          steps = max(abs(y2 - y1), abs(x2 - x1))
          for index in range(steps + 1):
              ratio = index / max(1, steps)
              cy = round(y1 + (y2 - y1) * ratio)
              cx = round(x1 + (x2 - x1) * ratio)
              for dy in range(-3, 4):
                  for dx in range(-3, 4):
                      if dy * dy + dx * dx <= 9 and 0 <= cy + dy < height and 0 <= cx + dx < width:
                          added[cy + dy][cx + dx] = True

          removed = [[alpha[y][x] and not keep[y][x] for x in range(width)] for y in range(height)]

          def png_chunk(kind, payload):
              return (
                  struct.pack(">I", len(payload))
                  + kind
                  + payload
                  + struct.pack(">I", zlib.crc32(kind + payload) & 0xffffffff)
              )

          def gray_png(mask):
              raw = b"".join(b"\x00" + bytes(255 if value else 0 for value in row) for row in mask)
              return (
                  b"\x89PNG\r\n\x1a\n"
                  + png_chunk(b"IHDR", struct.pack(">IIBBBBB", width, height, 8, 0, 0, 0, 0))
                  + png_chunk(b"IDAT", zlib.compress(raw, 9))
                  + png_chunk(b"IEND", b"")
              )

          blank = [[False] * width for _ in range(height)]
          payload = {
              "test_id": test_id,
              "masks": {
                  "visible_add": "data:image/png;base64," + base64.b64encode(gray_png(added)).decode("ascii"),
                  "remove": "data:image/png;base64," + base64.b64encode(gray_png(removed)).decode("ascii"),
                  "completion_mask": "data:image/png;base64," + base64.b64encode(gray_png(blank)).decode("ascii"),
              },
              "manual_correction_strategy": "keep_largest_fish_and_separated_fin; bridge_visible_fish_gap; remove_small_components",
              "component_sizes_before": [len(component) for component in components[:8]],
              "added_pixels": sum(sum(row) for row in added),
              "removed_pixels": sum(sum(row) for row in removed),
          }
          with output_path.open("w", encoding="utf-8") as handle:
              json.dump(payload, handle, ensure_ascii=False)
          with (output_path.parent / "manual_correction_plan.json").open("w", encoding="utf-8") as handle:
              json.dump({key: value for key, value in payload.items() if key != "masks"}, handle, ensure_ascii=False, indent=2)
          PY

          MASK_STATUS="$(
            curl --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 120 \
              -sS -b "$COOKIE_JAR" -o "$OUT/manual_correction.json" -w '%{http_code}' \
              -H 'Content-Type: application/json' \
              --data-binary "@$OUT/manual_masks.json" \
              "$SERVICE_URL/api/debug/fish-completion-lab/masks"
          )"
          test "$MASK_STATUS" = "200"

          MANUAL_QUALITY="$(python3 - "$OUT/manual_correction.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              payload = json.load(handle)
          quality = payload.get("visible_fish_quality") or payload.get("statistics", {}).get("visible_quality") or {}
          status = quality.get("visible_fish_quality") if isinstance(quality, dict) else quality
          print(str(status or "INVALID").upper())
          if str(status or "INVALID").upper() != "GOOD":
              raise SystemExit(f"manual correction did not reach GOOD: {payload}")
          PY
          )"
          printf '%s\n' "$MANUAL_QUALITY" > "$OUT/quality_after_correction.txt"
          cp "$OUT/manual_correction.json" "$OUT/quality_after_correction.json"
          TEST_ID="$(cat "$OUT/prepared_test_id.txt")"
          curl --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 120 -fsS -b "$COOKIE_JAR" \
            "$SERVICE_URL/api/debug/fish-completion-lab/media/$TEST_ID/visible-fish-refined" \
            -o "$OUT/04_visible_fish_refined_corrected.png"

          python3 - "$OUT/prepare.json" "$OUT/manual_correction.json" "$OUT/qwen_payload_after_correction.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              prepared = json.load(handle)
          with open(sys.argv[2], encoding="utf-8") as handle:
              corrected = json.load(handle)
          original_assets = prepared.get("assets") or {}
          corrected_assets = corrected.get("assets") or {}
          quality = corrected.get("visible_fish_quality") or corrected.get("statistics", {}).get("visible_quality") or {}
          status = str(quality.get("visible_fish_quality") if isinstance(quality, dict) else quality or "INVALID").upper()
          if status != "GOOD":
              raise SystemExit(f"correction quality is {status}")
          payload = {
              "mode": "fish_preserve_refine_qwen_v1",
              "source_run_id": prepared["test_id"],
              "original_image_uri": original_assets.get("original"),
              "sam_raw_uri": original_assets.get("sam_raw_transparent") or original_assets.get("sam_transparent") or original_assets.get("sam_raw_mask"),
              "visible_fish_refined_uri": corrected_assets.get("visible_fish_refined") or corrected_assets.get("refined_visible"),
              "qwen_input_uri": corrected_assets.get("visible_fish_refined") or corrected_assets.get("refined_visible"),
              "visible_fish_quality": "GOOD",
              "steps": 20,
              "seed": None,
              "auto_straighten": False,
              "prompt": "Restore and refine this fish into a clean, complete, realistic fish portrait. Keep the exact same fish identity, species traits, body proportions, head shape, fin structure, scale texture, and natural color pattern. Use the visible fish as the only identity reference. Complete the missing or occluded fish body parts naturally. Remove all non-fish objects and do not keep any human hand, fingers, tools, nets, hooks, ropes, buckets, or other foreign objects. The result should be a single complete fish, realistic, clean, natural, and high-detail.",
              "negative_prompt": "human hand, fingers, arm, person, tool, fishing net, hook, rope, bucket, extra fish, duplicated fish, changed species, wrong anatomy, deformed body, cartoon, painting, fake texture, unrealistic fins, broken tail",
              "qwen": {"steps": 20, "seed": None, "auto_straighten": False},
          }
          with open(sys.argv[3], "w", encoding="utf-8") as handle:
              json.dump(payload, handle, ensure_ascii=False, indent=2)
          PY

          JOB_STATUS="$(
            curl --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 120 \
              -sS -b "$COOKIE_JAR" -o "$OUT/qwen_job_after_correction.json" -w '%{http_code}' \
              -H 'Content-Type: application/json' \
              --data-binary "@$OUT/qwen_payload_after_correction.json" \
              "$SERVICE_URL/api/platform/portrait/jobs"
          )"
          test "$JOB_STATUS" = "200"

          QWEN_RUN_ID="$(python3 - "$OUT/qwen_job_after_correction.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              payload = json.load(handle)
          print(payload.get("run_id") or payload.get("pipeline_run_id") or "")
          PY
          )"
          test -n "$QWEN_RUN_ID"
          printf '%s\n' "$QWEN_RUN_ID" > "$OUT/qwen_run_id_after_correction.txt"

          for _ in $(seq 1 120); do
            curl --retry 2 --retry-all-errors --retry-delay 1 --connect-timeout 10 --max-time 30 -fsS -b "$COOKIE_JAR" \
              "$SERVICE_URL/api/platform/pipeline/$QWEN_RUN_ID" -o "$OUT/qwen_pipeline_after_correction.json"
            status="$(python3 - "$OUT/qwen_pipeline_after_correction.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              print(str(json.load(handle).get("status") or "").upper())
          PY
            )"
            [[ "$status" == "SUCCESS" || "$status" == "FAILED" ]] && break
            sleep 15
          done
          test "$status" = "SUCCESS"

          curl --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 120 -fsS -b "$COOKIE_JAR" \
            "$SERVICE_URL/api/platform/portrait/results/$QWEN_RUN_ID" \
            -o "$OUT/qwen_result_after_correction.json"
          python3 - "$OUT/qwen_result_after_correction.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              result = json.load(handle)
          metadata = result.get("metadata") or {}
          required = ("qwen_input_uri", "visible_fish_quality", "visible_fish_quality_report", "worker_model", "elapsed_ms", "refine_result_uri")
          missing = [key for key in required if metadata.get(key) in (None, "", {})]
          if missing:
              raise SystemExit(f"Qwen telemetry missing: {missing}; metadata={metadata}")
          if metadata.get("visible_fish_quality") != "GOOD":
              raise SystemExit(f"Qwen quality mismatch: {metadata}")
          if metadata.get("qwen_input_uri") != metadata.get("visible_fish_refined_uri"):
              raise SystemExit(f"Qwen input mismatch: {metadata}")
          if metadata.get("protected_compose_status") != "PENDING" or result.get("final_image") is not None:
              raise SystemExit(f"Final Asset must remain pending: {result}")
          PY
          curl --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 120 -fsS -b "$COOKIE_JAR" \
            "$SERVICE_URL/api/platform/portrait/results/$QWEN_RUN_ID/media/refined" \
            -o "$OUT/06_qwen_refined_candidate.png"
          printf '%s\n' "GOOD after visible correction; Qwen candidate SUCCESS; Final Asset remains PENDING" > "$OUT/qwen_e2e_status.txt"

          {
            echo "Manual correction quality: $MANUAL_QUALITY"
            echo "Qwen run: $QWEN_RUN_ID"
            echo "Qwen candidate: SUCCESS"
            echo "Final Asset: PENDING (Protected Compose)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Fish Visible E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fish-visible-failed-case-e2e-${{ github.run_id }}
          path: /tmp/fish-visible-e2e
          if-no-files-found: warn

      - name: Checkout Android app main
        uses: actions/checkout@v4
        with:
          repository: pan277942135/Yujian_App
          ref: main
          path: android-app
          fetch-depth: 1

      - name: Download verified MODEL_M1_v0.6 mobile asset and tensor contract
        working-directory: android-app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          curl -fL --retry 3 --retry-delay 2 \
            -o app/src/main/assets/fish_classifier.tflite \
            "$MODEL_TFLITE_URL"
          curl -fL --retry 3 --retry-delay 2 \
            -o app/src/main/assets/model_tensor_contract.json \
            "$MODEL_TENSOR_CONTRACT_URL"
          echo "$MODEL_TFLITE_SHA256  app/src/main/assets/fish_classifier.tflite" | sha256sum -c -
          echo "$MODEL_TENSOR_CONTRACT_SHA256  app/src/main/assets/model_tensor_contract.json" | sha256sum -c -

      - name: Verify Android production model asset
        working-directory: android-app
        run: python3 scripts/verify_production_model.py

      - name: Download and install verified DET_FISH_v0.1 Android bundle
        working-directory: android-app
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 -o /tmp/detector_bundle.zip "$DETECTOR_BUNDLE_URL"
          echo "$DETECTOR_BUNDLE_SHA256  /tmp/detector_bundle.zip" | sha256sum -c -
          rm -rf /tmp/detector_bundle
          mkdir -p /tmp/detector_bundle app/src/main/assets app/src/androidTest/assets/detector
          unzip -q /tmp/detector_bundle.zip -d /tmp/detector_bundle
          cp /tmp/detector_bundle/fish_detector_yolox_nano_v0_1.onnx app/src/main/assets/
          cp /tmp/detector_bundle/detector_metadata.json app/src/main/assets/
          cp /tmp/detector_bundle/recognition_pipeline_v1.json app/src/main/assets/
          cp /tmp/detector_bundle/golden_cases.json app/src/androidTest/assets/detector/
          rm -rf app/src/androidTest/assets/detector/golden
          cp -R /tmp/detector_bundle/golden app/src/androidTest/assets/detector/golden

      - name: Verify production detector model and contract
        working-directory: android-app
        run: python3 scripts/verify_production_detector.py

      - name: Set up JDK 17 for Android UAT
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9 for Android UAT
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Resolve masked Android UAT feedback configuration
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.service_url }}
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_JSON="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json)"
          INGEST_KEY="$(printf '%s' "$SERVICE_JSON" | python -c 'import json,sys; d=json.load(sys.stdin); containers=((d.get("spec") or {}).get("template") or {}).get("spec",{}).get("containers") or []; env=(containers[0].get("env") if containers else []) or []; print(next((x.get("value","") for x in env if x.get("name")=="FEEDBACK_INGEST_KEY"), ""))')"
          if [[ -z "$INGEST_KEY" ]]; then
            echo "Cloud Run FEEDBACK_INGEST_KEY is not available as a UAT runtime value" >&2
            exit 1
          fi
          echo "::add-mask::$INGEST_KEY"
          echo "YUJIAN_FEEDBACK_BASE_URL=$SERVICE_URL" >> "$GITHUB_ENV"
          echo "YUJIAN_FEEDBACK_INGEST_KEY=$INGEST_KEY" >> "$GITHUB_ENV"
          echo "YUJIAN_API_BASE_URL=$SERVICE_URL" >> "$GITHUB_ENV"

      - name: Android API 28 production inference + feedback E2E smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: cd android-app && gradle :app:connectedDebugAndroidTest --stacktrace

      - name: Publish deployment summary
        env:
          DEPLOY_SHA: ${{ needs.preflight.outputs.deploy_sha }}
          SERVICE_URL: ${{ steps.deploy.outputs.service_url }}
          REVISION: ${{ steps.deploy.outputs.revision }}
