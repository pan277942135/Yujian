<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>accepted_bbox 补确认 · 渔见 AI</title>
<style>
body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f6f7f8;color:#171717}
main{max-width:1440px;margin:0 auto;padding:22px}.toolbar,.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:12px;margin:14px 0}.toolbar .spacer{flex:1}
select,input,button{font:inherit;border:1px solid #d1d5db;border-radius:8px;padding:8px;background:#fff}button{cursor:pointer;font-weight:650}.primary{background:#111827;color:#fff}.soft{background:#f3f4f6}.banner{display:none;white-space:pre-wrap;padding:10px 12px;border-radius:9px;background:#eef2ff;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:#fff;border:2px solid transparent;border-radius:12px;padding:10px}.card.selected{border-color:#2563eb}.card.confirmed{border-color:#059669}.photoStage{position:relative;width:100%;aspect-ratio:4/3;background:#111;border-radius:8px;overflow:hidden}.photoStage.bboxEditing{cursor:crosshair;user-select:none}.bboxTools{display:flex;gap:5px;align-items:center;flex-wrap:wrap}.photo{width:100%;height:100%;object-fit:contain;background:#111;border-radius:8px}.bboxOverlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.bboxOverlay rect{fill:rgba(185,28,28,.10);stroke:#b91c1c;stroke-width:5px;vector-effect:non-scaling-stroke}.meta{font-size:12px;display:grid;gap:5px;margin-top:8px}.bbox{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.bbox input{width:100%;padding:5px;box-sizing:border-box;font-size:12px}.muted{color:#6b7280;font-size:13px}.pill{display:inline-block;padding:3px 7px;border-radius:999px;background:#f3f4f6;font-size:11px}.good{background:#ecfdf5}.warn{background:#fff7ed}.empty{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:70px;text-align:center;color:#6b7280}@media(max-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="app-nav"><a href="/datasets">数据集</a></header>
{% include "_mobile_ux.html" %}
<main>
<h1>历史 accepted_bbox 补确认</h1>
<div class="muted">只显示人工已通过但尚未完成 accepted_bbox 的历史图片。确认后的数据才进入累计人工通过池，并可用于 Dataset Freeze 与训练。</div>
<div id="banner" class="banner"></div>
<div class="toolbar">
<select id="status"><option value="MISSING">待补确认</option><option value="ALL">全部</option><option value="ACCEPTED">已确认</option></select>
<input id="q" placeholder="批次 / 图片 ID / 文件名"><button class="soft" onclick="load()">筛选</button>
<label><input id="selectAll" type="checkbox" onchange="toggleAll(this.checked)"> 全选</label>
<button class="soft" onclick="acceptCandidates()">批量接受候选框</button><button class="primary" onclick="submitSelected()">提交选中</button>
<span id="summary" class="muted"></span><span id="count" class="muted"></span>
</div>
<div id="content"></div>
<div class="actions" style="margin-top:14px"><button onclick="prevPage()">← 上一页</button><span id="page" class="muted"></span><button onclick="nextPage()">下一页 →</button></div>
</main>
<script>
let items=[],offset=0,limit=24;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function api(url,opts){const r=await fetch(url,opts);const t=await r.text();let d;try{d=JSON.parse(t)}catch{d=t}if(!r.ok)throw new Error(d.detail?.reason||d.detail||t);return d}
function msg(t,err=false){const b=document.getElementById('banner');b.style.display='block';b.style.background=err?'#fff1f2':'#eef2ff';b.textContent=t}
function boxValues(i){return [0,1,2,3].map(n=>Number(document.getElementById('b-'+i+'-'+n)?.value||0))}
function hasBox(i){const v=boxValues(i);return v[2]>0&&v[3]>0&&v[0]>=0&&v[1]>=0&&v[0]+v[2]<=1&&v[1]+v[3]<=1}
function itemKey(x){return [x.batch_id,x.image_id].join('::')}
function syncSelectionsFromDom(){items.forEach((x,i)=>{const e=document.getElementById('pick-'+i);if(e)x._selected=e.checked})}
function selected(){syncSelectionsFromDom();return items.map((x,i)=>x._selected?i:null).filter(x=>x!==null)}
function toggleAll(on){items.forEach((x,i)=>{x._selected=on;const e=document.getElementById('pick-'+i);if(e)e.checked=on});renderSelection()}
function renderSelection(){items.forEach((x,i)=>{const e=document.getElementById('pick-'+i);if(e)e.checked=Boolean(x._selected);document.getElementById('card-'+i)?.classList.toggle('selected',Boolean(x._selected))});const all=document.getElementById('selectAll');if(all)all.checked=items.length>0&&items.every(x=>x._selected);document.getElementById('count').textContent='已选 '+items.filter(x=>x._selected).length+' 张'}
function candidateText(x){return x._bboxLabel||(x.candidate_bbox?'候选框已生成':'无候选框，请点击重新识别')}
function setBboxInputs(i,b){[0,1,2,3].forEach(n=>{const e=document.getElementById('b-'+i+'-'+n);if(e)e.value=Number(b?.[n]||0)});syncBbox(i)}
function setBboxStatus(i,text,kind='warn'){const e=document.getElementById('bbox-status-'+i);if(e){e.textContent=text;e.className='muted '+kind}const pill=document.getElementById('bbox-pill-'+i);if(pill){pill.textContent=kind==='good'?'CANDIDATE':'MISSING';pill.className='pill '+(kind==='good'?'good':'warn')}}
function clearBbox(i){const x=items[i];if(!x)return;x.accepted_bbox=null;x.candidate_bbox=null;x.bbox_status='MISSING';x._bboxLabel='已清空，请手动框选或重新识别';setBboxInputs(i,[0,0,0,0]);setBboxStatus(i,x._bboxLabel,'warn');msg(x.image_id+' 已清空框，可手动框选或重新识别')}
function bboxPoint(i,ev){const stage=document.querySelector('#card-'+i+' .photoStage');const img=document.getElementById('photo-'+i);if(!stage||!img)return null;const sr=stage.getBoundingClientRect();const nw=img.naturalWidth||1,nh=img.naturalHeight||1;const scale=Math.min(sr.width/nw,sr.height/nh);const rw=nw*scale,rh=nh*scale;const ox=(sr.width-rw)/2,oy=(sr.height-rh)/2;return [Math.max(0,Math.min(1,(ev.clientX-sr.left-ox)/rw)),Math.max(0,Math.min(1,(ev.clientY-sr.top-oy)/rh))]}
function startManualBbox(i){const stage=document.querySelector('#card-'+i+' .photoStage');if(!stage)return;if(stage._manualCleanup)stage._manualCleanup();let start=null,active=false;const down=ev=>{if(ev.button!==undefined&&ev.button!==0)return;const p=bboxPoint(i,ev);if(!p)return;ev.preventDefault();start=p;active=true;stage.classList.add('bboxEditing');stage.setPointerCapture?.(ev.pointerId);setBboxStatus(i,'拖动图片框选','warn')};const move=ev=>{if(!active)return;const p=bboxPoint(i,ev);if(!p)return;const b=[Math.min(start[0],p[0]),Math.min(start[1],p[1]),Math.abs(p[0]-start[0]),Math.abs(p[1]-start[1])];setBboxInputs(i,b)};const up=ev=>{if(!active)return;move(ev);active=false;stage.releasePointerCapture?.(ev.pointerId);stage.classList.remove('bboxEditing');const b=boxValues(i);if(b[2]<0.005||b[3]<0.005){clearBbox(i);setBboxStatus(i,'框太小，已清空，请重新拖动','warn')}else{items[i].accepted_bbox=null;items[i].candidate_bbox=b;items[i].bbox_status='CANDIDATE';items[i]._bboxLabel='已手动框选，请检查后提交';setBboxStatus(i,items[i]._bboxLabel,'good');msg(items[i].image_id+' 已完成手动框选')}start=null};stage.addEventListener('pointerdown',down);stage.addEventListener('pointermove',move);stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);stage._manualCleanup=()=>{stage.removeEventListener('pointerdown',down);stage.removeEventListener('pointermove',move);stage.removeEventListener('pointerup',up);stage.removeEventListener('pointercancel',up);stage.classList.remove('bboxEditing')};setBboxStatus(i,'拖动图片框选','warn');msg('请在 '+items[i].image_id+' 图片上按住鼠标拖动框选')}
function syncBbox(i){const img=document.getElementById('photo-'+i);const svg=document.getElementById('bbox-overlay-'+i);const rect=document.getElementById('bbox-rect-'+i);if(!img||!svg||!rect)return;const width=img.naturalWidth||1;const height=img.naturalHeight||1;svg.setAttribute('viewBox','0 0 '+width+' '+height);const b=boxValues(i);const valid=b[2]>0&&b[3]>0&&b[0]>=0&&b[1]>=0&&b[0]+b[2]<=1&&b[1]+b[3]<=1;if(!valid){rect.style.display='none';return}rect.setAttribute('x',b[0]*width);rect.setAttribute('y',b[1]*height);rect.setAttribute('width',b[2]*width);rect.setAttribute('height',b[3]*height);rect.style.display='block'}
function render(){const c=document.getElementById('content');if(!items.length){c.innerHTML='<div class="empty">当前没有需要补确认的图片。</div>';document.getElementById('page').textContent='';return}c.innerHTML='<div class="grid">'+items.map((x,i)=>{const b=x.accepted_bbox||x.candidate_bbox||[0,0,0,0];return '<div id="card-'+i+'" class="card '+(x.bbox_status==='ACCEPTED'?'confirmed':'')+'"><div class="photoStage"><img id="photo-'+i+'" class="photo" loading="lazy" src="'+x.media_url+'" onload="syncBbox('+i+')"><svg id="bbox-overlay-'+i+'" class="bboxOverlay" viewBox="0 0 1 1" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><rect id="bbox-rect-'+i+'" x="0" y="0" width="0" height="0" style="display:none"></rect></svg></div><div class="meta"><div><input id="pick-'+i+'" type="checkbox" '+(x._selected?'checked':'')+' onchange="items['+i+']._selected=this.checked;renderSelection()"> <b>'+esc(x.image_id)+'</b> <span id="bbox-pill-'+i+'" class="pill '+(x.bbox_status==='ACCEPTED'?'good':'warn')+'">'+esc(x.bbox_status)+'</span></div><div>批次：'+esc(x.batch_id)+' · 鱼种：'+esc(x.truth_species||'-')+'</div><div id="bbox-status-'+i+'" class="muted">'+candidateText(x)+'</div><div class="bbox">'+b.map((v,n)=>'<input id="b-'+i+'-'+n+'" type="number" min="0" max="1" step="0.000001" value="'+Number(v||0)+'" oninput="syncBbox('+i+')" placeholder="'+['x','y','w','h'][n]+'">').join('')+'</div><div class="bboxTools"><button class="soft" onclick="clearBbox('+i+')">清空框</button><button class="soft" onclick="startManualBbox('+i+')">手动框选</button><button class="soft" onclick="reidentify('+i+')">重新识别</button></div></div></div>'}).join('')+'</div>';renderSelection();document.getElementById('page').textContent=(offset+1)+'-'+(offset+items.length)}
async function load(){syncSelectionsFromDom();const selectedKeys=new Set(items.filter(x=>x._selected).map(itemKey));try{const [s,d]=await Promise.all([api('/api/dataset-accepted-bbox/summary'),api('/api/dataset-accepted-bbox/items?'+new URLSearchParams({status:document.getElementById('status').value,q:document.getElementById('q').value,limit:String(limit),offset:String(offset)}))]);document.getElementById('summary').textContent='累计人工通过池 '+s.accepted_bbox_pool+' · 待补确认 '+s.accepted_bbox_missing+' · 候选框 '+s.candidate_bbox_count;items=d.items||[];items.forEach(x=>x._selected=selectedKeys.has(itemKey(x)));render()}catch(e){msg(e.message,true)}}
function acceptCandidates(){const ids=selected();if(!ids.length){msg('请先勾选图片',true);return}ids.forEach(i=>{const x=items[i];if(!x.candidate_bbox){return}x._accept=true;const b=x.candidate_bbox;[0,1,2,3].forEach(n=>document.getElementById('b-'+i+'-'+n).value=b[n]);syncBbox(i)});msg('已将选中图片的候选框填入人工确认框，请检查后提交。')}
async function reidentify(i){syncSelectionsFromDom();const old=items[i];if(!old)return;const imageId=old.image_id,wasSelected=Boolean(old._selected);try{const d=await api('/api/dataset-accepted-bbox/'+encodeURIComponent(old.batch_id)+'/'+encodeURIComponent(old.image_id)+'/reidentify',{method:'POST'});d._selected=wasSelected;items[i]=d;render();msg(imageId+' 已重新识别，已保留当前勾选状态')}catch(e){msg(e.message,true)}}
async function submitSelected(){const ids=selected();if(!ids.length){msg('请先勾选图片',true);return}const payload={items:ids.map(i=>({batch_id:items[i].batch_id,image_id:items[i].image_id,decision:'ACCEPTED',accepted_bbox:boxValues(i),reviewer:'历史补确认'}))};if(ids.some(i=>!hasBox(i))){msg('accepted_bbox 必须是 0~1 范围内的有效框；无框图片请先清空后手动框选',true);return}try{const d=await api('/api/dataset-accepted-bbox/bulk',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});msg('已确认 '+d.updated+' 张');offset=0;await load()}catch(e){msg(e.message,true)}}
function nextPage(){if(offset+limit<999999){offset+=limit;load()}}function prevPage(){offset=Math.max(0,offset-limit);load()}
load();
</script>
</body></html>
